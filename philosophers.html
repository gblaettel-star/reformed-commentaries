    influence: [{"icon": "✦", "text": "MacIntyre showed that the Enlightenment project of grounding morality in neutral reason has failed, leaving modern people with competing moral fragments and no way to settle disputes."}, {"icon": "✦", "text": "He argued that rationality itself is rooted in traditions and communities — an insight that strengthened the case for distinctively Christian thought and practice."}, {"icon": "△", "text": "His final call to wait for “another — doubtless very different — St Benedict” inspired movements of Christian community, though his own tradition was Aristotelian and Thomist rather than Reformed."}],
    reformed: "MacIntyre’s diagnosis is a gift to Reformed Christians: secular morality has no foundation of its own, and moral reasoning is never neutral — points Van Til and Dooyeweerd made in their own way. Reformed readers will want to ground virtue not finally in Aristotle but in God’s law and the renewing work of the Spirit, and to see the church, not merely local community, as the setting for a life of virtue. But his analysis of why moral debate has broken down is one of the most illuminating of our time.",

  {
    name: "Taylor, Charles",
    dates: "1931–",

    bio: "Canadian philosopher at McGill University and a Roman Catholic, known for his studies of the modern self and of secularisation. His monumental <em>A Secular Age</em> (2007) asks how the West moved from a world in 1500 in which it was virtually impossible not to believe in God to one in 2000 in which belief is one option among many, and often the harder one. He describes modern people as living within an “immanent frame” — a world understood without reference to anything beyond it.",
    influence: [{"icon": "✦", "text": "Taylor showed that secularism is not simply what is left when religion is subtracted, but a new set of assumptions and stories that shape how everyone, believer or not, experiences the world."}, {"icon": "✦", "text": "His account of “expressive individualism” — the belief that each person must discover and express their own authentic self — explains much of modern culture, including sexuality and identity."}, {"icon": "△", "text": "His Catholic framework and his reluctance to make strong truth claims mean that his work diagnoses more than it prescribes."}],
    reformed: "Taylor has become one of the most important guides for Christians seeking to understand the culture they live and minister in. Writers such as Carl Trueman (<em>The Rise and Triumph of the Modern Self</em>) and James K. A. Smith have drawn heavily on him. Reformed readers will want to add what Taylor leaves out — the clear proclamation of the gospel and the authority of Scripture. But to preach to secular people we must understand how they see the world, and Taylor helps us do that.",

// ── State ───────────────────────────────────────────────────────────────────

let activeEra = 'all';

// ── Init ────────────────────────────────────────────────────────────────────

function init() {
  buildEraBar();
  render();
}

// ── Era Bar ─────────────────────────────────────────────────────────────────

function buildEraBar() {
  const bar = document.getElementById('eraBar');
  bar.innerHTML = ERAS.map(e =>
    `<button class="era-btn${e.id===activeEra?' active':''}" onclick="selectEra('${e.id}')">${e.label}</button>`
  ).join('');
}

function selectEra(id) {
  activeEra = id;
  buildEraBar();
  render();
}

// ── Render ──────────────────────────────────────────────────────────────────

function filtered() {
  const list = activeEra === 'all' ? PHILOSOPHERS : PHILOSOPHERS.filter(p => p.era === activeEra);
  return list.slice().sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
}

function sortKey(p) {
  // an explicit key, else the surname: "Kant, Immanuel", "Augustine of Hippo", "Plato"
  if (p.sort) return p.sort;
  const parts = p.name.split(',');
  if(parts.length > 1) return parts[0].trim().toLowerCase();
  if (/ of /.test(p.name)) return p.name.split(' of ')[0].trim().toLowerCase();
  const words = p.name.trim().split(/\s+/);
  return words[words.length-1].toLowerCase();
}

function firstLetter(p) {
  const k = sortKey(p);
  return k[0].toUpperCase();
}

function render() {
  const list = filtered();
  buildAZBar(list);
  buildNameIndex(list);
  if(!list.length) {
    document.getElementById('mainContent').innerHTML = '<div class="no-results">No philosophers found for this era.</div>';
    return;
  }
  // group by letter
  const groups = {};
  list.forEach(p => {
    const l = firstLetter(p);
    if(!groups[l]) groups[l] = [];
    groups[l].push(p);
  });
  let html = '';
  Object.keys(groups).sort().forEach(letter => {
    html += `<div class="letter-head" id="letter-${letter}">${letter}</div>`;
    groups[letter].forEach(p => { html += philCard(p); });
  });
  document.getElementById('mainContent').innerHTML = html;
  if (typeof linkifyScripture === 'function') linkifyScripture(document.getElementById('mainContent'), null, null);
}

function philCard(p) {
  // someone whose home is Theological Figures: a pointer, not a second entry
  if (p.see) {
    const a = p.name.replace(/[^a-z]/gi,'_');
    const eraLabel = ERAS.find(e => e.id === p.era)?.label || p.era;
    return `
<div class="phil-card phil-see" id="phil-${a}">
  <div class="phil-header">
    <div class="phil-name">${p.name}</div>
    <div class="phil-meta"><span>${p.dates}</span><span class="era-tag">${eraLabel}</span></div>
  </div>
  <div class="phil-body">
    <p>${p.note}</p>
    <p><a class="see-link" href="figures.html#${p.see}">Read the full entry in Theological Figures &#8594;</a></p>
  </div>
</div>`;
  }
  const eraLabel = ERAS.find(e => e.id === p.era)?.label || p.era;
  const anchor = p.name.replace(/[^a-z]/gi,'_');
  const influenceRows = p.influence.map(i =>
    `<div class="influence-row"><div class="infl-icon">${i.icon}</div><div class="infl-text">${i.text}</div></div>`
  ).join('');
  return `
<div class="phil-card" id="phil-${anchor}">
  <div class="phil-header">
    <div class="phil-name">${p.name}</div>
    <div class="phil-meta"><span>${p.dates}</span><span class="era-tag">${eraLabel}</span></div>
  </div>
  <div class="phil-body">
    <p>${p.bio}</p>
    <div class="influence-wrap">
      <div class="influence-label">Influence on Christian Thought</div>
      ${influenceRows}
    </div>
    <div class="reformed-box">
      <div class="reformed-label">Reformed Assessment</div>
      <div class="reformed-text">${p.reformed}</div>
    </div>
    <div class="key-work">
      <div class="kw-label">Key Work</div>
      <div class="kw-text">${p.keyWork}</div>
    </div>
  </div>
</div>`;
}

// ── A-Z Bar ──────────────────────────────────────────────────────────────────

function buildAZBar(list) {
  const letters = new Set(list.map(p => firstLetter(p)));
  const all = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const bar = document.getElementById('azBar');
  bar.innerHTML = all.map(l =>
    letters.has(l)
      ? `<span class="az-link" onclick="jumpTo('${l}')">${l}</span>`
      : `<span class="az-link dim">${l}</span>`
  ).join('');
}

function jumpTo(letter) {
  const el = document.getElementById('letter-' + letter);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Name Index ───────────────────────────────────────────────────────────────

function buildNameIndex(list) {
  const chips = document.getElementById('nameIndexChips');
  chips.innerHTML = list.map(p => {
    const anchor = p.name.replace(/[^a-z]/gi,'_');
    return `<span class="name-chip" onclick="jumpToPhil('${anchor}')">${p.name}</span>`;
  }).join('');
}

function jumpToPhil(anchor) {
  const el = document.getElementById('phil-' + anchor);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleNameIndex() {
  const chips = document.getElementById('nameIndexChips');
  const btn = document.querySelector('.name-index-toggle');
  chips.classList.toggle('open');
  btn.textContent = chips.classList.contains('open') ? '▲ Browse all names' : '▼ Browse all names';
}

// ── Icon legend ──────────────────────────────────────────────────────────────
// ✦ = positive influence  △ = mixed/complex  ▲ = challenging/negative

init();

function resetPage() {
  activeEra = 'all';
  buildEraBar();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
