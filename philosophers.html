// ── State ───────────────────────────────────────────────────────────────────

let activeEra = 'all';

// ── Init ────────────────────────────────────────────────────────────────────

function init() {
  buildEraBar();
  render();
}

// ── Era Bar ─────────────────────────────────────────────────────────────────

function buildEraBar() {
  const bar = document.getElementById('eraBar');
  bar.innerHTML = ERAS.map(e =>
    `<button class="era-btn${e.id===activeEra?' active':''}" onclick="selectEra('${e.id}')">${e.label}</button>`
  ).join('');
}

function selectEra(id) {
  activeEra = id;
  buildEraBar();
  render();
}

// ── Render ──────────────────────────────────────────────────────────────────

function filtered() {
  const list = activeEra === 'all' ? PHILOSOPHERS : PHILOSOPHERS.filter(p => p.era === activeEra);
  return list.slice().sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
}

function sortKey(p) {
  // sort by last name (last word of name)
  const parts = p.name.split(',');
  if(parts.length > 1) return parts[0].trim().toLowerCase();
  const words = p.name.trim().split(/\s+/);
  return words[words.length-1].toLowerCase();
}

function firstLetter(p) {
  const k = sortKey(p);
  return k[0].toUpperCase();
}

function render() {
  const list = filtered();
  buildAZBar(list);
  buildNameIndex(list);
  if(!list.length) {
    document.getElementById('mainContent').innerHTML = '<div class="no-results">No philosophers found for this era.</div>';
    return;
  }
  // group by letter
  const groups = {};
  list.forEach(p => {
    const l = firstLetter(p);
    if(!groups[l]) groups[l] = [];
    groups[l].push(p);
  });
  let html = '';
  Object.keys(groups).sort().forEach(letter => {
    html += `<div class="letter-head" id="letter-${letter}">${letter}</div>`;
    groups[letter].forEach(p => { html += philCard(p); });
  });
  document.getElementById('mainContent').innerHTML = html;
}

function philCard(p) {
  const eraLabel = ERAS.find(e => e.id === p.era)?.label || p.era;
  const anchor = p.name.replace(/[^a-z]/gi,'_');
  const influenceRows = p.influence.map(i =>
    `<div class="influence-row"><div class="infl-icon">${i.icon}</div><div class="infl-text">${i.text}</div></div>`
  ).join('');
  return `
<div class="phil-card" id="phil-${anchor}">
  <div class="phil-header">
    <div class="phil-name">${p.name}</div>
    <div class="phil-meta"><span>${p.dates}</span><span class="era-tag">${eraLabel}</span></div>
  </div>
  <div class="phil-body">
    <p>${p.bio}</p>
    <div class="influence-wrap">
      <div class="influence-label">Influence on Christian Thought</div>
      ${influenceRows}
    </div>
    <div class="reformed-box">
      <div class="reformed-label">Reformed Assessment</div>
      <div class="reformed-text">${p.reformed}</div>
    </div>
    <div class="key-work">
      <div class="kw-label">Key Work</div>
      <div class="kw-text">${p.keyWork}</div>
    </div>
  </div>
</div>`;
}

// ── A-Z Bar ──────────────────────────────────────────────────────────────────

function buildAZBar(list) {
  const letters = new Set(list.map(p => firstLetter(p)));
  const all = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const bar = document.getElementById('azBar');
  bar.innerHTML = all.map(l =>
    letters.has(l)
      ? `<span class="az-link" onclick="jumpTo('${l}')">${l}</span>`
      : `<span class="az-link dim">${l}</span>`
  ).join('');
}

function jumpTo(letter) {
  const el = document.getElementById('letter-' + letter);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Name Index ───────────────────────────────────────────────────────────────

function buildNameIndex(list) {
  const chips = document.getElementById('nameIndexChips');
  chips.innerHTML = list.map(p => {
    const anchor = p.name.replace(/[^a-z]/gi,'_');
    return `<span class="name-chip" onclick="jumpToPhil('${anchor}')">${p.name}</span>`;
  }).join('');
}

function jumpToPhil(anchor) {
  const el = document.getElementById('phil-' + anchor);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleNameIndex() {
  const chips = document.getElementById('nameIndexChips');
  const btn = document.querySelector('.name-index-toggle');
  chips.classList.toggle('open');
  btn.textContent = chips.classList.contains('open') ? '▲ Browse all names' : '▼ Browse all names';
}

// ── Icon legend ──────────────────────────────────────────────────────────────
// ✦ = positive influence  △ = mixed/complex  ▲ = challenging/negative

init();

function resetPage() {
  activeEra = 'all';
  buildEraBar();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
