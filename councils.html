const COUNCILS = [
  {
    name: 'Council of Nicaea I',
    year: 325,
    era: 'ecumenical',
    location: 'Nicaea, Bithynia',
    type: 'ecumenical',
    atStake: 'Whether the Son of God is truly and fully divine — co-equal and co-eternal with the Father — or a created being of lesser status, as Arius taught.',

    outcomes: [

    stillMatters: 'Nicaea is the bedrock of Christian orthodoxy. Without it, there is no Trinity, no incarnation in the full sense, and no atonement of infinite worth. Every time a Jehovah\'s Witness knocks on your door, Nicaea is what they are undoing. Athanasius\'s courage — exiled five times rather than sign a compromise — remains the model for every Christian who stands alone against institutional pressure for the sake of truth.',

  {

    era: 'ecumenical',
    location: 'Constantinople',
    type: 'ecumenical',
    atStake: 'The full deity of the Holy Spirit (denied by the Pneumatomachians/"Spirit-fighters") and the final defeat of Arianism, which had dominated the Eastern church for decades after Nicaea.',
    decided: 'The Nicene Creed was expanded and finalized — the version recited in churches today. The Spirit was confessed as "the Lord and giver of life, who proceeds from the Father, who together with the Father and Son is worshipped and glorified." Arianism was definitively condemned.',
    figures: ['Emperor Theodosius I', 'Gregory of Nazianzus', 'Gregory of Nyssa', 'Basil of Caesarea (recently deceased)', 'Macedonius'],
    outcomes: [
      { icon: '⚖', text: 'Produced the Niceno-Constantinopolitan Creed — the full Nicene Creed as used in Christian worship ever since.' },
      { icon: '⚖', text: 'Condemned Macedonianism (Pneumatomachianism) — the denial of the full deity and personhood of the Holy Spirit.' },

    stillMatters: 'This council completed the doctrine of the Trinity as the church confesses it. The Holy Spirit is not a force, an influence, or a lesser divine being — He is fully God, the third person of the Trinity, equally worthy of worship and glory. The Nicene Creed produced here is the most universally confessed statement of Christian faith in history, recited by Catholic, Orthodox, and Protestant churches every Sunday across the world.',
    keyDoc: 'Niceno-Constantinopolitan Creed (381)'

  {

    stillMatters: 'The affirmation of <em>Theotokos</em> is about Christ, not Mary. It guards the conviction that the child born in Bethlehem is the eternal Son of God — that the one born of Mary and the one who is Lord of all are the same person. A Christ who is two loosely joined persons cannot be our mediator. The Nestorian Church of the East survived in Persia and spread along the Silk Road to China — a reminder that major theological controversies rarely disappear entirely.',

  },

  {

    figures: ['Emperor Justinian I', 'Pope Vigilius (under enormous imperial pressure)', 'Theodore of Mopsuestia (posthumously condemned)'],

    stillMatters: 'The condemnation of apokatastasis (universal salvation) here is the conciliar answer to Origen\'s attractive but unbiblical conclusion. Hell is not remedial; the lost are lost eternally. The council also illustrates the danger of imperial theology — Justinian\'s relentless pressure on Pope Vigilius, who eventually capitulated, is a case study in what happens when the church allows the state to set its theological agenda.',
    keyDoc: 'Canons of Constantinople II (553); Fourteen Anathemas against Origen'
  },
  {
    name: 'Council of Orange II',
    year: 529,
    era: 'early',
    location: 'Orange, Gaul',

    stillMatters: 'Orange II is the Catholic church\'s own conciliar condemnation of Semi-Pelagianism — a fact often forgotten in Protestant-Catholic dialogue. The council\'s language is recognizably Augustinian and anticipates Reformation soteriology at several points. That the medieval church progressively retreated from Orange into the very Semi-Pelagianism it had condemned is one of the great ironies of church history — and one of the reasons the Reformation was necessary.',

    stillMatters: 'Constance is the hinge between the medieval church and the Reformation. Hus\'s martyrdom proved that the church could not reform itself from within — that the institutional pressure was too great, the corruption too deep. Luther read Hus\'s treatises and wept that the church had burned a man who taught the Gospel. Every Reformation insight about Scripture\'s authority over councils was sharpened by what Constance did to Hus.',
    keyDoc: 'Decrees of Constance (1414–1418); Jan Hus, On the Church (1413)'

  {
    name: 'Council of Trent',
    year: 1545,
    era: 'reformation',
    location: 'Trent, Northern Italy',
    type: 'counter',
    atStake: 'The entire Protestant Reformation. Trent was convened to define Catholic doctrine in response to Luther, Calvin, and the spread of Protestantism across Europe. Every Reformation doctrine was directly addressed and rejected.',
    decided: 'Scripture and Tradition are co-equal authorities (against Sola Scriptura). Justification involves both imputed and infused righteousness and can be increased by meritorious works (against Sola Fide). The Mass is a propitiatory sacrifice. Purgatory is affirmed. Seven sacraments. The Vulgate is the authoritative Bible text. Anathemas were pronounced against justification by faith alone.',

// ── State ───────────────────────────────────────────────────────────────────
let activeFilter = 'all';

function init() { buildFilterBar(); render(); }

function buildFilterBar() {
  document.getElementById('filterBar').innerHTML = FILTERS.map(f =>
    `<button class="filter-btn${f.id===activeFilter?' active':''}" onclick="selectFilter('${f.id}')">${f.label}</button>`
  ).join('');
}

function selectFilter(id) { activeFilter = id; buildFilterBar(); render(); }

function resetPage() { activeFilter = 'all'; buildFilterBar(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function filtered() {
  return activeFilter === 'all' ? COUNCILS.slice() : COUNCILS.filter(c => c.era === activeFilter);
}

function eraLabel(id) { return FILTERS.find(f=>f.id===id)?.label || id; }

function typeTag(type) {
  const map = {
    ecumenical: ['type-ecumenical','Ecumenical'],
    reformed:   ['type-reformed','Reformed'],
    counter:    ['type-counter','Counter-Reformation'],
    regional:   ['type-regional','Regional / Provincial'],
  };
  const [cls,label] = map[type] || ['type-regional', type];
  return `<span class="type-tag ${cls}">${label}</span>`;
}

function render() {
  const list = filtered();
  buildIndex(list);
  if(!list.length){ document.getElementById('mainContent').innerHTML='<div class="no-results">No councils found for this filter.</div>'; return; }
  // group by era
  const eraOrder = ['early','ecumenical','medieval','reformation','modern'];
  const groups = {};
  list.forEach(c => { if(!groups[c.era]) groups[c.era]=[]; groups[c.era].push(c); });
  let html = '';
  eraOrder.filter(e => groups[e]).forEach(e => {
    html += `<div class="era-head">${eraLabel(e)}</div>`;
    groups[e].sort((a,b)=>a.year-b.year).forEach(c => { html += councilCard(c); });
  });
  document.getElementById('mainContent').innerHTML = html;
}

function councilCard(c) {
  const anchor = c.name.replace(/[^a-z]/gi,'_');
  const figChips = c.figures.map(f=>`<span class="figure-chip">${f}</span>`).join('');
  const outcomeRows = c.outcomes.map(o=>`<div class="outcome-row"><div class="out-icon">${o.icon}</div><div class="out-text">${o.text}</div></div>`).join('');
  return `
<div class="council-card" id="council-${anchor}">
  <div class="council-header">
    <div class="council-name">${c.name}</div>
    <div class="council-meta"><span>${c.year} AD &nbsp;·&nbsp; ${c.location}</span>${typeTag(c.type)}</div>
  </div>
  <div class="council-body">
    <div class="two-col">
      <div class="col-box"><span class="col-label">At Stake</span><div class="col-text">${c.atStake}</div></div>
      <div class="col-box"><span class="col-label">What Was Decided</span><div class="col-text">${c.decided}</div></div>
    </div>
    <div class="figures-wrap">
      <div class="figures-label">Key Figures</div>
      <div class="figure-chips">${figChips}</div>
    </div>
    <div class="outcome-wrap">
      <div class="outcome-label">Outcomes</div>
      ${outcomeRows}
    </div>
    <div class="still-matters">
      <div class="still-label">Why It Still Matters</div>
      <div class="still-text">${c.stillMatters}</div>
    </div>
    <div class="key-doc">
      <span class="kd-label">Key Document</span>
      <span class="kd-text">${c.keyDoc}</span>
    </div>
  </div>
</div>`;
}

function buildIndex(list) {
  document.getElementById('indexChips').innerHTML = list.sort((a,b)=>a.year-b.year).map(c => {
    const anchor = c.name.replace(/[^a-z]/gi,'_');
    return `<span class="index-chip" onclick="jumpTo('council-${anchor}')">${c.name} (${c.year})</span>`;
  }).join('');
}

function jumpTo(id) { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function toggleIndex() {
  const chips = document.getElementById('indexChips');
  const btn = document.querySelector('.index-toggle');
  chips.classList.toggle('open');
  btn.textContent = chips.classList.contains('open') ? '▲ Browse all councils' : '▼ Browse all councils';
}

init();
</script>
<script src="share.js" data-card-selector=".council-card"></script>
<script src="esv-links.js"></script>
