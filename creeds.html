// ── State ───────────────────────────────────────────────────────────────────
let activeFilter = 'all';

function init() { buildFilterBar(); render(); }

function buildFilterBar() {
  document.getElementById('filterBar').innerHTML = FILTERS.map(f =>
    `<button class="filter-btn${f.id===activeFilter?' active':''}" onclick="selectFilter('${f.id}')">${f.label}</button>`
  ).join('');
}

function selectFilter(id) { activeFilter = id; buildFilterBar(); render(); }

function resetPage() { activeFilter = 'all'; buildFilterBar(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function filtered() {
  return activeFilter === 'all' ? CREEDS.slice() : CREEDS.filter(c => c.tradition === activeFilter);
}

function tradTag(t) {
  const map = {
    ecumenical: ['trad-ecumenical','Ecumenical'],
    reformed:   ['trad-reformed','Reformed'],
    lutheran:   ['trad-lutheran','Lutheran'],
    baptist:    ['trad-baptist','Baptist'],
  };
  const [cls,label] = map[t] || ['trad-reformed',t];
  return `<span class="trad-tag ${cls}">${label}</span>`;
}

function render() {
  const list = filtered().slice().sort((a,b)=>a.yearSort-b.yearSort);
  buildIndex(list);
  if(!list.length){ document.getElementById('mainContent').innerHTML='<div class="no-results">No creeds found for this filter.</div>'; return; }
  // group by tradition category
  const groups = { ecumenical:[], reformed:[], lutheran:[], baptist:[] };
  list.forEach(c => { if(groups[c.tradition]) groups[c.tradition].push(c); });
  const labels = { ecumenical:'Ecumenical Creeds', reformed:'Reformed Confessions', lutheran:'Lutheran Confessions', baptist:'Baptist Confessions' };
  let html = '';
  ['ecumenical','reformed','lutheran','baptist'].forEach(t => {
    if(!groups[t].length) return;
    if(activeFilter !== 'all') {
      groups[t].forEach(c => { html += creedCard(c); });
    } else {
      html += `<div class="era-head">${labels[t]}</div>`;
      groups[t].forEach(c => { html += creedCard(c); });
    }
  });
  document.getElementById('mainContent').innerHTML = html;
}

function creedCard(c) {
  const anchor = c.name.replace(/[^a-z]/gi,'_');
  const textParas = c.text.map(t=>`<p>${t}</p>`).join('');
  const artRows = c.articles.map(a=>`<div class="article-row"><div class="art-icon">${a.icon}</div><div class="art-text">${a.text}</div></div>`).join('');
  const guardChips = c.guards.map(g=>`<span class="guard-chip">${g}</span>`).join('');
  return `
<div class="creed-card" id="creed-${anchor}">
  <div class="creed-header">
    <div class="creed-name">${c.name}</div>
    <div class="creed-meta"><span>${c.year}</span>${tradTag(c.tradition)}</div>
  </div>
  <div class="creed-body">
    <p style="margin-bottom:1rem;color:#a0b8c8;font-size:.9rem;line-height:1.7">${c.origin}</p>
    <div class="text-block">
      <span class="text-label">Selected Text</span>
      <div class="creed-text">${textParas}</div>
    </div>
    <div class="articles-wrap">
      <div class="articles-label">Key Articles &amp; What They Teach</div>
      ${artRows}
    </div>
    <div class="guards-wrap">
      <div class="guards-label">Guards Against</div>
      <div class="guard-chips">${guardChips}</div>
    </div>
    <div class="still-matters">
      <div class="still-label">Why It Still Matters</div>
      <div class="still-text">${c.stillMatters}</div>
    </div>
    <div class="use-box">
      <span class="use-label">How to Use It</span>
      <span class="use-text">${c.howToUse}</span>
    </div>
  </div>
</div>`;
}

function buildIndex(list) {
  document.getElementById('indexChips').innerHTML = list.map(c => {
    const anchor = c.name.replace(/[^a-z]/gi,'_');
    return `<span class="index-chip" onclick="jumpTo('creed-${anchor}')">${c.name} (${c.year})</span>`;
  }).join('');
}

function jumpTo(id) { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function toggleIndex() {
  const chips = document.getElementById('indexChips');
  const btn = document.querySelector('.index-toggle');
  chips.classList.toggle('open');
  btn.textContent = chips.classList.contains('open') ? '▲ Browse all creeds' : '▼ Browse all creeds';
}

init();
</script>
<script src="share.js" data-card-selector=".creed-card"></script>
<script src="esv-links.js"></script>
