    era: 'Post-Reformation',
    name: 'Thomas Watson',
    anchor: 'watson',
    dates: 'c. 1620–1686',
    tradition: 'Reformed / Puritan',
    tagline: 'The most readable of the Puritans — whose prose sparkles with wit, warmth, and the kind of illustrations that lodge in the mind and never quite leave',
    body: `<p>Thomas Watson is the Puritan you give to people who say they cannot read Puritans. Where Owen is dense and Baxter is exhaustive and Goodwin is vast, Watson is clear, vivid, warm, and irresistibly quotable. He served as rector of St Stephen's Walbrook in London — one of the finest churches in the city — until the Great Ejection of 1662, when he was thrown out of his pulpit along with two thousand other Nonconformist ministers for refusing to conform to the Act of Uniformity. He continued preaching illegally in private homes, was briefly imprisoned, and spent the rest of his life teaching and writing in Crosby Square. He was not a controversialist by temperament. He was a pastor. And everything he wrote has the quality of a man who has been sitting with his people in their joys and griefs for years and has learned what they actually need to hear.</p>
<p>His <em>A Body of Divinity</em> — a systematic exposition of the Westminster Shorter Catechism, originally delivered as sermons — is the most accessible introduction to Reformed systematic theology ever written. It is precise without being cold, doctrinal without being arid, and full of illustrations so vivid that they become part of the way you think about the truths they illuminate. On the love of God: "God's love is a love without a cause in us; it is a free love, as the sun shines on a dunghill." On faith: "The eye has no light of itself; it only sees by the light of the sun. So faith has no power of itself; it only lays hold on Christ." On repentance: "A sinner may be weeping and not repenting. The tears may run down his face, and yet his heart go after his covetousness." Every sentence earns its place. There is no padding in Watson.</p>
<p>His other great works — <em>The Doctrine of Repentance</em>, <em>All Things for Good</em> (on Romans 8:28), and <em>The Beatitudes</em> — share the same quality: dense with Scripture, illustrated from ordinary life, and written by a man who has thought hard about every word and wants each one to do something in the soul of the reader. He died in 1686, in retirement at Barnston in Essex, reportedly while in private prayer. The man who had spent his life teaching others how to commune with God was found, at the end, in the act of it. That is the best possible ending for a Puritan minister, and Watson earned it.</p>`,
    quote: 'Till sin be bitter, Christ will not be sweet.',
    quoteSource: 'The Doctrine of Repentance',
    keyWork: 'A Body of Divinity (1692) — The most accessible systematic theology in the Puritan tradition. Begin with the opening sections on the chief end of man and the nature of God. You will not put it down.',
    whyRead: 'Because Watson will teach you Reformed theology without ever making you feel like you are in a lecture. He is warm, witty, and precise — the Puritan who writes like he actually enjoys it. Read him when doctrine feels dry. He will cure that immediately.'
  },

  {
    era: '19th Century',
    name: 'George Müller',
    anchor: 'muller',
    dates: '1805–1898',
    tradition: 'Plymouth Brethren / Reformed evangelical',
    tagline: 'The man who fed ten thousand orphans by prayer alone — and kept a journal of answered prayers that runs to thousands of pages',
    body: `<p>George Müller was born in Prussia, converted in his early twenties through the witness of a small prayer meeting, and moved to England where he eventually settled in Bristol. In 1836 he opened the first of his orphan houses on Wilson Street, taking in children who had nowhere to go and committing — publicly and formally — never to ask any human being for money to fund it. He would tell God. He would keep records of every prayer and every answer. And he would publish those records, not to solicit funds, but to demonstrate to a sceptical, prayerless generation that God hears and answers the prayers of those who trust Him. That experiment ran for sixty years. By the time he died, he had cared for more than ten thousand orphans, built five large houses on Ashley Down in Bristol, and recorded tens of thousands of specific answered prayers — down to the day the bread arrived when there was none, and the exact hour the coal came when the children were cold.</p>
<p>His method was precise and deliberate. He would identify a need, bring it to God in prayer, record it in his journal, and wait — sometimes for days, sometimes for years. He prayed for the conversion of five specific friends for decades. The last of them was converted shortly after Müller's death. He never wavered. His <em>Autobiography</em> — really a heavily edited version of his journals — is one of the most remarkable documents in the history of Christian prayer: page after page of specific requests, specific answers, specific dates, and the recurring doxology that God is faithful. It is not mysticism. It is accounting, done by a man who took the promises of Scripture literally and found them literally true.</p>
<p>In his seventies, having established the orphanages and handed them over to his son-in-law, Müller spent the last seventeen years of his life in continuous world travel — preaching in country after country, often to crowds of thousands, through interpreters, at an age when most men are confined to armchairs. He was eighty-seven when he completed his last world tour. He died in 1898 at ninety-two, having led a prayer meeting the night before. His estate, when probated, amounted to a few hundred pounds — everything else had gone to the work. He had given away, in his lifetime, the equivalent of millions of pounds, every penny of it received in answer to prayer. The experiment was conclusive.</p>`,
    quote: 'The beginning of anxiety is the end of faith, and the beginning of true faith is the end of anxiety.',
    quoteSource: 'Autobiography of George Müller',
    keyWork: 'The Autobiography of George Müller (compiled 1905) — Not a conventional autobiography but a record of God\'s faithfulness across sixty years. Read it slowly, one answered prayer at a time. It will change how you pray.',
    whyRead: 'Because Müller did not theorise about prayer — he staked ten thousand children\'s lives on it, kept meticulous records, and published the results. Read him when you suspect your prayers are not really doing anything. He is the most empirical argument in history that they are.'
  },

  {
    era: '19th Century',
    name: 'Charles Hodge',
    anchor: 'hodge',
    dates: '1797–1878',
    tradition: 'Reformed / Old Princeton',
    tagline: 'The systematic theologian of Old Princeton — who shaped the Reformed mind in America for a century and boasted that no new idea had ever originated at Princeton',
    body: `<p>Charles Hodge taught at Princeton Theological Seminary for fifty-six years — from 1820 until his retirement in 1876 — and in that time trained nearly three thousand ministers. No other theologian in American history has had more direct influence on the shape of the Reformed ministry. He taught every subject the seminary offered, founded and edited the <em>Biblical Repertory and Princeton Review</em> for four decades, and produced a body of work — commentaries on Romans, Corinthians, Ephesians, and his three-volume <em>Systematic Theology</em> — that remains the standard of Old Princeton orthodoxy. At his jubilee celebration in 1872, he made the remark for which he is most remembered: "I am not afraid to say that a new idea never originated in this seminary." He meant it as a boast. Princeton's task was not innovation but the faithful transmission of the Reformed faith as it had been received — from Scripture, through the Westminster Standards, down to the present generation.</p>
<p>His three-volume <em>Systematic Theology</em>, completed in 1873, is the most comprehensive statement of Reformed orthodox theology produced in America. It is organised along classical lines — theology proper, anthropology, soteriology, eschatology — and works through each topic with a thoroughness and precision that has never been surpassed in the American Reformed tradition. Hodge was not a speculative theologian; he was a biblical theologian in the old sense — one who believed that systematic theology was nothing more than the organised teaching of Scripture, and that the theologian's task was to listen to what the Bible said and arrange it faithfully. His treatment of justification, of original sin, of the covenant of grace, and of the work of the Holy Spirit are models of careful, exegetically grounded Reformed doctrine.</p>
<p>He was also, by all accounts, a man of deep personal warmth. His lectures were full of illustrations from everyday life. Students from across the denominational spectrum came to Princeton to sit under him. He corresponded with scholars in Germany and Britain and engaged their arguments with a fairness that they acknowledged even when they disagreed with his conclusions. His faith was not merely professional — it was the air he breathed. A student who visited him on his deathbed found him reading his Greek New Testament. "Do you read it with the same freshness and joy as always?" the student asked. "Oh, more," Hodge replied. "Much more." He died in June 1878, holding his Greek Testament. It was found open to the book of Romans.</p>`,
    quote: 'The Bible is to the theologian what nature is to the man of science. It is his store-house of facts.',
    quoteSource: 'Systematic Theology, Vol. 1',
    keyWork: 'Systematic Theology (3 vols., 1871–73) — The summit of Old Princeton Reformed theology. Daunting in scope; begin with Volume II on anthropology and soteriology. His commentary on Romans is the more accessible entry point.',
    whyRead: 'Because Hodge will give your faith a skeleton. He is not devotional reading — he is structural reading. After Hodge, you know what you believe, why you believe it, and where it sits in relation to everything else. That kind of theological clarity is a gift that keeps giving.'
  },

  {
    era: 'Modern',
    name: 'Sinclair Ferguson',
    anchor: 'ferguson',
    dates: '1948–',
    tradition: 'Reformed / Presbyterian',
    tagline: 'The pastor-theologian who makes the deepest Reformed doctrine feel like good news — because to him, it always is',
    body: `<p>Sinclair Ferguson was born in Glasgow, converted as a teenager, trained at the University of Aberdeen, and has spent his life as a minister, a seminary professor, and a writer of Reformed theology that consistently achieves the rare combination of doctrinal rigour and pastoral warmth. He served congregations in Scotland and the United States, taught at Westminster Theological Seminary and Reformed Theological Seminary, and became one of the most trusted voices in the Reformed world — a man who could be equally at home delivering a paper at an academic conference and sitting with a grieving family at midnight. The two were never, for Ferguson, separate callings. Theology that does not serve people in their actual lives was not, in his view, doing its job.</p>
<p>His greatest contribution to the contemporary church is his recovery and exposition of the Puritan heritage — particularly the work of John Owen — for ordinary readers. His <em>John Owen on the Christian Life</em> introduced a generation to Owen's interior theology; his <em>The Holy Spirit</em> is the most accessible and comprehensive Reformed pneumatology of the last century; his <em>The Whole Christ</em> — an exposition of the "Marrow Controversy" of eighteenth-century Scotland and its implications for the free offer of the gospel — is arguably the most important work of Reformed pastoral theology published in the last thirty years. Its central argument, that the antidote to both legalism and antinomianism is a richer and fuller grasp of the gospel itself, landed with the force of a thunderclap among ministers and lay readers who recognised in it the diagnosis of their own spiritual condition.</p>
<p>Ferguson preaches with the same quality that characterises his writing: precise, warm, textually anchored, and consistently moving toward Christ. He is not a man who uses theological precision to keep people at arm's length from the gospel. He uses it to bring them closer. His expositions of the Westminster Confession and the Shorter Catechism have helped thousands of Christians discover that their confessional heritage is not a museum piece but a living description of the faith they actually hold. He remains in active ministry — preaching, writing, and speaking — in his late seventies, with no visible diminishment of the clarity or the warmth. The Reformed world is still learning from him, and rightly so.</p>`,
    quote: 'The whole of the Christian life is learning, in increasing measure, to say Abba, Father.',
    quoteSource: 'Children of the Living God',
    keyWork: 'The Whole Christ (2016) — On legalism, antinomianism, and the free grace of the gospel. The book that helped a generation understand why the gospel is not just the entry point of the Christian life but its whole atmosphere. Essential.',
    whyRead: 'Because Ferguson will show you that Reformed theology is not a cage that constrains the gospel — it is the structure that sets it free. He makes doctrine feel like what it always was meant to feel like: the best possible news, stated with the greatest possible precision.'
  },

  {
    era: 'Post-Reformation',
    name: 'William Perkins',
    anchor: 'perkins',
    dates: '1558–1602',
    tradition: 'Reformed / Puritan',
    tagline: 'The father of Puritanism — who turned Cambridge into a nursery of Reformed ministers and gave the movement its theological method',
    body: `<p>William Perkins died at forty-four, having compressed into that short life a body of work that shaped the entire Puritan movement for the next century. He was a fellow of Christ's College, Cambridge, and his preaching at Great St Andrew's Church drew students and townspeople in such numbers that he became the most influential Reformed preacher in Elizabethan England. The list of men who sat under him, or who were directly shaped by his writings, reads like a roll call of the first generation of Puritanism: Paul Baynes, William Ames, Richard Sibbes, John Cotton. Through them, his influence flowed into every strand of the movement — into the colonies of New England, into the Westminster Assembly, into the devotional tradition that would eventually produce Bunyan and Baxter and Owen. Perkins is the root from which all of them grew.</p>
<p>His great contribution was not a single book but a method: the method of applying Reformed doctrine to the individual conscience with precision and pastoral care. He was the master of what the Puritans called "cases of conscience" — the art of diagnosing the specific spiritual condition of a specific person and bringing the right word of Scripture to bear on it. His <em>A Golden Chain</em> — a schematic account of the order of salvation, from election through glorification, laid out in a visual diagram that was reprinted across Europe — gave the Reformed world a clear, accessible map of how God saves. His <em>The Art of Prophesying</em>, a manual on preaching, was the standard textbook for Reformed ministers for a generation. Its core principle — that preaching must move from the text of Scripture to the doctrine it contains to its application in the life of the hearer — became the architectural method of Puritan homiletics.</p>
<p>He preached regularly in the Cambridge prison, and many condemned men heard the gospel from him and died with hope. He was himself a man who had known the terror of a guilty conscience — his conversion came through a word overheard in the street about a man "so wicked that he made the devil himself ashamed" — and he never forgot what it felt like to be on the wrong side of a holy God. That memory gave his pastoral work its urgency and its tenderness. He died in 1602, from a kidney stone, attended by his friend Paul Baynes. The movement he had fathered was just beginning. He had lit a fire that burned for a hundred years after him.</p>`,
    quote: 'The Word of God alone is to direct us in all matters pertaining to religion; and therefore we must content ourselves with what it reveals, and not search further.',
    quoteSource: 'A Golden Chain',
    keyWork: 'The Art of Prophesying (1592) — The foundational Puritan manual on preaching: how to handle Scripture, how to draw out doctrine, how to apply it to the conscience. Still the best short account of expository preaching ever written.',
    whyRead: 'Because Perkins built the house that all the other Puritans lived in. Understanding him is understanding where the whole tradition came from — and discovering that the questions he was asking about Scripture, conscience, and the applied gospel are exactly the questions the church still needs to answer.'
  },

  {
    era: 'Post-Reformation',
    name: 'Thomas Goodwin',
    anchor: 'goodwin',
    dates: '1600–1680',
    tradition: 'Reformed / Puritan / Independent',
    tagline: 'The theologian of the heart — who wrote more tenderly about the emotional life of Christ, and the believer\'s union with Him, than any other Puritan',
    body: `<p>Thomas Goodwin was one of the towering figures of seventeenth-century Puritanism — a man of vast learning, deep piety, and a theological imagination that worked constantly at the intersection of doctrine and the interior life. He was educated at Cambridge, served as a minister and chaplain, and became one of the key figures at the Westminster Assembly of 1643–1649, where the Westminster Confession and Catechisms were drafted. He later served as President of Magdalen College, Oxford, under Oliver Cromwell, and was ejected from his position at the Restoration in 1660. He spent his final twenty years in London, preaching to an Independent congregation and completing the vast body of work that fills twelve volumes of his collected writings.</p>
<p>His masterpiece is the two-volume work known as <em>The Heart of Christ in Heaven Towards Sinners on Earth</em> — a sustained meditation on Hebrews 4:15 and what it means that the ascended, glorified Christ still has a human heart, still feels, still is moved by compassion toward His struggling people on earth. Goodwin's argument is that the humanity of Christ was not left behind at the ascension. He took it with Him. The heart that wept over Jerusalem, that was moved with compassion for the leper, that grieved at the tomb of Lazarus — that heart is still beating, right now, at the right hand of the Father, and it is turned toward you. This is not sentimentality. It is exegetically grounded, carefully argued, and pastorally explosive. Ministers who have discovered this book report that it changed how they counsel the depressed, the doubting, and the despairing.</p>
<p>His other great works include <em>Christ Set Forth</em> — on union with Christ as the foundation of justifying faith — and <em>The Object and Acts of Justifying Faith</em>, which is among the most careful accounts of how faith lays hold of Christ in the Reformed tradition. He also wrote a remarkable treatise on the spiritual experience of the believer, <em>The Work of the Holy Ghost in Our Salvation</em>, which traces with extraordinary precision the interior movements of the soul from conviction through assurance. Goodwin is not easy reading — his sentences run long and his arguments are intricate. But those who push through are rewarded with a depth of insight into the grace and tenderness of Christ that few other writers have ever matched.</p>`,
    quote: 'There is not a smile upon the face of the universe so sweet as the smile of Christ upon a believing soul.',
    quoteSource: 'The Heart of Christ in Heaven Towards Sinners on Earth',
    keyWork: 'The Heart of Christ in Heaven Towards Sinners on Earth (1651) — The most tender and theologically precise account of the compassion of the ascended Christ ever written. Read it when you feel too sinful, too weak, or too far gone to come to Christ.',
    whyRead: 'Because Goodwin will show you that the Christ you are coming to is not a cold judge waiting to weigh your worthiness — He is a man who still feels, still grieves, still has compassion, and whose heart at this moment is turned toward you. That changes everything about how you come to Him.'
  },

  {
    era: 'Post-Reformation',
    name: 'Samuel Rutherford',
    anchor: 'rutherford',
    dates: 'c. 1600–1661',
    tradition: 'Reformed / Presbyterian',
    tagline: 'The letter-writer of Scotland — whose prison correspondence breathes a love for Christ so intense it almost singes the page',
    body: `<p>Samuel Rutherford was banished from his parish at Anwoth in Galloway in 1636 — exiled to Aberdeen by the bishops of Charles I for preaching against Arminianism and episcopal church government — and it was during that exile that he wrote the letters that would make him immortal. Confined to Aberdeen, forbidden to preach, separated from his congregation whom he loved with an almost anguished tenderness, he wrote to them constantly. He wrote to fellow ministers, to noblewomen, to the troubled, the grieving, the doubting, and the dying. Nearly four hundred of these letters survive. They were published in 1664 as <em>Letters of Samuel Rutherford</em>, and they have never been out of print since. C.H. Spurgeon said they were the nearest thing to inspired writing outside of Scripture. Andrew Bonar called Rutherford "the seraphic Rutherford." That is not hyperbole.</p>
<p>What makes the letters extraordinary is not their theology alone — though they are deeply theological — but the white-hot intensity of Rutherford's love for Christ. He writes about Christ as a man writes about someone he is genuinely, consumingly in love with: with longing, with delight, with the pain of absence and the ecstasy of nearness. "Oh, if ye saw the beauty of Christ!" he writes to one correspondent. "Oh, if ye were sick of love for him as I am!" To another: "Jesus Christ came into my prison-cell last night, and every stone flashed like a ruby." The language is intense enough to be uncomfortable, and that discomfort is the point. It confronts you with the question of whether your own relationship with Christ could possibly be described in these terms — and if not, why not, and what that says.</p>
<p>Rutherford was a delegate at the Westminster Assembly, one of the sharpest minds in the room, and the author of <em>Lex Rex</em> (1644) — the most important seventeenth-century statement of the principle that kings are subject to law, not above it — a book for which he was charged with high treason at the Restoration in 1660. He was summoned to appear before Parliament to face the charge. He sent back word: "Tell them I have a summons already from a superior Judge, and I must answer my first summons." He died before Parliament could touch him. His last recorded words were: "I shall shine. I shall see Him as He is. I shall see Him reign, and all His fair company with Him. I count all things dross and dung in comparison." He had been saying that for thirty years. He meant it to the end.</p>`,
    quote: 'Oh, if ye saw the beauty of Christ! Oh, if ye were sick of love for Him as I am!',
    quoteSource: 'Letters of Samuel Rutherford',
    keyWork: 'Letters of Samuel Rutherford (1664) — Not a book to be read straight through, but to be opened anywhere and read slowly. Each letter is complete in itself. Keep it on your nightstand. Spurgeon read it all his life.',
    whyRead: 'Because Rutherford will make you feel the poverty of your own love for Christ by showing you what it looks like when it burns at full flame. He is not a model to imitate mechanically. He is a fire to stand near, in hopes that some of it catches.'
  },

  {
    era: '19th Century',
    name: 'Hudson Taylor',
    anchor: 'taylor',
    dates: '1832–1905',
    tradition: 'Reformed evangelical / China Inland Mission',
    tagline: 'The missionary who trusted God for everything — and opened the interior of China to the gospel by learning to live as the Chinese lived',
    body: `<p>James Hudson Taylor sailed for China in 1853, aged twenty-one, under a small missionary society that shortly afterwards collapsed — leaving him alone in Shanghai with no support, no salary, and no certain future. He stayed. He learned Mandarin and Shanghainese, adopted Chinese dress and a pigtail at a time when this was considered eccentric by Western missionaries and scandalous by the Chinese establishment, and began moving inland — into regions of China where no Protestant missionary had ever gone. He was driven by a single, uncomplicated conviction: that the millions of Chinese people dying without hearing the gospel were dying without hope, and that something had to be done about it, and that if he did not do it, he would answer to God for the omission. That conviction never left him for fifty years.</p>
<p>In 1865 he founded the China Inland Mission — the first faith mission, operating on the principle that its workers would make no salary appeals, send no begging letters, and depend entirely on God to supply their needs through the freewill gifts of those who prayed. The mission would work not in the treaty ports where Western missionaries clustered, but in the inland provinces — all eighteen of them, Taylor insisted — among people who had never once heard the name of Christ. It was an audacious vision. By the time of his death, the China Inland Mission had sent out eight hundred missionaries, planted churches in every province, and seen tens of thousands of Chinese people converted. The principle of faith funding — trusting God to supply without human pressure — had been vindicated on a scale that silenced its critics.</p>
<p>The spiritual secret of Taylor's life, discovered during a crisis in 1869 that left him near breakdown, was what he called "the exchanged life" — the discovery of Galatians 2:20, that Christ lives in the believer, and that the Christian's responsibility is not to strive harder but to trust more fully in the life of Another. "It is not my joy but His joy, not my strength but His strength, not my patience but His patience" — the word came to him through a letter from a friend, and it broke him open. His subsequent letters to his wife describe a man who had found an entirely different gear in the Christian life — not less active, but differently powered. He went on to give another thirty-five years to China, at a pace that would have broken a younger man.</p>`,
    quote: 'It does not matter, really, how great the pressure is; it only matters where the pressure lies — whether it comes between me and God, or whether it presses me nearer to His heart.',
    quoteSource: 'Hudson Taylor\'s Spiritual Secret',
    keyWork: 'Hudson Taylor\'s Spiritual Secret by Howard and Mary Taylor (1932) — The most inspiring missionary biography in the English language. Not Taylor\'s own writing, but the account of his life and the discovery of Galatians 2:20 that transformed it.',
    whyRead: 'Because Taylor staked his life, and the lives of hundreds of others, on the faithfulness of God — and God was faithful, in detail, across fifty years. Read him when your faith is timid and your vision is small. He will enlarge both.'
  },

  {
    era: '19th Century',
    name: 'D. L. Moody',
    anchor: 'moody',
    dates: '1837–1899',
    tradition: 'Evangelical / Congregationalist',
    tagline: 'The shoe salesman from Chicago who became the greatest evangelist of the nineteenth century — on his knees',
    body: `<p>Dwight Lyman Moody had almost no formal education, no theological training, and no obvious qualifications for the work that would make him the most influential evangelist of the nineteenth century. He was a shoe salesman in Boston, converted at eighteen through the witness of his Sunday school teacher Edward Kimball, who found him in the back of a store arranging shoes and spoke to him about Christ. Moody was converted on the spot — a conversion he described as nothing dramatic, no visions, no voices, just a quiet certainty that Christ had found him. He moved to Chicago, threw himself into Sunday school work and city mission, and began preaching with an energy and an evangelistic directness that drew crowds wherever he went. He had no pulpit oratory, no classical style. He told stories, he wept, he pleaded. People came, and they came back.</p>
<p>His great partnership with the musician Ira Sankey produced the evangelistic campaigns of the 1870s that swept through Britain and America — vast meetings, thousands converted, the established churches shaken and revived. In London alone, the 1875 campaign attracted over two and a half million people over four months. He was the Billy Graham of his century, with the same gift for speaking plainly to ordinary people, the same organisational genius, the same refusal to allow theological controversy to derail the evangelistic purpose. He founded the Northfield Schools in Massachusetts, the Moody Bible Institute in Chicago, and the Colportage Association — which distributed Christian literature at minimal cost to people who could not afford it. His institutions outlasted him by more than a century and are still doing their work.</p>
<p>The turning point of his ministry, he always said, was not his first great campaign but an experience of the filling of the Spirit on a street in New York City in 1871, after two women in his congregation had been praying for him for months. "I can only say that God revealed Himself to me," he wrote later, "and I had such an experience of His love that I had to ask Him to stay His hand. I went to preaching again. The sermons were not different; I did not present any new truths, and yet hundreds were converted." He never entirely understood what had happened. He spent the rest of his life trying to reproduce the conditions that had produced it — prayer, dependence, the Spirit's freedom — and praying that God would do it again. He died in 1899, having preached to an estimated hundred million people. His last words were: "Earth recedes, heaven opens before me. This is no dream. It is beautiful."</p>`,
    quote: 'The world has yet to see what God can do with and for and through and in a man who is fully and wholly consecrated to Him.',
    quoteSource: 'Quoted by Henry Varley, c. 1872',
    keyWork: 'The Overcoming Life (1896) — A short collection of Moody\'s most characteristic sermons: direct, warm, urgent, full of illustration and application. The best entry point into his preaching voice.',
    whyRead: 'Because Moody was an ordinary man — uneducated, unpolished, undistinguished — whom God used extraordinarily because he was available and dependent. His life is the answer to every Christian who thinks God can only use the exceptional. He uses the surrendered.'
  },

  {
    era: 'Modern',
    name: 'John MacArthur',
    anchor: 'macarthur',
    dates: '1939–',
    tradition: 'Reformed / Grace Community Church',
    tagline: 'The expository preacher who has worked through the entire New Testament verse by verse — and has never stopped insisting that the Bible means exactly what it says',
    body: `<p>John MacArthur became pastor of Grace Community Church in Sun Valley, California, in 1969 and has been there ever since — an almost unheard-of tenure in the modern era of pastoral mobility. He began preaching through the New Testament verse by verse from the first Sunday, and he has never changed his method. Fifty-plus years later, the complete series of expository sermons — over thirty-five hundred of them — covers every verse of the New Testament and much of the Old Testament, and is available free of charge through Grace to You, the media ministry he founded. It is the largest free library of expository Bible teaching in the world. On any given day, millions of people in every country on earth are listening to John MacArthur explain what the Bible says.</p>
<p>His method is the simplest possible: read the text, find out what it means in its original language and historical context, and say so plainly. He is not an entertainer. He does not use videos or dramatic lighting or narrative sermon structures borrowed from the TED Talk playbook. He opens the Bible, reads it carefully, explains it thoroughly, and applies it directly. The crowds at Grace Community have consistently run to several thousand on a Sunday, drawn not by spectacle but by the quality of the teaching. MacArthur's conviction — stated repeatedly and without apology — is that the Bible is sufficient: sufficient to save, sufficient to sanctify, sufficient to answer every question the church needs answered. This conviction has put him at odds with the therapeutic church culture, the seeker-sensitive movement, the charismatic movement, and much of contemporary evangelical practice. He has never seemed particularly troubled by that.</p>
<p>His <em>MacArthur New Testament Commentary</em> series, covering every book of the New Testament in thirty-three volumes, is the most comprehensive single-author expository commentary series in the Reformed evangelical tradition. It is the fruit of the same verse-by-verse work done from the pulpit, converted into print. His books on the gospel, on Scripture, on discipleship, and on the church have reached millions. He has been controversial — his cessationism, his hard cessationism regarding spiritual gifts, and his public engagements with charismatic and broader evangelical practice have generated sustained criticism from within the Reformed world as well as without. Those debates are real and unresolved. What is not in dispute is the body of expository work — the lifetime of opening the Scripture with precision, care, and unflinching conviction that it means what it says — which is, by any measure, one of the great pastoral achievements of the twentieth and twenty-first centuries.</p>`,
    quote: 'The Bible does not need to be made relevant. It is relevant. Our job is to teach it, not market it.',
    quoteSource: 'Ashamed of the Gospel',
    keyWork: 'The Gospel According to Jesus (1988) — MacArthur\'s most important book: a thorough examination of what Jesus actually said about what it means to follow Him, and a challenge to any gospel that has removed the call to repentance and discipleship.',
    whyRead: 'Because MacArthur has spent fifty years demonstrating that expository fidelity to the text is not a limitation on preaching — it is the source of its power. Read him when you are tempted to wonder whether the Bible, preached plainly, is still enough. It is. He has proved it every Sunday for five decades.'
  },

  {
    era: 'Modern',
    name: 'Alistair Begg',
    anchor: 'begg',
    dates: '1952–',
    tradition: 'Reformed / Presbyterian',
    tagline: 'The Scottish preacher in Cleveland — who has carried the cadences of the old country and the convictions of the old faith to a new world, without losing either',
    body: `<p>Alistair Begg was born and raised in Scotland, trained at the London School of Theology, served briefly in Scotland, and in 1983 became senior pastor of Parkside Church in Chagrin Falls, Ohio — a small congregation that grew under his ministry into one of the most significant Reformed evangelical churches in America. He has been there for over forty years, preaching verse by verse through the books of the Bible with a clarity, warmth, and dry Scottish wit that has made him one of the most beloved preachers in the English-speaking world. His radio and podcast ministry, Truth for Life, reaches millions of listeners daily — one of the most widely distributed expository preaching ministries anywhere.</p>
<p>Begg's preaching style is deceptively simple. He does not dazzle with complexity or impress with display. He reads the text, explains it in plain language, illustrates it from ordinary life, and applies it to the will and conscience of the hearer. The Scottish preaching tradition from which he comes — Lloyd-Jones, William Still, Eric Alexander — prizes exactly this: the direct address of Scripture to the human condition, without intermediary performance. But underneath the apparent simplicity is a rigorous textual discipline and a theological framework shaped by the Westminster Confession, by the Puritans, by Spurgeon, and by the conviction that the preacher's only authority is the Word he is expounding. He has often said that his job is to stand under the text, not over it. That posture is visible in every sermon.</p>
<p>He is also a man of conspicuous warmth — the pastor who remembers your name, who visits the hospital, who is recognisably the same person in the pulpit and at the dinner table. His <em>Lasting Impact</em> and <em>Brave by Faith</em> show the pastoral and devotional side of a ministry that is more than its preaching output. He has navigated controversy in recent years with a combination of conviction and grace that has not always pleased everyone — the mark, usually, of a man who is trying to be faithful rather than popular. He continues in active ministry at Parkside, preaching and teaching with undiminished energy in his seventies, still Scottish, still clear, still pointing to Christ with the simplicity that is the hardest thing in the world to achieve and sustain.</p>`,
    quote: 'The Bible is not a book to be admired — it is a book to be obeyed. The question is never simply what does it say. The question is always what does it require of me.',
    quoteSource: 'Truth for Life broadcast',
    keyWork: 'Brave by Faith (2021) — An exposition of Daniel for a generation living as a minority in a culture that no longer shares its values. Practical, warm, and full of the conviction that faithfulness is possible even when it is costly.',
    whyRead: 'Because Begg will remind you that faithful, plain, Christ-centred preaching does not need to be glamorous to be powerful. Forty years in one pulpit. Millions of listeners. The same text, the same gospel, the same God. That is what fidelity looks like.'
  }

];

// ── Era order ──────────────────────────────────────────────────────────────
const ERA_ORDER = ['Early Church','Medieval','Reformation','Post-Reformation','19th Century','Modern'];

// ── State ──────────────────────────────────────────────────────────────────
var currentEra = 'All';
var figIndexOpen = false;

// ── Boot ───────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  buildEraBar();
  buildFigIndex();
  renderFigures();
});

function resetPage() {
  currentEra = 'All';
  buildEraBar();
  renderFigures();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function buildEraBar() {
  var bar = document.getElementById('era-bar');
  var eras = ['All'].concat(ERA_ORDER);
  bar.innerHTML = eras.map(function(e) {
    return '<button class="era-btn' + (e === 'All' ? ' active' : '') + '" onclick="setEra(\'' + e + '\')">' + e + '</button>';
  }).join('');
}

function setEra(era) {
  currentEra = era;
  document.querySelectorAll('.era-btn').forEach(function(b) {
    b.classList.toggle('active', b.textContent === era);
  });
  renderFigures();
}

function buildFigIndex() {
  var chips = document.getElementById('fig-index-chips');
  var sorted = FIGURES.slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
  chips.innerHTML = sorted.map(function(f) {
    return '<a class="fig-chip-idx" onclick="jumpToFig(\'' + f.anchor + '\')">' + f.name + '</a>';
  }).join('');
  updateToggleLabel();
}

function toggleFigIndex() {
  figIndexOpen = !figIndexOpen;
  document.getElementById('fig-index-chips').classList.toggle('open', figIndexOpen);
  updateToggleLabel();
}

function updateToggleLabel() {
  var visible = currentEra === 'All' ? FIGURES.length : FIGURES.filter(function(f){ return f.era === currentEra; }).length;
  document.getElementById('fig-index-toggle').textContent = 'Browse ' + visible + ' figure' + (visible !== 1 ? 's' : '') + (figIndexOpen ? ' ▴' : ' ▾');
}

function jumpToFig(anchor) {
  // ensure era allows this figure
  var fig = FIGURES.find(function(f){ return f.anchor === anchor; });
  if (fig && currentEra !== 'All' && fig.era !== currentEra) {
    setEra('All');
  }
  setTimeout(function() {
    var el = document.getElementById(anchor);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function renderFigures() {
  var filtered = currentEra === 'All' ? FIGURES : FIGURES.filter(function(f){ return f.era === currentEra; });
  var noResults = document.getElementById('no-results');
  var main = document.getElementById('fig-main');

  if (filtered.length === 0) {
    noResults.style.display = '';
    main.innerHTML = '';
    updateToggleLabel();
    return;
  }
  noResults.style.display = 'none';

  // Group by era in ERA_ORDER sequence
  var groups = {};
  ERA_ORDER.forEach(function(e){ groups[e] = []; });
  filtered.forEach(function(f){ if(groups[f.era]) groups[f.era].push(f); });

  var html = '';
  ERA_ORDER.forEach(function(era) {
    var list = groups[era];
    if (!list || list.length === 0) return;
    html += '<div class="era-head">' + era + '</div>';
    list.forEach(function(f) {
      html += buildCard(f);
    });
  });

  main.innerHTML = html;
  updateToggleLabel();
}

function buildCard(f) {
  return '<div class="fig-card" id="' + f.anchor + '">'
    + '<div class="fig-header">'
    +   '<div class="fig-name">' + f.name + '</div>'
    +   '<div class="fig-meta">' + f.dates + ' &nbsp;·&nbsp; ' + f.tradition + ' &nbsp;·&nbsp; <em>' + f.tagline + '</em></div>'
    + '</div>'
    + '<div class="fig-body">'
    +   f.body
    +   '<div class="fig-quote-wrap">'
    +     '<div class="fig-quote-label">Famous Quote</div>'
    +     '<div class="fig-quote-text">&ldquo;' + f.quote + '&rdquo;</div>'
    +     '<div class="fig-quote-source">&mdash; ' + f.quoteSource + '</div>'
    +   '</div>'
    +   '<div class="fig-work-wrap">'
    +     '<div class="fig-work-label">Key Work</div>'
    +     '<div class="fig-work-text">' + f.keyWork + '</div>'
    +   '</div>'
    +   '<div class="fig-why-wrap">'
    +     '<div class="fig-why-label">Why Read Him</div>'
    +     '<div class="fig-why-text">' + f.whyRead + '</div>'
    +   '</div>'
    + '</div>'
    + '</div>';
}
</script>
</body>
</html>
