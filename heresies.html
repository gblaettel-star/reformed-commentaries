      { icon: '⚖', text: '<strong>Council of Nicaea (325 AD)</strong> — convened by Constantine, the Council declared that the Son is <em>homoousios</em> (of the same substance) as the Father. Arianism was formally condemned.' },

      { icon: '✦', text: '<strong>John Piper</strong> — his <em>Let the Nations Be Glad</em> and the Desiring God framework offer a sustained biblical alternative: God is most glorified in us when we are most satisfied in Him — not in His material gifts.' },
      { icon: '✦', text: '<strong>The Bible itself</strong> — Job suffered righteously. Paul had a thorn he could not remove (2 Cor. 12). Christ was a man of sorrows. The apostles were beaten, imprisoned, and killed. The Prosperity Gospel cannot survive contact with the actual text of Scripture.' },
    ],

      { icon: '✦', text: '<strong>B.B. Warfield</strong> — his <em>The Inspiration and Authority of the Bible</em> (1927) remains the most thorough scholarly defense of plenary verbal inspiration and inerrancy ever written.' },

    proponents: ['Noetus of Smyrna', 'Praxeas', 'Sabellius'],
    response: [
      { icon: '✦', text: '<strong>Tertullian</strong> — coined the term <em>trinitas</em> and gave the church its essential formula: one <em>substantia</em> (substance), three <em>personae</em> (persons). His <em>Against Praxeas</em> is the first sustained Trinitarian theology.' },

    stillMatters: 'Modalism is the official theology of "Oneness Pentecostalism" (United Pentecostal Church), which baptizes only "in Jesus\' name" and denies the Trinity. But softer modalism pervades evangelical worship: songs and sermons that treat Father, Son, and Spirit as interchangeable names for one undifferentiated God, or that speak of "the Father dying on the cross." The eternal, loving communion of three distinct persons is not a theological technicality — it is the heartbeat of the Gospel. The cross is the act of the eternal Son bearing the Father\'s just wrath, in the Spirit\'s power. Flatten the Trinity and the atonement collapses.',
    keyText: 'Tertullian, Against Praxeas (c. 213); Athanasian Creed (c. 5th century)'
  },

  },

// ── State ───────────────────────────────────────────────────────────────────

let activeEra = 'all';

// ── Init ────────────────────────────────────────────────────────────────────

function init() {
  buildEraBar();
  render();
}

// ── Era Bar ─────────────────────────────────────────────────────────────────

function buildEraBar() {
  const bar = document.getElementById('eraBar');
  bar.innerHTML = ERAS.map(e =>
    `<button class="era-btn${e.id===activeEra?' active':''}" onclick="selectEra('${e.id}')">${e.label}</button>`
  ).join('');
}

function selectEra(id) {
  activeEra = id;
  buildEraBar();
  render();
}

// ── Render ──────────────────────────────────────────────────────────────────

function filtered() {
  const list = activeEra === 'all' ? HERESIES : HERESIES.filter(h => h.era === activeEra);
  return list.slice().sort((a,b) => sortKey(a).localeCompare(sortKey(b)));
}

function sortKey(h) {
  const words = h.name.trim().split(/\s+/);
  // ignore leading "The "
  const first = words[0].toLowerCase() === 'the' ? words[1] : words[0];
  return first.toLowerCase();
}

function firstLetter(h) {
  return sortKey(h)[0].toUpperCase();
}

function render() {
  const list = filtered();
  buildAZBar(list);
  buildNameIndex(list);
  if(!list.length) {
    document.getElementById('mainContent').innerHTML = '<div class="no-results">No heresies found for this era.</div>';
    return;
  }
  const groups = {};
  list.forEach(h => {
    const l = firstLetter(h);
    if(!groups[l]) groups[l] = [];
    groups[l].push(h);
  });
  let html = '';
  Object.keys(groups).sort().forEach(letter => {
    html += `<div class="letter-head" id="letter-${letter}">${letter}</div>`;
    groups[letter].forEach(h => { html += heresyCard(h); });
  });
  document.getElementById('mainContent').innerHTML = html;
}

function heresyCard(h) {
  const eraLabel = ERAS.find(e => e.id === h.era)?.label || h.era;
  const anchor = h.name.replace(/[^a-z]/gi,'_');
  const verdictClass = h.verdict === 'condemned' ? 'verdict-condemned' : 'verdict-ongoing';
  const verdictText = h.verdict === 'condemned' ? '⚔ Formally Condemned' : '⚠ Ongoing Threat';

  const responseRows = h.response.map(r =>
    `<div class="response-row"><div class="resp-icon">${r.icon}</div><div class="resp-text">${r.text}</div></div>`
  ).join('');

  const proponentChips = h.proponents.map(p =>
    `<span class="proponent-chip">${p}</span>`
  ).join('');

  return `
<div class="heresy-card" id="heresy-${anchor}">
  <div class="heresy-header">
    <div class="heresy-name">${h.name}</div>
    <div class="heresy-meta">
      <span>${h.dates}</span>
      <span class="era-tag">${eraLabel}</span>
      <span class="verdict-tag ${verdictClass}">${verdictText}</span>
    </div>
  </div>
  <div class="heresy-body">
    <div class="error-box">
      <div class="error-label">The Error</div>
      <div class="error-text">${h.error}</div>
      ${h.errorQuote ? `<div class="error-quote">${h.errorQuote}</div>` : ''}
    </div>
    <div class="proponents-wrap">
      <div class="proponents-label">Key Proponents</div>
      <div class="proponent-chips">${proponentChips}</div>
    </div>
    <div class="response-wrap">
      <div class="response-label">How the Church Responded</div>
      ${responseRows}
    </div>
    <div class="still-matters">
      <div class="still-label">Why It Still Matters</div>
      <div class="still-text">${h.stillMatters}</div>
    </div>
    <div class="key-text-box">
      <div class="kt-label">Key Text</div>
      <div class="kt-text">${h.keyText}</div>
    </div>
  </div>
</div>`;
}

// ── A-Z Bar ──────────────────────────────────────────────────────────────────

function buildAZBar(list) {
  const letters = new Set(list.map(h => firstLetter(h)));
  const all = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const bar = document.getElementById('azBar');
  bar.innerHTML = all.map(l =>
    letters.has(l)
      ? `<span class="az-link" onclick="jumpTo('${l}')">${l}</span>`
      : `<span class="az-link dim">${l}</span>`
  ).join('');
}

function jumpTo(letter) {
  const el = document.getElementById('letter-' + letter);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Name Index ───────────────────────────────────────────────────────────────

function buildNameIndex(list) {
  const chips = document.getElementById('nameIndexChips');
  chips.innerHTML = list.map(h => {
    const anchor = h.name.replace(/[^a-z]/gi,'_');
    return `<span class="name-chip" onclick="jumpToHeresy('${anchor}')">${h.name}</span>`;
  }).join('');
}

function jumpToHeresy(anchor) {
  const el = document.getElementById('heresy-' + anchor);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function toggleNameIndex() {
  const chips = document.getElementById('nameIndexChips');
  const btn = document.querySelector('.name-index-toggle');
  chips.classList.toggle('open');
  btn.textContent = chips.classList.contains('open') ? '▲ Browse all heresies' : '▼ Browse all heresies';
}

init();

function resetPage() {
  activeEra = 'all';
  buildEraBar();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
<script src="share.js" data-card-selector=".heresy-card"></script>
</body>
