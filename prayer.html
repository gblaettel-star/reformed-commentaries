<body>
<header>
  <div class="header-top">
    <a class="home-link" href="index.html">&#8592; Home</a>
    <h1>Monthly Prayer</h1>
  </div>
  <h2>A Prayer for Every Month of the Year</h2>
</header>

<div class="month-nav" id="month-nav"></div>

<div class="intro-banner">
  <div class="intro-text">Each prayer follows the shape of the Lord's Prayer — adoration, confession, petition, forgiveness, and deliverance — and closes with supplication for the day ahead, your family, and your congregation. Read slowly. Pray each line.</div>
</div>

<main id="main"></main>

<script>
var MONTHS = [
  {
    name: 'January', theme: 'New beginnings under the sovereignty of God',
    verse_ref: 'Lamentations 3:22–23',
    verse: 'The steadfast love of the LORD never ceases; his mercies never come to an end; they are new every morning; great is your faithfulness.',
    prayer: [
      {
        label: 'Adoration',
        text: '<p>Our Father in heaven, hallowed be your name. You are the everlasting God, the Creator of the ends of the earth, who does not faint or grow weary. Before the mountains were brought forth, before you had formed the earth and the world, from everlasting to everlasting — you are God. A thousand years in your sight are as a watch in the night. You are Alpha and Omega, the first and the last, the beginning and the end. We stand at the threshold of a new year not with confidence in our own resolve, but with our eyes lifted to the hills from which our help comes. Our help comes from you, the Maker of heaven and earth. We worship you — the God who was, and is, and is to come.</p>'
      },
      {
        label: 'Confession',
        text: '<p>Forgive us, Lord, for the sins of the year now past — the pride we nursed in secret, the jealousy we dressed up as concern, the kindness we withheld when it was costly to give, the worship we offered with our lips while our hearts were far from you. We have been quick to speak and slow to listen. We have loved comfort more than holiness, and the praise of men more than your glory. We confess it all. Yet your mercies are new every morning — and so we come again to the cross, where our debt was paid in full, and we ask you to wash us clean and set our feet on a new path.</p>'
      },
      {
        label: 'Your Kingdom Come',
        text: '<p>Your kingdom come, your will be done on earth as it is in heaven. Make this year one of real advance for the gospel — in our city, in our nation, and to the ends of the earth. Open doors that no one can shut. Soften hearts that have long resisted you. Raise up faithful preachers, courageous missionaries, and quiet servants who do your work without applause. Conform your church more fully to the image of Christ, and let your name — not ours — be the name that is exalted.</p>'
      },
      {
        label: 'Daily Bread',
        text: '<p>Give us this day our daily bread. You know what we need before we ask, and you have never failed to provide it. Teach us to hold the gifts of this world with an open hand — to receive them with thanks and release them without grief. Guard us against the anxiety that forgets you are our shepherd, and against the greed that is never satisfied. Let contentment be our great gain.</p>'
      },
      {
        label: 'Forgiveness &amp; Deliverance',
        text: '<p>Forgive us our debts, as we also have forgiven our debtors. Root out every seed of bitterness before it takes hold and bears its bitter fruit. Soften us toward those who have wronged us, for we have been forgiven far more than we will ever be asked to forgive. Lead us not into temptation — into the old patterns, the familiar sins, the paths we have walked before to our shame — but deliver us from the evil one, who is prowling and patient. Remind us that greater is he who is in us than he who is in the world.</p>'
      },
      {
        label: 'For the Day Ahead',
        text: '<p>Grant us wisdom for this day — to number our hours and offer them back to you as a living sacrifice. Give us diligence: to start what needs starting, to finish what we have left undone, to do our work as unto the Lord and not merely unto men. Guard our tongues from careless words and our minds from restless, faithless worry. Make us quick to encourage and slow to criticize. Let us be fully present — to the people in front of us, to the work in our hands, and to your voice in the quiet moments. Keep our eyes fixed on what is true and good and of good report.</p>'
      },
      {
        label: 'For Family &amp; Congregation',
        text: '<p>We lift our families before you — the ones who share our home and the ones who are far away. Cover them in your grace. Bind them together in love. Where faith is fragile, strengthen it. Where there is distance, draw hearts together. We pray especially for any who do not yet know you — have mercy, Lord, and let this be the year. We pray for our congregation: sustain our pastor with your word and your Spirit, protect him from discouragement and pride alike. Unite our body around Christ. Let the word of God dwell richly among us, and let our love for one another be a witness to the watching world. To you be glory in the church and in Christ Jesus throughout all generations, forever and ever.</p>'
      }
    ]
  },
  {
    name: 'February', theme: 'The love of God poured into our hearts',
    verse_ref: 'Romans 5:8',
    verse: 'God shows his love for us in that while we were still sinners, Christ died for us.',
    prayer: [
      {
        label: 'Adoration',
        text: '<p>Our Father in heaven, hallowed be your name. You are love — not a soft sentiment that overlooks sin, but a holy, fierce, covenant love that looked at our ruin and was not deterred. You loved us before the foundation of the world. You loved us when we were dead in trespasses and sins. You loved us when we were enemies, and you did not wait for us to reach for you — you reached for us. You sent your Son, not to condemn but to save, not to keep his distance but to draw near, to take our flesh and bear our curse and rise again as our living Lord. This is love — not that we loved God, but that he loved us and sent his Son as the propitiation for our sins. We stand breathless before such love and offer you our worship.</p>'
      },
      {
        label: 'Confession',
        text: '<p>Lord, we confess that we have loved poorly — that we have loved you with a divided heart and loved our neighbors with reservation. We have sought the approval of men more than the smile of God. We have been quick to receive grace and slow to extend it. We have nursed grudges against those who have wronged us, forgetting the mountain of debt that has been cancelled in our own account. We have loved comfort, security, and reputation more than we have loved you. Forgive us. And by the power of your Spirit, set our affections in right order — you first, others second, ourselves last.</p>'
      },
      {
        label: 'Your Kingdom Come',
        text: '<p>Your kingdom come. Let the love of Christ be the unmistakable mark of your people — the thing the world cannot explain and cannot ignore. Break down the walls of division that have grown up in your church. Heal the fractures between brothers and sisters. Send your gospel into the broken homes, the hardened hearts, and the distant nations where love is unknown — and let it arrive as what it truly is: the best news in the world.</p>'
      },
      {
        label: 'Daily Bread',
        text: '<p>Give us this day our daily bread. You have promised that those who seek you will lack no good thing. We trust that promise today — for the practical needs of food and shelter and work, and for the deeper hungers that only you can fill. Teach us to be generous with what you give, knowing that the one who sows sparingly will reap sparingly, and the one who sows bountifully will reap bountifully.</p>'
      },
      {
        label: 'Forgiveness &amp; Deliverance',
        text: '<p>Forgive us our trespasses, as we forgive those who trespass against us. Lord, we name before you the person it is hardest to forgive — and we ask for the grace to release them, not because they deserve it, but because you have released us. Deliver us from the cold heart that keeps accounts. Lead us not into the temptation to love only those who love us back — even tax collectors do that. Deliver us from the evil one, who would use our wounds to make us hard.</p>'
      },
      {
        label: 'For the Day Ahead',
        text: '<p>Give us wisdom to love well today — not in the grand gesture but in the ordinary moment: the patient answer, the unhurried conversation, the task done quietly for someone else\'s benefit. Make us diligent in the work you have given us, not restless for what we do not have. Guard our mouths from words that wound, and fill them instead with words that build up. Let us look for one person today who needs to be seen, and see them. Let our work be an act of love, our rest be a gift received with gratitude, and our relationships be a small reflection of the love you have shown us.</p>'
      },
      {
        label: 'For Family &amp; Congregation',
        text: '<p>We pray for our families — that the love of God would be the very atmosphere of our homes, breathing through our patience, our forgiveness, and our delight in one another. Where love has grown cold, Lord, rekindle it. Where there is hurt between family members, bring healing. We pray for any in our family who are prodigals — far from you, far from us. Hold them. We pray for our congregation — that we would be known not for our buildings or our programs or our theological precision alone, but for the love we have for one another. Let that love draw the lonely and the wandering home. For yours is the kingdom, the power, and the glory, forever and ever.</p>'
      }
    ]
  },
  {
    name: 'March', theme: 'Suffering, perseverance, and the hope of glory',
    verse_ref: 'Romans 8:18',
    verse: 'I consider that the sufferings of this present time are not worth comparing with the glory that is to be revealed to us.',
    prayer: [
      {
        label: 'Adoration',
        text: '<p>Our Father in heaven, hallowed be your name. You are the God of all comfort — the Father of mercies who has never wasted a single tear, never allowed a single trial to fall outside your sovereign care. You are the shepherd who walks with his flock through the valley of the shadow of death, not around it. You are the refiner who sits by the fire, watching until he sees his own image in the metal. You work all things — all things — together for good for those who love you and are called according to your purpose. That is not a promise we can see from inside the trial. But it is a promise from the God who raised his Son from the dead, and so we trust it. We worship you, the God who redeems what breaks us.</p>'
      },
      {
        label: 'Confession',
        text: '<p>Forgive us, Lord, for grumbling against your providence — for acting as though your love for us fluctuates with our circumstances. When the road grew hard, we questioned your goodness. When the answer did not come, we doubted your care. We have trusted our own assessment of what is best and resented your wiser hand. Forgive our short-sightedness and our faithlessness. Renew within us a faith that can say with Job: though he slay me, yet will I trust him.</p>'
      },
      {
        label: 'Your Kingdom Come',
        text: '<p>Your kingdom come. Strengthen your church in places of persecution — the saints who worship in secret, who preach at great cost, who hold your name as their only treasure when everything else has been stripped away. Sustain them. Let their endurance be a testimony that the watching world cannot dismiss. And advance your gospel through their suffering, as you have always done — for the blood of the martyrs is the seed of the church.</p>'
      },
      {
        label: 'Daily Bread',
        text: '<p>Give us this day our daily bread. In seasons of illness, be our healer or our strength to bear it. In seasons of grief, be the God of all comfort who draws genuinely close. In seasons of confusion, be the lamp to our feet even when we cannot see beyond the next step. Give us today exactly what we need — no more and no less — and let it be enough, because you are enough.</p>'
      },
      {
        label: 'Forgiveness &amp; Deliverance',
        text: '<p>Forgive us our debts, as we also forgive our debtors. Deliver us from the bitterness that grows in the soil of unresolved pain — the slow poison that destroys the one who carries it. And deliver us from despair, that subtle enemy that tells us our situation is permanent and your promises are empty. Lead us not into temptation — and in the moments when temptation comes wrapped in exhaustion and hopelessness — meet us there, as you met Elijah under the broom tree, with bread and water and the word: arise, the journey is too great for you.</p>'
      },
      {
        label: 'For the Day Ahead',
        text: '<p>Grant us wisdom to persevere faithfully in what lies before us today, even if the progress is invisible. Give us diligence when the work is hard and the results are unseen. Guard us from the temptation to give up just before the breakthrough — we do not know how close the morning is. Let us run with endurance the race marked out for us, fixing our eyes not on the obstacles but on Jesus — the founder and perfecter of our faith — who for the joy set before him endured the cross and is now seated at the right hand of the throne of God. He endured. And in him, so can we.</p>'
      },
      {
        label: 'For Family &amp; Congregation',
        text: '<p>We pray for members of our family who are suffering right now — in body, carrying an illness that will not lift; in mind, bound by anxiety or depression; in spirit, dry and far from you. Draw near to them with a nearness they can feel. We pray for our congregation — for the weary ones in the back row who are barely holding on, for the ones whose faith is flickering, for the ones who are grieving what no one else knows about. Be their shepherd. Carry the lambs. And let your church be the community where the suffering are not hidden but held. For yours is the kingdom, the power, and the glory, forever and ever.</p>'
      }
    ]
  },
  {
    name: 'April', theme: 'The resurrection and the life',
    verse_ref: 'John 11:25',
    verse: 'Jesus said to her, "I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live."',
    prayer: [
      {
        label: 'Adoration',
        text: '<p>Our Father in heaven, hallowed be your name. You are the God who raises the dead — and you have proved it. On the third day, the stone was rolled away. The grave clothes lay folded. The tomb was empty. And the risen Christ stood in the garden and spoke a woman\'s name, and everything changed. Death is not the final word. Sin is not the final word. The grave has lost its sting and death has lost its victory, because you — the Lord of life — entered our death and came out the other side, the firstborn from the dead, the firstfruits of those who have fallen asleep. We worship you, the living God, the risen Lord, the one who holds the keys of death and Hades in his nail-scarred hands. Hallelujah — what a Savior.</p>'
      },
      {
        label: 'Confession',
        text: '<p>Forgive us for living as practical unbelievers — for carrying the weight of fear and shame and death-dread as though the resurrection had never happened. We have been anxious about the future you hold. We have clung to things that are passing away and neglected the things that are eternal. We have forgotten that the same power that raised Jesus Christ from the dead now lives in us — and lived accordingly small, timid, faithless lives. Forgive us. Raise us up. Let the resurrection be not merely a doctrine we affirm but a reality we inhabit.</p>'
      },
      {
        label: 'Your Kingdom Come',
        text: '<p>Your kingdom come. Let the message of the resurrection go forth in this generation with the same unstoppable power it carried in the first. Raise up preachers who preach Christ crucified and risen with the conviction of men who have staked everything on its truth. Open the eyes of those who walk in the darkness of a world that believes death is final, that there is no judge, that there is no hope beyond the grave — and let the light of the resurrection dawn on them as it dawned in that first empty tomb.</p>'
      },
      {
        label: 'Daily Bread',
        text: '<p>Give us this day our daily bread. You are the bread of life — and we need more than physical sustenance. Feed our souls from your word. Let the risen Christ be the companion of our ordinary days as he was the companion of those two disciples on the road to Emmaus, opening the Scriptures and making our hearts burn within us.</p>'
      },
      {
        label: 'Forgiveness &amp; Deliverance',
        text: '<p>Forgive us our trespasses — every one of them was carried to the cross and nailed there, and the stone is rolled away. There is therefore now no condemnation for those who are in Christ Jesus. Deliver us from the fear of death — that ancient weapon by which the enemy has held the whole human race in bondage. Remind us that to live is Christ, and to die is gain. We are more than conquerors through him who loved us.</p>'
      },
      {
        label: 'For the Day Ahead',
        text: '<p>Give us wisdom to live this day in the light of eternity — to invest in what will last and hold loosely what will not. Make us diligent and purposeful, not anxious, because our labor in the Lord is never in vain. Guard our tongues from the grumbling that forgets whose we are. Let the joy of the resurrection — real, solid, unshakeable joy — be the deep current beneath this ordinary day. And when we encounter discouragement or failure, let us remember: Sunday always follows Friday.</p>'
      },
      {
        label: 'For Family &amp; Congregation',
        text: '<p>We pray for family members who do not yet know the risen Christ — Lord, have mercy. Let this be the season when the penny drops, when the blindness lifts, when the resurrection becomes not a story about someone else but the hinge on which their own life turns. We pray for our congregation — that we would be a resurrection community, unmistakably alive, where death is not feared and grief is not without hope. Let the world look at us and see people who believe that the grave is not the end. For yours is the kingdom, the power, and the glory, forever and ever.</p>'
      }
    ]
  },
  {
    name: 'May', theme: 'The word of God and the life of faith',
    verse_ref: 'Psalm 119:105',
    verse: 'Your word is a lamp to my feet and a light to my path.',
    prayer: [
      {
        label: 'Adoration',
        text: '<p>Our Father in heaven, hallowed be your name. You are the God who speaks — who refused to leave us in the dark, who lit the lamp of your word and set it on a hill for every wandering soul to find. Your word is not merely ancient wisdom or moral instruction; it is living and active, sharper than any two-edged sword, piercing to the division of soul and spirit, judging the thoughts and intentions of the heart. It is breathed out by you — God-breathed — and it carries your authority, your power, and your love in every line. Heaven and earth will pass away, but your word will not pass away. We worship you, the God who has spoken — and is still speaking.</p>'
      },
      {
        label: 'Confession',
        text: '<p>Lord, we confess that we have treated your word carelessly — skimming it when we should have lingered, setting it aside when the day filled up, reading it to check a box rather than to meet you. We have known what you require and chosen our own way regardless. We have been hearers of the word and not doers, deceiving ourselves. We have let the noise of the world crowd out the still small voice. Forgive us. And restore in us a hunger for your word — a deep, desperate, joyful hunger that no lesser appetite can satisfy.</p>'
      },
      {
        label: 'Your Kingdom Come',
        text: '<p>Your kingdom come through the faithful preaching and teaching of your word. Give boldness to those who proclaim it — pastors who will not trim the message to suit the audience, teachers who handle the word of truth with care and courage. Protect your church from the slow drift of false teaching, from the doctrine that sounds almost right but leads away from Christ. And let the word of God run swiftly and be honored, not only from pulpits but in living rooms and workplaces and schools.</p>'
      },
      {
        label: 'Daily Bread',
        text: '<p>Give us this day our daily bread — and let your word be that bread. Man does not live by bread alone, but by every word that comes from the mouth of God. Nourish us today not merely with information but with encounter — let us meet you in the Scriptures as Moses met you at the burning bush: knowing we are standing on holy ground. Correct us where we need correcting. Comfort us where we need comforting. Equip us for the work you have prepared for us to do.</p>'
      },
      {
        label: 'Forgiveness &amp; Deliverance',
        text: '<p>Forgive us our debts. Cleanse us by the washing of water with the word — the word that sanctifies, that calls us back when we have wandered, that reminds us who we are and whose we are. Lead us not into temptation; when the enemy comes with his distortions and his half-truths, let the sword of the Spirit — which is the word of God — be ready in our hands. Deliver us from the one who twisted the word in Eden, and let us know the truth that sets us free.</p>'
      },
      {
        label: 'For the Day Ahead',
        text: '<p>Grant us wisdom drawn from your word for every decision we face today. Make us diligent to carry it with us — not merely as a verse pinned to a wall but as a living word we are actively obeying. Let it shape the way we speak to the difficult colleague, the way we handle temptation in the private moment, the way we respond when things go wrong. Guard us from the practical atheism that forgets your word the moment we step out the door. Let it be our meditation when we rise, our companion through the day, and our last thought before we sleep.</p>'
      },
      {
        label: 'For Family &amp; Congregation',
        text: '<p>We pray that your word would be honored in our homes — not merely owned but read, not merely read but discussed, not merely discussed but lived. Let our children grow up knowing that the Bible is not a religious decoration but the living word of the living God, more precious than silver, sweeter than honey. We pray for our congregation — that the Sunday sermon would not land on hard ground and be snatched away, but would take root and bear fruit thirty, sixty, a hundredfold. For yours is the kingdom, the power, and the glory, forever and ever.</p>'
      }
    ]
  },
  {
    name: 'June', theme: 'The Holy Spirit and the life of the church',
    verse_ref: 'Acts 1:8',
    verse: 'You will receive power when the Holy Spirit has come upon you, and you will be my witnesses in Jerusalem and in all Judea and Samaria, and to the end of the earth.',
    prayer: [
      {
        label: 'Adoration',
        text: '<p>Our Father in heaven, hallowed be your name. You are Father, Son, and Holy Spirit — the eternal, self-sufficient, overflowing communion of love and life, needing nothing and giving everything. And you did not leave your people as orphans. You sent the Spirit of your Son into our hearts, so that we cry with genuine intimacy: Abba! Father! The same Spirit who hovered over the face of the waters at creation, who came upon the prophets and anointed kings, who raised Jesus from the dead — that Spirit now makes his home in mortal clay, in us. We stand in breathless wonder at such condescension. He intercedes for us with groanings too deep for words, when we do not know what to pray. He seals us for the day of redemption. He produces in us what we cannot produce in ourselves. Holy, holy, holy — Lord God Almighty. The whole earth is full of your glory.</p>'
      },
      {
        label: 'Confession',
        text: '<p>Forgive us for grieving your Holy Spirit — for quenching his promptings with our indifference, for resisting his conviction with our stubbornness, for walking by sight when we should have walked by faith. We have been more formed by our culture than by your Spirit. We have sought spiritual experience without spiritual obedience. We have wanted the gifts of the Spirit more than the character of Christ. Forgive us, and renew a right and willing spirit within us — soft where we have grown hard, yielded where we have been resistant.</p>'
      },
      {
        label: 'Your Kingdom Come',
        text: '<p>Your kingdom come. Pour out your Spirit afresh on your church — not for our comfort alone, but for the advance of your glory. Revive what is dying. Rekindle what has grown cold. Give the Spirit of wisdom and revelation to your people, that we may know Christ more fully and make him known more boldly. And send your witnesses to the ends of the earth, empowered and unafraid, as you promised.</p>'
      },
      {
        label: 'Daily Bread',
        text: '<p>Give us this day our daily bread. Let the fruit of the Spirit — love, joy, peace, patience, kindness, goodness, faithfulness, gentleness, self-control — be produced in us today, not by our own effort, but by the Spirit who works in us to will and to act according to your good purpose. We cannot manufacture these things. We ask for them as gifts.</p>'
      },
      {
        label: 'Forgiveness &amp; Deliverance',
        text: '<p>Forgive us our trespasses, and let the Spirit apply that forgiveness deep into the places where guilt lingers. Lead us not into temptation — and in the moments of testing, let the Spirit be our strength and our escape. Deliver us from every work of the flesh — the pride, the lust, the anger, the envy — and produce in us instead the fruit that only heaven can grow.</p>'
      },
      {
        label: 'For the Day Ahead',
        text: '<p>Grant us today the wisdom that the Spirit alone can give — the discernment to know the right path when the choices are not obvious, the courage to walk it when it is costly, and the humility to course-correct when we have gone astray. Make us diligent in our callings — not in our own strength, straining and striving, but filled and directed by your Spirit, so that even our ordinary work becomes a channel of your grace in the world.</p>'
      },

var currentMonth = new Date().getMonth(); // 0-based

function buildNav() {
  var nav = document.getElementById('month-nav');
  var html = '';
  MONTHS.forEach(function(m, i) {
    html += '<button class="month-chip' + (i === currentMonth ? ' active' : '') + '" onclick="showMonth(' + i + ')">' + m.name + '</button>';
  });
  nav.innerHTML = html;
}

function showMonth(idx) {
  currentMonth = idx;
  document.querySelectorAll('.month-chip').forEach(function(c, i) {
    c.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.prayer-card').forEach(function(c) {
    c.classList.remove('visible');
  });
  var card = document.getElementById('card-' + idx);
  if (card) {
    card.classList.add('visible');
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function buildCards() {
  var main = document.getElementById('main');
  var html = '';
  MONTHS.forEach(function(m, i) {
    var sectionsHtml = '';
    m.prayer.forEach(function(s) {
      sectionsHtml += '<div class="prayer-section">'
        + '<span class="section-label">' + s.label + '</span>'
        + '<div class="prayer-text">' + s.text + '</div>'
        + '</div>';
    });
    html += '<div class="prayer-card' + (i === currentMonth ? ' visible' : '') + '" id="card-' + i + '">'
      + '<div class="prayer-header">'
      + '<div class="prayer-month-label">Monthly Prayer</div>'
      + '<div class="prayer-month-name">' + m.name + '</div>'
      + '<div class="prayer-theme">' + m.theme + '</div>'
      + '</div>'
      + '<div class="prayer-body">'
      + sectionsHtml
      + '<div class="amen">Amen.</div>'
      + '<div class="scripture-prompt">'
      + '<span class="scripture-prompt-label">A Word to Carry Into the Day</span>'
      + '<div class="scripture-prompt-ref">' + m.verse_ref + '</div>'
      + '<div class="scripture-prompt-text">&ldquo;' + m.verse + '&rdquo;</div>'
      + '</div>'
      + '</div>'
      + '</div>';
  });
  html += '<div class="footer-note">Scripture quotations are from the ESV&reg; Bible (The Holy Bible, English Standard Version&reg;),<br>copyright &copy; 2001 by Crossway, a publishing ministry of Good News Publishers.<br>Used by permission. All rights reserved.</div>';
  main.innerHTML = html;
}

buildNav();
buildCards();
