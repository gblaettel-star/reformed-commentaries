<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reformed Commentaries</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:#0d2137;color:#e8dcc8;min-height:100vh}

/* ── Header ── */
header{background:#1a3a5c;padding:1rem 1.5rem;display:flex;align-items:center;gap:.8rem;border-bottom:2px solid #c9a84c;position:sticky;top:0;z-index:100}
header h1{font-size:1.3rem;color:#c9a84c;letter-spacing:.05em;white-space:nowrap}
#home-btn{background:none;border:1px solid #c9a84c;color:#c9a84c;padding:.3rem .8rem;border-radius:4px;cursor:pointer;font-size:.9rem;white-space:nowrap;flex-shrink:0}
#home-btn:hover{background:#c9a84c;color:#0d2137}
nav{display:flex;align-items:center;gap:.4rem;flex:1;justify-content:flex-end}
nav button{background:none;border:1px solid #c9a84c;color:#c9a84c;padding:.35rem .8rem;border-radius:4px;cursor:pointer;font-size:.95rem;flex-shrink:0}
nav button:hover{background:#c9a84c;color:#0d2137}
#unit-select{background:#0d2137;color:#c9a84c;border:1px solid #c9a84c;padding:.35rem .5rem;border-radius:4px;font-size:.9rem;flex:1;min-width:0;max-width:220px}

/* ── Home screen ── */
#home-screen{max-width:640px;margin:0 auto;padding:0}
.testament-label{color:#c9a84c;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;padding:.6rem 1.2rem .4rem;background:#0d2137;border-bottom:1px solid #2a4a6c}
.book-row{display:flex;align-items:center;padding:.85rem 1.2rem;border-bottom:1px solid #1a3050;cursor:pointer;transition:background .12s}
.book-row:hover{background:#1a3a5c}
.book-row:active{background:#22487a}
.row-name{color:#c9a84c;font-size:1rem;font-weight:bold;min-width:110px}
.row-sub{color:#7090b0;font-size:.82rem;flex:1}
.row-arrow{color:#3a5a7c;font-size:1rem;margin-left:.5rem}

/* ── Reader ── */
#reader-screen{display:none}
main{max-width:820px;margin:0 auto;padding:1.5rem}
h2{color:#c9a84c;font-size:1.4rem;margin-bottom:.3rem}
.ref{color:#a09070;font-size:.95rem;margin-bottom:1.2rem}
details{margin-bottom:.8rem;border:1px solid #2a4a6c;border-radius:6px;overflow:hidden}
summary{background:#1a3a5c;padding:.7rem 1rem;cursor:pointer;color:#c9a84c;font-weight:bold;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:#22487a}
.detail-body{padding:1rem;line-height:1.8}
.detail-body p{margin-bottom:.9rem}
.detail-body p:last-child{margin-bottom:0}
.passage-text{padding:1rem;line-height:1.8;color:#d4c4a8;font-style:italic;border-top:1px solid #2a4a6c}
.vbv-entry{padding:1rem;border-top:1px solid #2a4a6c}
.vbv-entry:first-child{border-top:none}
.vbv-ref{color:#c9a84c;font-weight:bold;margin-bottom:.3rem;font-size:.95rem}
.vbv-quote{font-style:italic;color:#d4c4a8;margin-bottom:.6rem;line-height:1.7}
.vbv-commentary{line-height:1.8}
.vbv-commentary p{margin-bottom:.7rem}
.vbv-commentary p:last-child{margin-bottom:0}
.accent-box{background:#112840;border-left:3px solid #c9a84c;padding:1rem 1.2rem;line-height:1.8}
.accent-box p{margin-bottom:.7rem}
.accent-box p:last-child{margin-bottom:0}
footer{text-align:center;padding:1.5rem;color:#a09070;font-size:.85rem;border-top:1px solid #2a4a6c;margin-top:2rem}
sup{font-size:.7em;vertical-align:super}
.verse-map{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.verse-chip{background:#112840;border:1px solid #2a4a6c;color:#c9a84c;font-size:.8rem;padding:.25rem .6rem;border-radius:20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.verse-chip:hover{background:#1a3a5c;border-color:#c9a84c}
.section-chip{background:#1a3a5c;border:1px solid #c9a84c;color:#c9a84c;font-size:.8rem;padding:.25rem .7rem;border-radius:4px;cursor:pointer;text-decoration:none;white-space:nowrap;font-weight:bold}
.section-chip:hover{background:#c9a84c;color:#0d2137}
.section-hd{background:#0a1e30;border-top:2px solid #c9a84c;padding:1rem 1.2rem}
.section-hd-ref{color:#c9a84c;font-weight:bold;font-size:.95rem;letter-spacing:.04em;margin-bottom:.8rem}
.section-hd-overview{color:#e8dcc8;line-height:1.85}
.section-hd-overview p{margin-bottom:.85rem}
.section-hd-overview p:last-child{margin-bottom:0}

/* ── Mobile ── */
@media(max-width:600px){
  header{padding:.5rem .6rem;gap:.4rem;overflow:hidden}
  header h1{display:none}
  #home-btn{padding:.3rem .5rem;font-size:.8rem}
  #home-btn .btn-text{display:none}
  nav{flex:1;gap:.3rem}
  nav button{padding:.3rem .6rem;font-size:.9rem;flex-shrink:0}
  #unit-select{flex:1;width:0;min-width:0;max-width:none;font-size:.85rem}
  .row-sub{display:none}
}
</style>
</head>
<body>

<header>
  <h1>Reformed Commentaries</h1>
  <button id="home-btn" onclick="showHome()" style="display:none">&#8962;<span class="btn-text"> Books</span></button>
  <nav id="reader-nav" style="display:none">
    <button onclick="navigate(-1)">&#8592;</button>
    <select id="unit-select" onchange="goTo(+this.value)"></select>
    <button onclick="navigate(1)">&#8594;</button>
  </nav>
</header>

<div id="home-screen">
  <div id="book-list"></div>
</div>

<div id="reader-screen">
  <main id="content"></main>
  <footer>Scripture quotations are from the ESV&reg; Bible &copy; 2001 Crossway. Used by permission. All rights reserved.</footer>
</div>

<script>
const BOOKS = [
  // Old Testament
  { id:'genesis',     title:'Genesis',     subtitle:'The Book of Origins',              testament:'OT', chapters:50 },
  { id:'proverbs',    title:'Proverbs',    subtitle:'Wisdom and the Fear of the LORD',   testament:'OT', chapters:31 },
  { id:'ecclesiastes',title:'Ecclesiastes',subtitle:'Vanity and the Fear of God',        testament:'OT', chapters:12 },
  { id:'isaiah',      title:'Isaiah',      subtitle:'The Evangelical Prophet',           testament:'OT', chapters:66 },
  // New Testament
  { id:'matthew',     title:'Matthew',     subtitle:'The King Has Come',                 testament:'NT', chapters:28 },
  { id:'john',        title:'John',        subtitle:'The Word Made Flesh',               testament:'NT', chapters:21 },
  { id:'acts',        title:'Acts',        subtitle:'The Unhindered Word',               testament:'NT', chapters:28 },
  { id:'ephesians',   title:'Ephesians',   subtitle:'Every Spiritual Blessing',          testament:'NT', chapters:6  },
  { id:'romans',      title:'Romans',      subtitle:'The Righteousness of God',          testament:'NT', chapters:16 },
  { id:'1john',       title:'1 John',      subtitle:'That You May Know',                 testament:'NT', chapters:5  },
  // Studies
  { id:'church-history',        title:'Church History',        subtitle:'Two Thousand Years of Grace',                      testament:'ST', chapters:8 },
  { id:'theology-distinctives', title:'Theology Distinctives', subtitle:'The Great Doctrines of the Reformed Faith',        testament:'ST', chapters:8 },
  { id:'covenant-theology',     title:'Covenant Theology',     subtitle:'The Backbone of Reformed Biblical Theology',       testament:'ST', chapters:6 },
  { id:'end-times',             title:'End Times Models',      subtitle:'Amillennialism, Premillennialism, Postmillennialism',testament:'ST', chapters:5 },
  { id:'denominations',         title:'Denominations',         subtitle:'The Major Christian Traditions and Their Distinctives',testament:'ST', chapters:9 },
  { id:'biblical-counseling',   title:'Biblical Counseling',   subtitle:'Caring for Souls with the Word of God',            testament:'ST', chapters:6 },
  { id:'hermeneutics',          title:'Hermeneutics',          subtitle:'The Art and Science of Biblical Interpretation',   testament:'ST', chapters:6 },
  { id:'christian-work',        title:'Christian at Work',     subtitle:'Vocation, Calling, and the Glory of God',          testament:'ST', chapters:6 },
  { id:'christian-marriage',    title:'Christian Marriage',    subtitle:'Covenant Love and the Gospel',                     testament:'ST', chapters:6 },
  { id:'christian-parenting',   title:'Christian Parenting',   subtitle:'Training Up Children in the Fear of the Lord',     testament:'ST', chapters:6 },
  { id:'christian-suffering',   title:'Christian Suffering',   subtitle:'Held Fast Through the Fire',                      testament:'ST', chapters:6 },
];

var currentBook = null;
var currentData = null;
var currentKeys = [];
var currentIdx  = 0;

// ── Home ─────────────────────────────────────────────────────────────────

function showHome() {
  document.getElementById('home-screen').style.display = '';
  document.getElementById('reader-screen').style.display = 'none';
  document.getElementById('home-btn').style.display = 'none';
  document.getElementById('reader-nav').style.display = 'none';
  document.title = 'Reformed Commentaries';
  window.scrollTo(0,0);
}

function buildHome() {
  var ot = BOOKS.filter(b => b.testament === 'OT');
  var nt = BOOKS.filter(b => b.testament === 'NT');
  var st = BOOKS.filter(b => b.testament === 'ST');
  var html = '';
  html += '<div class="testament-label">Old Testament</div>';
  html += ot.map(row).join('');
  html += '<div class="testament-label">New Testament</div>';
  html += nt.map(row).join('');
  html += '<div class="testament-label">Studies</div>';
  html += st.map(row).join('');
  document.getElementById('book-list').innerHTML = html;
}

function row(b) {
  return '<div class="book-row" onclick="openBook(\'' + b.id + '\')">'
    + '<div class="row-name">' + b.title + '</div>'
    + '<div class="row-sub">' + b.subtitle + '</div>'
    + '<div class="row-arrow">&#8250;</div>'
    + '</div>';
}

// ── Reader ───────────────────────────────────────────────────────────────

function openBook(id) {
  currentBook = BOOKS.find(b => b.id === id);
  localStorage.setItem('last-book', id);
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('reader-screen').style.display = 'block';
  document.getElementById('home-btn').style.display = 'block';
  document.getElementById('reader-nav').style.display = 'flex';
  document.title = currentBook.title;
  document.getElementById('content').innerHTML = '<p style="padding:2rem;color:#a09070;text-align:center">Loading&hellip;</p>';

  fetch('data/' + id + '.json')
    .then(r => r.json())
    .then(data => {
      currentData = data;
      currentKeys = Object.keys(data).map(Number).sort((a,b) => a-b);
      var sel = document.getElementById('unit-select');
      sel.innerHTML = '';
      currentKeys.forEach(k => {
        var o = document.createElement('option');
        o.value = k;
        var ref = data[k].ref || String(k);
        if (currentBook.testament === 'ST') {
          var title = data[k].title || '';
          var rangeMatch = title.match(/(\d{2,4})[–—\-](\d{2,4})/);
          if (rangeMatch) {
            o.textContent = rangeMatch[1] + '–' + rangeMatch[2];
          } else {
            var yearMatch = title.match(/\d{3,4}/);
            o.textContent = yearMatch ? yearMatch[0] : (ref.match(/\d+/) ? ref.match(/\d+/)[0] : ref.substring(0, 5));
          }
        } else {
          var num = ref.match(/\d+/);
          o.textContent = num ? num[0] : ref.substring(0, 5);
        }
        sel.appendChild(o);
      });
      var saved = localStorage.getItem(id + '-pos');
      var start = (saved !== null && data[+saved] !== undefined) ? +saved : currentKeys[0];
      render(currentKeys.indexOf(start));
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<p style="padding:2rem;color:#c9a84c">Could not load ' + currentBook.title + '.</p>';
    });
}

function render(idx) {
  if (!currentData || idx < 0 || idx >= currentKeys.length) return;
  currentIdx = idx;
  var k = currentKeys[idx];
  var ch = currentData[k];
  document.getElementById('unit-select').value = k;
  localStorage.setItem(currentBook.id + '-pos', k);

  var html = '';

  // Title block
  var title = ch.title || ch.subtitle || '';
  var ref   = ch.ref   || (k === 0 ? 'Introduction' : k === currentKeys[currentKeys.length-1] ? 'About' : '');
  if (title) html += '<h2>' + title + '</h2>';
  if (ref)   html += '<div class="ref">' + ref + '</div>';

  // ESV text
  if (ch.text) {
    html += '<details><summary>ESV Text</summary><div class="passage-text">' + ch.text + '</div></details>';
  }

  // Overview / intro
  var intro = ch.overview || ch.intro || '';
  if (intro) {
    html += '<details><summary>Overview</summary><div class="detail-body">' + intro + '</div></details>';
  }

  // Verse by verse
  if (ch.verseByVerse && ch.verseByVerse.length > 0) {
    // Chip map
    html += '<div class="verse-map">';
    ch.verseByVerse.forEach((v, i) => {
      html += '<a class="' + (v.sectionBreak ? 'section-chip' : 'verse-chip') + '" href="#vs' + i + '">' + v.ref + '</a>';
    });
    html += '</div>';
    // Section headers render outside <details> so they're always visible.
    // Verse entries are buffered and flushed into a <details> per section.
    var vbvLabel = currentBook.testament === 'ST' ? 'Details' : 'Verse by Verse';
    var verseBuffer = [];
    var curTheology = '';
    var curExamples = '';
    function flushVerses() {
      if (!verseBuffer.length) return;
      html += '<details open><summary>' + vbvLabel + '</summary>' + verseBuffer.join('') + '</details>';
      verseBuffer = [];
      if (curTheology) { html += '<details><summary>Theology</summary><div class="accent-box">' + curTheology + '</div></details>'; curTheology = ''; }
      if (curExamples) { html += '<details><summary>Then &amp; Now</summary><div class="accent-box">' + curExamples + '</div></details>'; curExamples = ''; }
    }
    ch.verseByVerse.forEach((v, i) => {
      if (v.sectionBreak) {
        flushVerses();
        html += '<div class="section-hd" id="vs' + i + '">';
        html += '<div class="section-hd-ref">' + v.ref + '</div>';
        if (v.sectionOverview) html += '<div class="section-hd-overview">' + v.sectionOverview + '</div>';
        html += '</div>';
        curTheology = v.theology || '';
        curExamples = v.examples || '';
      } else {
        var entry = '<div class="vbv-entry" id="vs' + i + '">';
        entry += '<div class="vbv-ref">' + v.ref + '</div>';
        if (v.quote) entry += '<div class="vbv-quote">&ldquo;' + v.quote + '&rdquo;</div>';
        if (v.commentary) entry += '<div class="vbv-commentary">' + v.commentary + '</div>';
        entry += '</div>';
        verseBuffer.push(entry);
      }
    });
    flushVerses();
  }

  // Sections (Isaiah style — handled for prototype)
  if (ch.sections && ch.sections.length > 0) {
    html += '<details open><summary>Commentary</summary>';
    ch.sections.forEach(sec => {
      html += '<div class="vbv-entry">';
      html += '<div class="vbv-ref">' + sec.title + (sec.ref ? ' <span style="color:#a09070;font-weight:normal;font-size:.85rem">— ' + sec.ref + '</span>' : '') + '</div>';
      if (sec.commentary) html += '<div class="vbv-commentary">' + sec.commentary + '</div>';
      html += '</div>';
    });
    html += '</details>';
  }

  // Theology
  if (ch.theology) {
    html += '<details><summary>Theology</summary><div class="accent-box">' + ch.theology + '</div></details>';
  }

  // Key verse (Isaiah)
  if (ch.keyVerse) {
    html += '<details><summary>Key Verse</summary><div class="accent-box">'
      + '<div class="vbv-ref">' + ch.keyVerse.ref + '</div>'
      + '<div class="vbv-quote">&ldquo;' + ch.keyVerse.quote + '&rdquo;</div>'
      + (ch.keyVerse.note ? '<div class="vbv-commentary">' + ch.keyVerse.note + '</div>' : '')
      + '</div></details>';
  }

  // Then & Now
  if (ch.examples) {
    html += '<details><summary>Then &amp; Now</summary><div class="accent-box">' + ch.examples + '</div></details>';
  }

  // Reflection (Isaiah)
  if (ch.reflection) {
    html += '<details><summary>For Reflection</summary><div class="accent-box"><p>' + ch.reflection + '</p></div></details>';
  }

  document.getElementById('content').innerHTML = html;
  window.scrollTo(0,0);
}

function goTo(k)         { render(currentKeys.indexOf(+k)); }
function navigate(dir)   { render(currentIdx + dir); }

// ── Init ─────────────────────────────────────────────────────────────────
buildHome();

var lastBook = localStorage.getItem('last-book');
if (lastBook && BOOKS.find(b => b.id === lastBook)) {
  openBook(lastBook);
} else {
  showHome();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
}
</script>
</body>
</html>
