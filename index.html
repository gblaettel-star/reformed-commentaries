<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soli Deo Gloria</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:#0d2137;color:#e8dcc8;min-height:100vh}

/* ── Header ── */
header{background:#1a3a5c;padding:.5rem 1rem .5rem;display:flex;flex-direction:column;gap:.4rem;border-bottom:2px solid #c9a84c;position:sticky;top:0;z-index:100}
header h1{font-size:1.15rem;color:#c9a84c;letter-spacing:.06em;text-align:center;cursor:pointer;padding:.3rem 0;touch-action:manipulation;user-select:none}
header h1:hover{opacity:.8}
nav{display:flex;align-items:stretch;gap:.4rem}
nav button{background:none;border:1px solid #c9a84c;color:#c9a84c;padding:.4rem .9rem;border-radius:6px;cursor:pointer;font-size:1.1rem;flex-shrink:0;min-height:2.75rem;min-width:3rem;touch-action:manipulation}
nav button:hover{background:#c9a84c;color:#0d2137}
nav button:disabled{opacity:.3;cursor:default}
nav button:disabled:hover{background:none;color:#c9a84c}
#unit-select{background:#0d2137;color:#c9a84c;border:1px solid #c9a84c;padding:.4rem .6rem;border-radius:6px;font-size:.95rem;flex:1;min-width:0;min-height:2.75rem}

/* ── Home screen ── */
#home-screen{width:100%;padding:0}

/* Collapsible section header */
.section-toggle{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.2rem;background:#1a3a5c;border-bottom:2px solid #c9a84c;cursor:pointer;user-select:none;touch-action:manipulation}
.section-toggle:hover{background:#22487a}
.section-toggle:active{background:#22487a}
.section-title{color:#c9a84c;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;font-family:'Georgia',serif}
.section-count{color:#7090b0;font-size:.72rem;letter-spacing:.06em}
.section-chevron{color:#c9a84c;font-size:1rem;transition:transform .2s;flex-shrink:0}
.section-chevron.open{transform:rotate(90deg)}
.section-body{overflow:hidden;transition:max-height .25s ease}

.book-row{display:flex;align-items:center;padding:.85rem 1.2rem;border-bottom:1px solid #1a3050;cursor:pointer;transition:background .12s}
.book-row:hover{background:#1a3a5c}
.book-row:active{background:#22487a}
.row-name{color:#c9a84c;font-size:1rem;font-weight:bold;min-width:110px}
.row-sub{color:#7090b0;font-size:.82rem;flex:1}
.row-arrow{color:#3a5a7c;font-size:1rem;margin-left:.5rem}

/* ── Reader ── */
#reader-screen{display:none}
main{width:100%;padding:1.5rem 2rem;overflow-wrap:break-word;word-break:break-word}
h2{color:#c9a84c;font-size:1.4rem;margin-bottom:.3rem}
.ref{color:#a09070;font-size:.95rem;margin-bottom:1.2rem}
details{margin-bottom:.8rem;border:1px solid #2a4a6c;border-radius:6px;overflow:hidden}
summary{background:#1a3a5c;padding:.7rem 1rem;cursor:pointer;color:#c9a84c;font-weight:bold;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:#22487a}
.detail-body{padding:1rem;line-height:1.8}
.detail-body p{margin-bottom:.9rem}
.detail-body p:last-child{margin-bottom:0}
.passage-text{padding:1rem;line-height:1.8;color:#d4c4a8;font-style:italic;border-top:1px solid #2a4a6c}
.vbv-entry{padding:1rem;border-top:1px solid #2a4a6c}
.vbv-entry:first-child{border-top:none}
.vbv-ref{color:#c9a84c;font-weight:bold;margin-bottom:.3rem;font-size:.95rem}
.vbv-quote{font-style:italic;color:#d4c4a8;margin-bottom:.6rem;line-height:1.7}
.vbv-commentary{line-height:1.8}
.vbv-commentary p{margin-bottom:.7rem}
.vbv-commentary p:last-child{margin-bottom:0}
.accent-box{background:#112840;border-left:3px solid #c9a84c;padding:1rem 1.2rem;line-height:1.8}
.accent-box p{margin-bottom:.7rem}
.accent-box p:last-child{margin-bottom:0}
footer{text-align:center;padding:1.5rem;color:#a09070;font-size:.85rem;border-top:1px solid #2a4a6c;margin-top:2rem}
sup{font-size:.7em;vertical-align:super}
.verse-map{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.verse-chip{background:#112840;border:1px solid #2a4a6c;color:#c9a84c;font-size:.8rem;padding:.25rem .6rem;border-radius:20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.verse-chip:hover{background:#1a3a5c;border-color:#c9a84c}
.section-chip{background:#1a3a5c;border:1px solid #c9a84c;color:#c9a84c;font-size:.8rem;padding:.25rem .7rem;border-radius:4px;cursor:pointer;text-decoration:none;font-weight:bold;white-space:normal;word-break:break-word}
.section-chip:hover{background:#c9a84c;color:#0d2137}
.section-hd{background:#0a1e30;border-top:2px solid #c9a84c;padding:1rem 1.2rem}
.section-hd-ref{color:#c9a84c;font-weight:bold;font-size:.95rem;letter-spacing:.04em;margin-bottom:.8rem}
.section-hd-overview{color:#e8dcc8;line-height:1.85}
.section-hd-overview p{margin-bottom:.85rem}
.section-hd-overview p:last-child{margin-bottom:0}

/* ── About (home screen) ── */
.about-section{padding:1.5rem 1.2rem 2rem;border-top:2px solid #c9a84c;margin-top:.5rem}
.about-title{color:#c9a84c;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin-bottom:1rem}
.about-body p{color:#7090b0;font-size:.82rem;line-height:1.75;margin-bottom:.8rem}
.about-body p:last-child{margin-bottom:0}

/* ── Mobile ── */
@media(max-width:640px){
  header{padding:.4rem .75rem .4rem}
  nav button{min-width:2.75rem;padding:.4rem .7rem}
  #unit-select{font-size:.85rem}
  .row-sub{display:none}
  .book-row{padding:.9rem 1rem}
  .row-name{font-size:.95rem}
  main{padding:1rem}
}
/* Tiny phones / very large zoom */
@media(max-width:380px){
  header h1{font-size:1rem}
  nav button{min-width:2.5rem;padding:.4rem .5rem;font-size:1rem}
  #unit-select{font-size:.8rem}
}
</style>
</head>
<body>

<header>
  <h1 onclick="showHome()">Soli Deo Gloria</h1>
  <nav id="reader-nav" style="display:none">
    <button id="prev-btn" onclick="navigate(-1)">&#8592;</button>
    <select id="unit-select" onchange="goTo(+this.value)"></select>
    <button id="next-btn" onclick="navigate(1)">&#8594;</button>
  </nav>
</header>

<div id="home-screen">
  <div id="book-list"></div>
</div>

<div id="reader-screen">
  <main id="content"></main>
  <footer>Soli Deo Gloria &mdash; To God Alone Be Glory</footer>
</div>

<script>
const BOOKS = [
  // Old Testament
  { id:'genesis',     title:'Genesis',     subtitle:'The Book of Origins',              testament:'OT', chapters:50 },
  { id:'exodus',      title:'Exodus',      subtitle:'The God Who Redeems',              testament:'OT', chapters:40 },
  { id:'leviticus',   title:'Leviticus',   subtitle:'Holy, Holy, Holy',                 testament:'OT', chapters:27 },
  { id:'numbers',     title:'Numbers',     subtitle:'Through the Wilderness',           testament:'OT', chapters:36 },
  { id:'deuteronomy', title:'Deuteronomy', subtitle:'Remember and Obey',                testament:'OT', chapters:34 },
  { id:'joshua',      title:'Joshua',      subtitle:'The LORD Fights for His People',   testament:'OT', chapters:24 },
  { id:'proverbs',    title:'Proverbs',    subtitle:'Wisdom and the Fear of the LORD',   testament:'OT', chapters:31 },
  { id:'ecclesiastes',title:'Ecclesiastes',subtitle:'Vanity and the Fear of God',        testament:'OT', chapters:12 },
  { id:'isaiah',      title:'Isaiah',      subtitle:'The Evangelical Prophet',           testament:'OT', chapters:66 },
  // New Testament
  { id:'matthew',      title:'Matthew',      subtitle:'The King Has Come',                   testament:'NT', chapters:28 },
  { id:'mark',         title:'Mark',         subtitle:'The Son of God on the Move',          testament:'NT', chapters:16 },
  { id:'luke',         title:'Luke',         subtitle:'The Saviour of the World',            testament:'NT', chapters:24 },
  { id:'john',         title:'John',         subtitle:'The Word Made Flesh',                 testament:'NT', chapters:21 },
  { id:'acts',         title:'Acts',         subtitle:'The Unhindered Word',                 testament:'NT', chapters:28 },
  { id:'romans',       title:'Romans',       subtitle:'The Righteousness of God',            testament:'NT', chapters:16 },
  { id:'1corinthians', title:'1 Corinthians',subtitle:'The Cross at the Centre',             testament:'NT', chapters:16 },
  { id:'2corinthians', title:'2 Corinthians',subtitle:'Strength in Weakness',                testament:'NT', chapters:13 },
  { id:'galatians',    title:'Galatians',    subtitle:'The Magna Carta of Christian Liberty', testament:'NT', chapters:6  },
  { id:'ephesians',    title:'Ephesians',    subtitle:'Every Spiritual Blessing',             testament:'NT', chapters:6  },
  { id:'philippians',  title:'Philippians',  subtitle:'To Live Is Christ',                   testament:'NT', chapters:4  },
  { id:'colossians',      title:'Colossians',      subtitle:'Christ Is All',                       testament:'NT', chapters:4  },
  { id:'1thessalonians', title:'1 Thessalonians', subtitle:'Waiting for His Son from Heaven',      testament:'NT', chapters:5  },
  { id:'2thessalonians', title:'2 Thessalonians', subtitle:'Do Not Be Shaken',                     testament:'NT', chapters:3  },
  { id:'1timothy',       title:'1 Timothy',       subtitle:'How to Behave in the Household of God', testament:'NT', chapters:6  },
  { id:'2timothy',       title:'2 Timothy',       subtitle:'Last Words from a Dying Apostle',       testament:'NT', chapters:4  },
  { id:'titus',          title:'Titus',           subtitle:'Sound Doctrine, Adorned Lives',          testament:'NT', chapters:3  },
  { id:'philemon',       title:'Philemon',        subtitle:'The Gospel and the Slave',               testament:'NT', chapters:1  },
  { id:'1peter',         title:'1 Peter',         subtitle:'Holy Exiles: Living the Gospel Under Pressure', testament:'NT', chapters:5  },
  { id:'2peter',         title:'2 Peter',         subtitle:'Hold Fast: Truth, Godliness, and the Coming Day', testament:'NT', chapters:3  },
  { id:'hebrews',      title:'Hebrews',      subtitle:'Jesus Is Better',                     testament:'NT', chapters:13 },
  { id:'james',        title:'James',        subtitle:'Faith That Works',                    testament:'NT', chapters:5  },
  { id:'1john',        title:'1 John',       subtitle:'That You May Know',                   testament:'NT', chapters:5  },
  { id:'2john',        title:'2 John',        subtitle:'Truth and Love Are Not Opposites',    testament:'NT', chapters:1  },
  { id:'3john',        title:'3 John',        subtitle:'Walking in Truth, Tested by Character', testament:'NT', chapters:1  },
  { id:'jude',         title:'Jude',         subtitle:'Contend for the Faith',               testament:'NT', chapters:1  },
  { id:'revelation',   title:'Revelation',   subtitle:'The Lamb Who Conquers',               testament:'NT', chapters:22 },
  // Christian Living Studies
  { id:'more-than-imagined',    title:'More Than You Imagined', subtitle:'The Full Meaning of the Christian Life',             testament:'SL', chapters:7 },
  { id:'spiritual-disciplines', title:'Spiritual Disciplines', subtitle:'The Means of Grace and the Growth of the Soul',      testament:'SL', chapters:6 },
  { id:'prayer',                title:'Prayer',                subtitle:'Talking with the Living God',                         testament:'SL', chapters:6 },
  { id:'money-stewardship',     title:'Money & Stewardship',   subtitle:'Wealth, Generosity, and the Kingdom of God',         testament:'SL', chapters:6 },
  { id:'assurance',             title:'Assurance of Salvation',subtitle:'Knowing That You Are His',                            testament:'SL', chapters:6 },
  { id:'christian-work',        title:'Christian at Work',     subtitle:'Vocation, Calling, and the Glory of God',             testament:'SL', chapters:6 },
  { id:'christian-marriage',    title:'Christian Marriage',    subtitle:'Covenant Love and the Gospel',                        testament:'SL', chapters:6 },
  { id:'christian-parenting',   title:'Christian Parenting',   subtitle:'Training Up Children in the Fear of the Lord',        testament:'SL', chapters:6 },
  { id:'christian-suffering',   title:'Christian Suffering',   subtitle:'Held Fast Through the Fire',                         testament:'SL', chapters:6 },
  { id:'biblical-counseling',   title:'Biblical Counseling',   subtitle:'Caring for Souls with the Word of God',              testament:'SL', chapters:20 },
  { id:'apologetics',           title:'Apologetics',           subtitle:'Defending and Commending the Christian Faith',        testament:'SL', chapters:6 },
  { id:'evangelism',            title:'Evangelism',            subtitle:'Understanding People, Sharing the Gospel',             testament:'SL', chapters:6 },
  // General Studies
  { id:'how-we-got-our-bible',  title:'How We Got Our Bible',  subtitle:'Inspiration, Canon, Transmission, and Translation',   testament:'SG', chapters:7 },
  { id:'hermeneutics',          title:'Hermeneutics',          subtitle:'The Art and Science of Biblical Interpretation',      testament:'SG', chapters:6 },
  { id:'church-history',        title:'Church History',        subtitle:'Two Thousand Years of Grace',                         testament:'SG', chapters:8 },
  { id:'theology-distinctives', title:'Theology Distinctives', subtitle:'The Great Doctrines of the Reformed Faith',           testament:'SG', chapters:8 },
  { id:'covenant-theology',     title:'Covenant Theology',     subtitle:'The Backbone of Reformed Biblical Theology',          testament:'SG', chapters:6 },
  { id:'end-times',             title:'End Times Models',      subtitle:'Amillennialism, Premillennialism, Postmillennialism',  testament:'SG', chapters:5 },
  { id:'dispensational-distinctives', title:'Dispensational Distinctives', subtitle:'A Biblical Guide to the Dispensational Framework', testament:'SG', chapters:6 },
  { id:'denominations',         title:'Denominations',         subtitle:'The Major Christian Traditions and Their Distinctives',testament:'SG', chapters:9 },
  { id:'kingdom-of-god',        title:'The Kingdom of God',    subtitle:'The Reign of God and the Hope of the World',          testament:'SG', chapters:6 },
];

var currentBook = null;
var currentData = null;
var currentKeys = [];
var currentIdx  = 0;

// ── Home ─────────────────────────────────────────────────────────────────

function showHome() {
  document.getElementById('home-screen').style.display = '';
  document.getElementById('reader-screen').style.display = 'none';
  document.getElementById('reader-nav').style.display = 'none';
  document.title = 'Soli Deo Gloria';
  window.scrollTo(0,0);
}

function section(id, title, contentHtml, startOpen) {
  var open = startOpen ? ' open' : '';
  var chevronOpen = startOpen ? ' open' : '';
  var bodyStyle = startOpen ? '' : 'style="max-height:0"';
  return '<div class="section-wrap" id="sec-' + id + '">'
    + '<div class="section-toggle" onclick="toggleSection(\'' + id + '\')">'
    + '<span class="section-title">' + title + '</span>'
    + '<span class="section-chevron' + chevronOpen + '">&#8250;</span>'
    + '</div>'
    + '<div class="section-body" id="body-' + id + '" ' + bodyStyle + '>'
    + contentHtml
    + '</div>'
    + '</div>';
}

function toggleSection(id) {
  var body = document.getElementById('body-' + id);
  var chevron = document.querySelector('#sec-' + id + ' .section-chevron');
  var isOpen = chevron.classList.contains('open');
  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(function(){ body.style.maxHeight = '0'; });
    chevron.classList.remove('open');
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    setTimeout(function(){ body.style.maxHeight = 'none'; }, 260);
    chevron.classList.add('open');
  }
}

function buildHome() {
  var ot = BOOKS.filter(b => b.testament === 'OT');
  var nt = BOOKS.filter(b => b.testament === 'NT');
  var sg = BOOKS.filter(b => b.testament === 'SG');
  var sl = BOOKS.filter(b => b.testament === 'SL');

  var refHtml = ''
    + '<div class="book-row" onclick="window.location.href=\'dictionary.html\'">'
    + '<div class="row-name">Theological Dictionary</div>'
    + '<div class="row-sub">Key words of the faith — explained and felt</div>'
    + '<div class="row-arrow">&#8250;</div></div>'
    + '<div class="book-row" onclick="window.location.href=\'figures.html\'">'
    + '<div class="row-name">Theological Figures</div>'
    + '<div class="row-sub">Faithful voices across the centuries</div>'
    + '<div class="row-arrow">&#8250;</div></div>'
    + '<div class="book-row" onclick="window.location.href=\'philosophers.html\'">'
    + '<div class="row-name">Philosophers &amp; Christian Thought</div>'
    + '<div class="row-sub">Ideas that shaped — and challenged — the faith</div>'
    + '<div class="row-arrow">&#8250;</div></div>'
    + '<div class="book-row" onclick="window.location.href=\'heresies.html\'">'
    + '<div class="row-name">Heresies &amp; the Church\'s Response</div>'
    + '<div class="row-sub">The faith contended for — and defended — across the centuries</div>'
    + '<div class="row-arrow">&#8250;</div></div>';

  var html = '';
  html += section('ot', 'Old Testament — ' + ot.length + ' books', ot.map(row).join(''), false);
  html += section('nt', 'New Testament — ' + nt.length + ' books', nt.map(row).join(''), false);
  html += section('sl', 'Christian Living Studies — ' + sl.length + ' studies', sl.map(row).join(''), false);
  html += section('sg', 'General Studies — ' + sg.length + ' studies', sg.map(row).join(''), false);
  html += section('ref', 'Reference', refHtml, false);
  html += '<div class="about-section">'
    + '<div class="about-title">About Soli Deo Gloria</div>'
    + '<div class="about-body">'
    + '<p>Soli Deo Gloria is a Reformed Bible commentary app designed to open the Scriptures with depth, warmth, and reverence. Each commentary draws on the work of faithful expositors including Timothy Keller, Alistair Begg, R.C. Sproul, Sinclair Ferguson, John MacArthur, John Stott, John Calvin, Derek Kidner, Bruce Waltke, Gordon Wenham, and D.A. Carson.</p>'
    + '<p>The aim is not merely to inform the mind but to stir the heart &mdash; to see Christ on every page, and to leave the reader with a deeper love for God and his Word.</p>'
    + '<p>Scripture quotations are from the ESV&reg; Bible (The Holy Bible, English Standard Version&reg;), copyright &copy; 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved.</p>'
    + '</div>'
    + '</div>';
  document.getElementById('book-list').innerHTML = html;
}

function row(b) {
  return '<div class="book-row" onclick="openBook(\'' + b.id + '\')">'
    + '<div class="row-name">' + b.title + '</div>'
    + '<div class="row-sub">' + b.subtitle + '</div>'
    + '<div class="row-arrow">&#8250;</div>'
    + '</div>';
}

// ── Reader ───────────────────────────────────────────────────────────────

function openBook(id) {
  currentBook = BOOKS.find(b => b.id === id);
  localStorage.setItem('last-book', id);
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('reader-screen').style.display = 'block';
  document.getElementById('reader-nav').style.display = 'flex';
  document.title = currentBook.title;
  document.getElementById('content').innerHTML = '<p style="padding:2rem;color:#a09070;text-align:center">Loading&hellip;</p>';

  fetch('data/' + id + '.json')
    .then(r => r.json())
    .then(data => {
      currentData = data;
      currentKeys = Object.keys(data).map(Number).sort((a,b) => a-b);
      var sel = document.getElementById('unit-select');
      sel.innerHTML = '';
      currentKeys.forEach(k => {
        var o = document.createElement('option');
        o.value = k;
        var ref = data[k].ref || String(k);
        var chTitle = data[k].title || data[k].subtitle || '';
        var label;
        if (currentBook.testament === 'ST') {
          var title = data[k].title || '';
          var rangeMatch = title.match(/(\d{2,4})[–—\-](\d{2,4})/);
          if (rangeMatch) {
            label = rangeMatch[1] + '–' + rangeMatch[2];
          } else {
            var yearMatch = title.match(/\d{3,4}/);
            label = yearMatch ? yearMatch[0] : (ref.match(/\d+/) ? ref.match(/\d+/)[0] : ref.substring(0, 5));
          }
        } else {
          var num = ref.match(/\d+/);
          label = num ? num[0] : (k === 0 ? 'Intro' : ref.substring(0, 5));
        }
        if (chTitle) {
          var decoded = chTitle.replace(/&rsquo;/g,"'").replace(/&lsquo;/g,"'").replace(/&ldquo;/g,'"').replace(/&rdquo;/g,'"').replace(/&ndash;/g,'–').replace(/&mdash;/g,'—').replace(/&amp;/g,'&');
          var short = decoded.length > 30 ? decoded.substring(0, 28) + '…' : decoded;
          label = label + ' · ' + short;
        }
        o.textContent = label;
        sel.appendChild(o);
      });
      var saved = localStorage.getItem(id + '-pos');
      var start = (saved !== null && data[+saved] !== undefined) ? +saved : currentKeys[0];
      render(currentKeys.indexOf(start));
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<p style="padding:2rem;color:#c9a84c">Could not load ' + currentBook.title + '.</p>';
    });
}

function render(idx) {
  if (!currentData || idx < 0 || idx >= currentKeys.length) return;
  currentIdx = idx;
  var k = currentKeys[idx];
  var ch = currentData[k];
  document.getElementById('unit-select').value = k;
  localStorage.setItem(currentBook.id + '-pos', k);

  var html = '';

  // Title block
  var title = ch.title || ch.subtitle || '';
  var ref   = ch.ref   || (k === 0 ? 'Introduction' : k === currentKeys[currentKeys.length-1] ? 'About' : '');
  if (title) html += '<h2>' + title + '</h2>';
  if (ref)   html += '<div class="ref">' + ref + '</div>';

  // ESV text
  if (ch.text) {
    html += '<details><summary>ESV Text</summary><div class="passage-text">' + ch.text + '</div></details>';
  }

  // Overview / intro
  var intro = ch.overview || ch.intro || '';
  if (intro) {
    html += '<details><summary>Overview</summary><div class="detail-body">' + intro + '</div></details>';
  }

  // Verse by verse
  if (ch.verseByVerse && ch.verseByVerse.length > 0) {
    // Chip map
    html += '<div class="verse-map">';
    ch.verseByVerse.forEach((v, i) => {
      html += '<a class="' + (v.sectionBreak ? 'section-chip' : 'verse-chip') + '" href="#vs' + i + '">' + v.ref + '</a>';
    });
    html += '</div>';
    // Section headers render outside <details> so they're always visible.
    // Verse entries are buffered and flushed into a <details> per section.
    var vbvLabel = currentBook.testament === 'ST' ? 'Details' : 'Verse by Verse';
    var verseBuffer = [];
    var curTheology = '';
    var curExamples = '';
    function flushVerses() {
      if (!verseBuffer.length) return;
      html += '<details open><summary>' + vbvLabel + '</summary>' + verseBuffer.join('') + '</details>';
      verseBuffer = [];
      if (curTheology) { html += '<details><summary>Theology</summary><div class="accent-box">' + curTheology + '</div></details>'; curTheology = ''; }
      if (curExamples) { html += '<details><summary>Then &amp; Now</summary><div class="accent-box">' + curExamples + '</div></details>'; curExamples = ''; }
    }
    ch.verseByVerse.forEach((v, i) => {
      if (v.sectionBreak) {
        flushVerses();
        html += '<div class="section-hd" id="vs' + i + '">';
        html += '<div class="section-hd-ref">' + v.ref + '</div>';
        if (v.sectionOverview) html += '<div class="section-hd-overview">' + v.sectionOverview + '</div>';
        html += '</div>';
        curTheology = v.theology || '';
        curExamples = v.examples || '';
      } else {
        var entry = '<div class="vbv-entry" id="vs' + i + '">';
        entry += '<div class="vbv-ref">' + v.ref + '</div>';
        if (v.quote) { var q = v.quote.replace(/^[“”"]+/, '').replace(/^(&ldquo;|&rdquo;)+/, '').replace(/[“”"]+$/, '').replace(/(&ldquo;|&rdquo;)+$/, ''); entry += '<div class="vbv-quote">&ldquo;' + q + '&rdquo;</div>'; }
        if (v.commentary) entry += '<div class="vbv-commentary">' + v.commentary + '</div>';
        entry += '</div>';
        verseBuffer.push(entry);
      }
    });
    flushVerses();
  }

  // Sections (Isaiah style — handled for prototype)
  if (ch.sections && ch.sections.length > 0) {
    html += '<details open><summary>Commentary</summary>';
    ch.sections.forEach(sec => {
      html += '<div class="vbv-entry">';
      html += '<div class="vbv-ref">' + sec.title + (sec.ref ? ' <span style="color:#a09070;font-weight:normal;font-size:.85rem">— ' + sec.ref + '</span>' : '') + '</div>';
      if (sec.commentary) html += '<div class="vbv-commentary">' + sec.commentary + '</div>';
      html += '</div>';
    });
    html += '</details>';
  }

  // Theology
  if (ch.theology) {
    html += '<details><summary>Theology</summary><div class="accent-box">' + ch.theology + '</div></details>';
  }

  // Key verse (Isaiah)
  if (ch.keyVerse) {
    html += '<details><summary>Key Verse</summary><div class="accent-box">'
      + '<div class="vbv-ref">' + ch.keyVerse.ref + '</div>'
      + '<div class="vbv-quote">&ldquo;' + ch.keyVerse.quote.replace(/^["""]+/, '').replace(/^(&ldquo;|&rdquo;)+/, '').replace(/["""]+$/, '').replace(/(&ldquo;|&rdquo;)+$/, '') + '&rdquo;</div>'
      + (ch.keyVerse.note ? '<div class="vbv-commentary">' + ch.keyVerse.note + '</div>' : '')
      + '</div></details>';
  }

  // Then & Now
  if (ch.examples) {
    html += '<details><summary>Then &amp; Now</summary><div class="accent-box">' + ch.examples + '</div></details>';
  }

  // Reflection (Isaiah)
  if (ch.reflection) {
    html += '<details><summary>For Reflection</summary><div class="accent-box"><p>' + ch.reflection + '</p></div></details>';
  }

  document.getElementById('content').innerHTML = html;

  // Prev/next button state
  document.getElementById('prev-btn').disabled = (idx === 0 && !prevBook());
  document.getElementById('next-btn').disabled = (idx === currentKeys.length - 1 && !nextBook());

  // Cross-book nav: "Continue to" at end only
  var atEnd = idx === currentKeys.length - 1;
  var nb = nextBook();
  if (atEnd && nb) {
    document.getElementById('content').insertAdjacentHTML('beforeend',
      '<div style="text-align:center;padding:2rem 0">'
      + '<button onclick="openBook(\'' + nb.id + '\')" style="background:#1a3a5c;border:1px solid #c9a84c;color:#c9a84c;padding:.6rem 1.4rem;border-radius:4px;cursor:pointer;font-size:.95rem">'
      + 'Continue to ' + nb.title + ' &#8594;</button></div>');
  }

  window.scrollTo(0,0);
}

function prevBook() {
  if (!currentBook) return null;
  var idx = BOOKS.indexOf(currentBook);
  return idx > 0 ? BOOKS[idx - 1] : null;
}
function nextBook() {
  if (!currentBook) return null;
  var idx = BOOKS.indexOf(currentBook);
  return idx < BOOKS.length - 1 ? BOOKS[idx + 1] : null;
}

function goTo(k)         { render(currentKeys.indexOf(+k)); }
function navigate(dir) {
  var newIdx = currentIdx + dir;
  if (newIdx < 0) { var pb = prevBook(); if (pb) openBook(pb.id); return; }
  if (newIdx >= currentKeys.length) { var nb = nextBook(); if (nb) openBook(nb.id); return; }
  render(newIdx);
}

// ── Keyboard navigation ───────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (!currentBook) return;
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navigate(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1); }
});

// ── Swipe navigation ──────────────────────────────────────────────────────
(function() {
  var startX = 0, startY = 0;
  document.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!currentBook) return;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      navigate(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

// ── Init ─────────────────────────────────────────────────────────────────
buildHome();

var lastBook = localStorage.getItem('last-book');
if (lastBook && BOOKS.find(b => b.id === lastBook)) {
  openBook(lastBook);
} else {
  showHome();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
}
</script>
</body>
</html>
