<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soli Deo Gloria</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Georgia',serif;background:#0d2137;color:#e8dcc8;min-height:100vh}

/* ── Header ──
   Gold is an accent, not a default: outlines stay muted and the metal only
   comes up on hover/press. Mirrors the restraint of the verse sheet below. */
header{background:linear-gradient(180deg,#1c3d61 0%,#183350 100%);padding:.5rem 1rem .55rem;display:flex;flex-direction:column;gap:.45rem;border-bottom:1px solid rgba(201,168,76,.28);box-shadow:0 8px 20px -16px rgba(0,0,0,.95);position:sticky;top:0;z-index:100}
header h1{font-size:1.18rem;font-weight:400;color:#c9a84c;letter-spacing:.17em;text-align:center;cursor:pointer;padding:.3rem 0 .35rem;touch-action:manipulation;user-select:none;transition:opacity .15s}
header h1:hover{opacity:.75}
nav{display:flex;align-items:stretch;gap:.45rem}
nav button{background:rgba(255,255,255,.025);border:1px solid rgba(201,168,76,.3);color:#c9a84c;padding:.4rem .9rem;border-radius:8px;cursor:pointer;font-size:1rem;flex-shrink:0;min-height:2.75rem;min-width:3rem;touch-action:manipulation;transition:background .15s,border-color .15s,color .15s}
nav button:hover{background:rgba(201,168,76,.13);border-color:rgba(201,168,76,.75)}
nav button:active{background:#c9a84c;color:#0d2137;border-color:#c9a84c}
nav button:disabled{opacity:.22;cursor:default}
nav button:disabled:hover{background:rgba(255,255,255,.025);border-color:rgba(201,168,76,.3);color:#c9a84c}
/* appearance:none drops the OS chevron so we can draw a thinner one to match */
#unit-select{appearance:none;-webkit-appearance:none;color:#c9a84c;border:1px solid rgba(201,168,76,.3);padding:.4rem 2.1rem .4rem .75rem;border-radius:8px;font-size:.95rem;font-family:'Georgia',serif;flex:1;min-width:0;min-height:2.75rem;cursor:pointer;transition:border-color .15s;background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath d='M1 1.75 6 6.25 11 1.75' fill='none' stroke='%23c9a84c' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E") no-repeat right .8rem center/11px 8px,#12293f}
#unit-select:hover{border-color:rgba(201,168,76,.65)}
#unit-select:focus{outline:none;border-color:rgba(201,168,76,.8)}

/* ── Home screen ── */
#home-screen{width:100%;padding:0}

/* Home layout: one calm column of rounded cards, same row style throughout */
.home-wrap{max-width:640px;margin:0 auto;padding:1rem 1rem 0}
.home-card{background:#12293f;border:1px solid rgba(201,168,76,.18);border-radius:12px;overflow:hidden;margin-bottom:1.1rem}
.home-lbl{color:#7f97b0;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;margin:0 .3rem .45rem}
.home-start{padding:.9rem}
.home-cont{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:none;border-bottom:1px solid rgba(201,168,76,.14);padding:.1rem .1rem .85rem;margin-bottom:.85rem;cursor:pointer;text-align:left;font-family:'Georgia',serif;touch-action:manipulation}
.hc-lbl{color:#7f97b0;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.hc-where{color:#e8dcc8;font-size:1.02rem;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-arrow{color:#c9a84c;font-size:1.1rem}
.home-go{display:flex;align-items:center;justify-content:center;gap:.55rem;width:100%;background:#c9a84c;color:#0d2137;border:none;border-radius:9px;padding:.85rem 1rem;font-family:'Georgia',serif;font-size:1.02rem;font-weight:bold;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}
.home-go:active{background:#d8ba62}

/* Rows inside the cards (library sections and settings) */
.section-toggle{display:flex;align-items:center;gap:.6rem;padding:.9rem 1rem;border-top:1px solid rgba(201,168,76,.12);cursor:pointer;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.home-card > .section-wrap:first-child > .section-toggle,.home-card > .section-toggle:first-child{border-top:none}
.section-toggle:active{background:#183552}
.section-title{color:#e8dcc8;font-size:1rem;font-family:'Georgia',serif;flex:1}
.section-count{color:#7f97b0;font-size:.82rem;white-space:nowrap}
.section-chevron{color:#c9a84c;font-size:1.1rem;transition:transform .2s;flex-shrink:0;width:.8rem;text-align:center}
.section-chevron.open{transform:rotate(90deg)}
.section-body{overflow:hidden;transition:max-height .25s ease}

.group-hd{padding:.9rem 1rem .5rem 1.4rem;background:#0b1d30;border-top:1px solid rgba(201,168,76,.16)}
.group-title{color:#e8dcc8;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}
.group-sub{color:#7090b0;font-size:.78rem;font-style:italic;margin-top:.2rem}
.book-row{display:flex;align-items:center;gap:.9rem;padding:.75rem 1rem .75rem 1.4rem;border-top:1px solid #1a3050;background:#0e2236;cursor:pointer;transition:background .12s}
.book-row:hover{background:#1a3a5c}
.book-row:active{background:#22487a}
.row-name{color:#d6bf82;font-size:.96rem;min-width:110px}
.row-sub{color:#7090b0;font-size:.82rem;flex:1}
.row-arrow{color:#3a5a7c;font-size:1rem;margin-left:auto}

/* ── Reader ── */
#reader-screen{display:none}
main{width:100%;padding:1.5rem 2rem;overflow-wrap:break-word;word-break:break-word}
h2{color:#c9a84c;font-size:1.4rem;margin-bottom:.3rem}
.ref{color:#a09070;font-size:.95rem;margin-bottom:1.2rem}
details{margin-bottom:.8rem;border:1px solid #2a4a6c;border-radius:6px;overflow:hidden}
summary{background:#1a3a5c;padding:.7rem 1rem;cursor:pointer;color:#c9a84c;font-weight:bold;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover{background:#22487a}
.detail-body{padding:1rem;line-height:1.8}
.detail-body p{margin-bottom:.9rem}
.detail-body p:last-child{margin-bottom:0}
.passage-text{padding:1rem;line-height:1.8;color:#d4c4a8;font-style:italic;border-top:1px solid #2a4a6c}
.vbv-entry{padding:1rem;border-top:1px solid #2a4a6c}
.vbv-entry:first-child{border-top:none}
/* Anchor jumps (verse chips) must clear the sticky header. --hdr is set in JS. */
.vbv-entry,.section-hd{scroll-margin-top:var(--hdr,6.5rem)}
.vbv-ref{color:#c9a84c;font-weight:bold;margin-bottom:.3rem;font-size:.95rem}
.vbv-quote{font-style:italic;color:#d4c4a8;margin-bottom:.6rem;line-height:1.7}
.vbv-commentary{line-height:1.8}
.vbv-study{margin:-.2rem 0 .8rem;font-size:.85rem;line-height:1.6;color:#9fb3c8}
.study-btn{background:none;border:1px solid rgba(201,168,76,.45);color:#c9a84c;border-radius:999px;padding:.15rem .7rem;margin:0 .4rem .2rem 0;font:inherit;font-size:.8rem;cursor:pointer}
.study-btn:hover,.study-btn[aria-expanded="true"]{background:rgba(201,168,76,.15)}
.study-panel{display:none;margin-top:.45rem;padding:.6rem .85rem;border-left:2px solid #c9a84c;background:#112840;color:#d4dde6}
.vbv-study[data-open="note"] .study-note,.vbv-study[data-open="par"] .study-pars{display:block}
.study-grp+.study-grp{margin-top:.5rem}
.study-lbl{text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;color:#c9a84c}
.study-item{margin-top:.1rem}
.study-desc{color:#9fb3c8}
.vbv-commentary p{margin-bottom:.7rem}
.vbv-commentary p:last-child{margin-bottom:0}
.scripture-link{color:inherit;text-decoration:underline;text-decoration-color:rgba(201,168,76,.32);text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px}
.scripture-link:hover{text-decoration-color:#c9a84c}
.accent-box{background:#112840;border-left:3px solid #c9a84c;padding:1rem 1.2rem;line-height:1.8}
.accent-box p{margin-bottom:.7rem}
.accent-box p:last-child{margin-bottom:0}
footer{text-align:center;padding:1.5rem;color:#a09070;font-size:.85rem;border-top:1px solid #2a4a6c;margin-top:2rem}
sup{font-size:.7em;vertical-align:super}
.verse-map{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
.verse-chip{background:#112840;border:1px solid #2a4a6c;color:#c9a84c;font-size:.8rem;padding:.25rem .6rem;border-radius:20px;cursor:pointer;text-decoration:none;white-space:nowrap}
.verse-chip:hover{background:#1a3a5c;border-color:#c9a84c}
.section-chip{background:#1a3a5c;border:1px solid #c9a84c;color:#c9a84c;font-size:.8rem;padding:.25rem .7rem;border-radius:4px;cursor:pointer;text-decoration:none;font-weight:bold;white-space:normal;word-break:break-word}
.section-chip:hover{background:#c9a84c;color:#0d2137}
.section-hd{background:#0a1e30;border-top:2px solid #c9a84c;padding:1rem 1.2rem}
.section-hd-ref{color:#c9a84c;font-weight:bold;font-size:.95rem;letter-spacing:.04em;margin-bottom:.8rem}
.section-hd-overview{color:#e8dcc8;line-height:1.85}
.section-hd-overview p{margin-bottom:.85rem}
.section-hd-overview p:last-child{margin-bottom:0}

/* ── Copy-to-share button ── */
.copy-btn{position:absolute;background:none;border:none;margin:0;padding:.3rem;cursor:pointer;color:#c9a84c;opacity:.4;line-height:0;border-radius:5px;z-index:2;-webkit-tap-highlight-color:transparent;transition:opacity .15s,background .15s,color .15s}
.copy-btn:hover{opacity:1;background:rgba(201,168,76,.14)}
.copy-btn:active{opacity:1}
.copy-btn.copied{opacity:1;color:#7bbf6a;background:rgba(123,191,106,.14)}
.copy-btn svg{display:block}
summary{position:relative}
summary .copy-btn{right:.55rem;top:50%;transform:translateY(-50%)}
.section-hd{position:relative}
.section-hd .copy-btn{right:.6rem;top:.6rem}
.vbv-entry{position:relative}
.vbv-entry .copy-btn{right:.5rem;top:.5rem}
.vbv-ref{padding-right:2rem}

/* ── Verse jump (floating pill + sheet) ── */
/* A slim tab hugging the left bezel, vertically centred — the left thumb's resting arc.
   Deliberately small and faint; ::after widens the hit area well past the visible tab. */
#vjump-pill{position:fixed;left:env(safe-area-inset-left,0);top:50%;transform:translateY(-50%);z-index:90;display:none;align-items:center;justify-content:center;width:1.15rem;height:2.1rem;background:#16324f;border:1px solid rgba(201,168,76,.5);border-left:none;color:#c9a84c;padding:0;border-radius:0 13px 13px 0;cursor:pointer;box-shadow:1px 0 6px rgba(0,0,0,.3);opacity:.32;transition:opacity .15s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#vjump-pill::after{content:'';position:absolute;top:-11px;bottom:-11px;left:0;right:-16px}
/* Deliberately stays faint at all times — never brightens on scroll, never
   inverts to solid gold on press. A gentle opacity nudge is the only feedback. */
#vjump-pill:hover{opacity:.5}
#vjump-pill:active{opacity:.6}
#vjump-pill svg{display:block}

#vjump-backdrop{position:fixed;inset:0;background:rgba(5,14,24,.6);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
#vjump-backdrop.open{opacity:1;pointer-events:auto}

#vjump-sheet{position:fixed;left:0;right:0;bottom:0;z-index:120;max-width:720px;margin:0 auto;background:#0a1e30;border-top:2px solid #c9a84c;border-radius:14px 14px 0 0;padding:1rem 1.1rem calc(1.3rem + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .24s ease;max-height:70vh;overflow-y:auto}
#vjump-sheet.open{transform:translateY(0)}
.vjump-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem}
.vjump-title{color:#c9a84c;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
.vjump-close{background:none;border:1px solid #2a4a6c;color:#c9a84c;border-radius:6px;font-size:1rem;line-height:1;padding:.35rem .6rem;cursor:pointer;touch-action:manipulation}
.vjump-close:hover{background:#1a3a5c}
.vjump-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.9rem,1fr));gap:.45rem}
.vjump-num{background:#112840;border:1px solid #2a4a6c;color:#c9a84c;font-family:'Georgia',serif;font-size:.95rem;padding:.6rem .2rem;border-radius:6px;cursor:pointer;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.vjump-num:hover{background:#1a3a5c;border-color:#c9a84c}
.vjump-num.current{background:#c9a84c;color:#0d2137;border-color:#c9a84c;font-weight:bold}
.vjump-top{margin-top:.9rem;width:100%;background:#1a3a5c;border:1px solid #2a4a6c;color:#c9a84c;font-family:'Georgia',serif;font-size:.85rem;padding:.6rem;border-radius:6px;cursor:pointer;touch-action:manipulation}
.vjump-top:hover{border-color:#c9a84c}

/* ── Passage picker (Book → Chapter → Verse) ── */
#pk-btn{background:rgba(255,255,255,.025);border:1px solid rgba(201,168,76,.3);color:#c9a84c;border-radius:8px;cursor:pointer;flex-shrink:0;min-height:2.75rem;min-width:2.75rem;padding:0 .55rem;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#pk-btn:hover{border-color:rgba(201,168,76,.65)}
#pk-btn svg{display:block}
#pk-backdrop{position:fixed;inset:0;background:rgba(5,14,24,.6);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
#pk-backdrop.open{opacity:1;pointer-events:auto}
#pk-sheet{position:fixed;left:0;right:0;bottom:0;z-index:120;max-width:720px;margin:0 auto;background:#0a1e30;border-top:2px solid #c9a84c;border-radius:14px 14px 0 0;padding:.9rem 1rem calc(1.2rem + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .24s ease;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#pk-sheet.open{transform:translateY(0)}
.pk-head{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;min-height:2.2rem}
.pk-back{background:none;border:1px solid #2a4a6c;color:#c9a84c;border-radius:6px;font-family:'Georgia',serif;font-size:.85rem;padding:.4rem .6rem;cursor:pointer;touch-action:manipulation;visibility:hidden}
.pk-title{flex:1;color:#c9a84c;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;text-align:center}
.pk-recent{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.pk-rc{background:#16324f;border:1px solid rgba(201,168,76,.55);color:#e8dcc8;border-radius:999px;font-family:'Georgia',serif;font-size:.82rem;padding:.35rem .75rem;cursor:pointer;touch-action:manipulation}
.pk-lbl{color:#7090b0;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;margin:.6rem 0 .4rem}
.pk-books{display:grid;grid-template-columns:repeat(6,1fr);gap:.35rem}
.pk-b{border:1px solid #2a4a6c;border-radius:6px;color:#e8dcc8;font-family:'Georgia',serif;font-size:.8rem;padding:.62rem .1rem;text-align:center;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;white-space:nowrap;overflow:hidden}
.pk-b{background:#152d45;border-bottom-width:3px}
.pk-b.g1{border-bottom-color:#c9a84c}.pk-b.g2{border-bottom-color:#5f93c4}.pk-b.g3{border-bottom-color:#9b84c9}.pk-b.g4{border-bottom-color:#c46f5a}.pk-b.g5{border-bottom-color:#d39a52}.pk-b.g6{border-bottom-color:#7fb98a}.pk-b.g7{border-bottom-color:#5fb0b5}.pk-b.g8{border-bottom-color:#a3b1c2}
.pk-b.cur{border-color:#c9a84c;color:#c9a84c;font-weight:bold}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.9rem,1fr));gap:.45rem}
.pk-n{background:#112840;border:1px solid #2a4a6c;color:#c9a84c;font-family:'Georgia',serif;font-size:.95rem;padding:.62rem .2rem;border-radius:6px;cursor:pointer;text-align:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pk-n:hover{background:#1a3a5c;border-color:#c9a84c}
.pk-n.cur{background:#c9a84c;color:#0d2137;border-color:#c9a84c;font-weight:bold}
.pk-wide{display:block;width:100%;margin:0 0 .7rem;background:#1a3a5c;border:1px solid #2a4a6c;color:#c9a84c;font-family:'Georgia',serif;font-size:.88rem;padding:.65rem;border-radius:6px;cursor:pointer;touch-action:manipulation}
.pk-wide:hover{border-color:#c9a84c}
.pk-wait{color:#7090b0;text-align:center;padding:1.5rem 0;font-style:italic}

/* ── Back chip after following a Scripture reference ── */
#back-chip{position:fixed;top:calc(var(--hdr,6.5rem) + .45rem);left:50%;transform:translateX(-50%);z-index:95;display:none;align-items:center;gap:.2rem;background:#c9a84c;color:#0d2137;border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.45);font-family:'Georgia',serif;font-size:.86rem;font-weight:bold;max-width:calc(100% - 2rem)}
#back-chip.show{display:flex}
#back-chip button{background:none;border:none;color:inherit;font:inherit;cursor:pointer;touch-action:manipulation;padding:.5rem .3rem .5rem .9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back-chip .bc-x{padding:.5rem .8rem .5rem .4rem;font-weight:normal;opacity:.7}

/* ── Offline download + version (home screen) ── */
.dl-status{}
.dl-status.ok{color:#8fb98a}
.dl-body{display:none;padding:.2rem 1rem 1rem;background:#0e2236;font-family:'Georgia',serif}
.dl-body.open{display:block}
.dl-text{color:#9fb3c8;font-size:.85rem;line-height:1.55;margin-bottom:.65rem}
.dl-bar{height:6px;background:#12293f;border-radius:3px;overflow:hidden;margin-bottom:.6rem;display:none}
.dl-bar div{height:100%;width:0;background:#c9a84c;transition:width .2s}
.dl-btn{background:#1a3a5c;border:1px solid #c9a84c;color:#c9a84c;font-family:'Georgia',serif;font-size:.9rem;padding:.6rem 1rem;border-radius:8px;cursor:pointer;touch-action:manipulation}
.dl-btn[disabled]{opacity:.5;cursor:default}
.app-ver{text-align:center;color:#5d7a98;font-size:.75rem;letter-spacing:.06em;padding:1rem 1rem 1.4rem}

/* ── Text size panel ── */
#ts-btn{background:rgba(255,255,255,.025);border:1px solid rgba(201,168,76,.3);color:#c9a84c;border-radius:8px;cursor:pointer;flex-shrink:0;min-height:2.75rem;min-width:2.75rem;padding:0 .45rem;font-family:'Georgia',serif;font-size:1rem;touch-action:manipulation}
#ts-btn small{font-size:.72em}
#ts-btn:hover{border-color:rgba(201,168,76,.65)}
#ts-backdrop{position:fixed;inset:0;background:rgba(5,14,24,.35);z-index:110;opacity:0;pointer-events:none;transition:opacity .2s}
#ts-backdrop.open{opacity:1;pointer-events:auto}
#ts-sheet{position:fixed;left:0;right:0;bottom:0;z-index:120;max-width:720px;margin:0 auto;background:#0a1e30;border-top:2px solid #c9a84c;border-radius:14px 14px 0 0;padding:.9rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .24s ease;font-family:'Georgia',serif}
#ts-sheet.open{transform:translateY(0)}
.ts-row{display:flex;align-items:center;gap:.7rem;margin:.4rem 0 .5rem}
.ts-step{background:#12293f;border:1px solid #2a4a6c;color:#c9a84c;border-radius:8px;min-width:2.9rem;min-height:2.9rem;font-family:'Georgia',serif;cursor:pointer;touch-action:manipulation}
.ts-step.minus{font-size:.85rem}.ts-step.plus{font-size:1.3rem}
#ts-range{flex:1;accent-color:#c9a84c;height:2rem}
.ts-val{text-align:center;color:#e8dcc8;font-size:.9rem;margin-bottom:.6rem}
.ts-sample{color:#d4c4a8;font-style:italic;line-height:1.7;border-top:1px solid #2a4a6c;padding-top:.7rem;margin-bottom:.8rem;font-size:calc(1rem * var(--ts,1))}
.ts-reset{width:100%;background:#1a3a5c;border:1px solid #2a4a6c;color:#c9a84c;font-family:'Georgia',serif;font-size:.88rem;padding:.6rem;border-radius:6px;cursor:pointer}

/* ── About (home screen) ── */
.about-toggle{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.2rem;background:#0a1e30;cursor:pointer;user-select:none;touch-action:manipulation}
.about-toggle:hover{background:#112840}
.about-toggle-title{color:#c9a84c;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-family:'Georgia',serif}
.about-chevron{color:#c9a84c;font-size:1rem;transition:transform .2s;flex-shrink:0}
.about-chevron.open{transform:rotate(90deg)}
.about-body{overflow:hidden;max-height:0;transition:max-height .25s ease;background:#0e2236;padding:0 1rem}
.about-body.open{max-height:700px;padding:.9rem 1rem 1.2rem}
.about-body p{color:#7090b0;font-size:.82rem;line-height:1.75;margin-bottom:.8rem}
.about-body p:last-child{margin-bottom:0}

/* ── Mobile ── */
@media(max-width:640px){
  header{padding:.4rem .75rem .4rem}
  nav button{min-width:2.75rem;padding:.4rem .7rem}
  #unit-select{font-size:.85rem}
  .row-sub{display:none}
  .book-row{padding:.9rem 1rem}
  .row-name{font-size:.95rem}
  main{padding:1rem}
}
/* Tiny phones / very large zoom */
@media(max-width:380px){
  header h1{font-size:1rem}

// Convert an innerHTML fragment to clean shareable plain text (works even when collapsed/hidden).
function htmlToText(html) {
  if (!html) return '';
  var s = html
    .replace(/<\s*br\s*\/?>/gi, '\n')
    .replace(/<\/(p|div|li|h[1-6])\s*>/gi, '\n\n')
    .replace(/<[^>]+>/g, '');
  var t = document.createElement('textarea'); t.innerHTML = s; s = t.value;
  return s.replace(/ /g, ' ').replace(/[ \t]+/g, ' ').replace(/\n[ \t]+/g, '\n')
    .replace(/\n([•▸▶‣∙▪◦·])[ \t]*\n+[ \t]*/g, '\n• ')
    .replace(/\n{3,}/g, '\n\n').trim();
}

function shareHeader(ref) {
  var book = currentBook ? currentBook.title : '';
  var refEl = document.querySelector('#content .ref');
  var chap = refEl ? refEl.textContent.trim() : '';
  var top = book;
  if (chap) top += (top ? ' — ' : '') + chap;
  return ref ? (top ? top + '\n' + ref : ref) : top;
}

function buildShareText(btn) {
  var lines = [], hasScripture = false;
  var entry = btn.closest('.vbv-entry');
  var sec   = btn.closest('.section-hd');
  var det   = btn.closest('details');
  if (entry) {
    var r = entry.querySelector('.vbv-ref'), q = entry.querySelector('.vbv-quote'), cm = entry.querySelector('.vbv-commentary');
    lines.push(shareHeader(r ? htmlToText(r.innerHTML) : ''));
    if (q)  { hasScripture = true; lines.push('', htmlToText(q.innerHTML)); }
    if (cm) { lines.push('', htmlToText(cm.innerHTML)); }
  } else if (sec) {
    var sr = sec.querySelector('.section-hd-ref'), so = sec.querySelector('.section-hd-overview');
    lines.push(shareHeader(sr ? htmlToText(sr.innerHTML) : ''));
    if (so) lines.push('', htmlToText(so.innerHTML));
  } else if (det) {
    var sm = det.querySelector(':scope > summary'), label = '';
    if (sm) { var smc = sm.cloneNode(true); smc.querySelectorAll('.copy-btn').forEach(function(b){ b.remove(); }); label = smc.textContent.trim(); }
    if (det.querySelector('.passage-text') || det.querySelector('.vbv-quote')) hasScripture = true;
    var dc = det.cloneNode(true);
    dc.querySelectorAll('summary,.copy-btn').forEach(function(b){ b.remove(); });
    lines.push(shareHeader(label), '', htmlToText(dc.innerHTML));
  } else {
    return '';
  }
  lines.push('', '— Reformed Commentaries · Soli Deo Gloria');
  if (hasScripture) lines.push('', ESV_CITATION);
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

function flashCopied(btn) {
  if (btn._orig === undefined) btn._orig = btn.innerHTML;
  btn.innerHTML = CHECK_ICON; btn.classList.add('copied');
  clearTimeout(btn._t);
  btn._t = setTimeout(function(){ btn.innerHTML = btn._orig; btn.classList.remove('copied'); }, 1500);
}

function copyShareText(text, btn) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ flashCopied(btn); }).catch(function(){ fallback(); flashCopied(btn); });
  } else {
    fallback(); flashCopied(btn);
  }
}

// Drop a copy button into every shareable block after each render.
function addCopyButtons() {
  var c = document.getElementById('content');
  c.querySelectorAll('details > summary').forEach(function(s){ if (!s.querySelector('.copy-btn')) s.insertAdjacentHTML('beforeend', COPY_ICON); });
  c.querySelectorAll('.section-hd').forEach(function(s){ if (!s.querySelector('.copy-btn')) s.insertAdjacentHTML('afterbegin', COPY_ICON); });

// ── Verse jump ─────────────────────────────────────────────────
// Lets the reader return from their Bible at, say, verse 18 and land on the
// entry covering verse 18 — without scrolling back to the chip bar at the top.
var verseEntries = [];   // [{ id, start, end, ref }] — non-section entries only
var verseToEntry = [];   // verse number -> entry index (gaps forward-filled)
var verseMax = 0;

// "v. 3" / "vv. 16–17" → [3,3] / [16,17].  Anything else (e.g. "Matt. 6:9–10") → null.
function parseVerseRef(ref) {
  var m = String(ref).match(/^v{1,2}\.\s*(\d+)(?:\s*[–—-]\s*(\d+))?/);
  if (!m) return null;
  var a = +m[1], b = m[2] ? +m[2] : a;
  return b >= a ? [a, b] : null;
}

function buildVerseIndex(ch) {
  verseEntries = []; verseToEntry = []; verseMax = 0;
  var vbv = ch && ch.verseByVerse;
  if (!vbv || !vbv.length) return;
  vbv.forEach(function(v, i) {
    if (v.sectionBreak) return;              // section headers span whole blocks — skip
    var r = parseVerseRef(v.ref);
    if (!r) return;
    verseEntries.push({ id: 'vs' + i, start: r[0], end: r[1], ref: v.ref });
    if (r[1] > verseMax) verseMax = r[1];
  });
  if (!verseEntries.length) { verseMax = 0; return; }
  verseEntries.forEach(function(e, ei) {
    for (var v = e.start; v <= e.end; v++) verseToEntry[v] = ei;
  });
  for (var v = 1; v <= verseMax; v++) {                     // forward-fill any gaps
    if (verseToEntry[v] === undefined) verseToEntry[v] = (v > 1 ? verseToEntry[v-1] : 0);
  }
}

function headerOffset() {
  var h = document.querySelector('header');
  return (h ? h.offsetHeight : 0) + 10;
}

// Keep the CSS anchor offset in sync with the header's actual height,
// which grows with the reader's font size.
function syncHeaderOffset() {
  document.documentElement.style.setProperty('--hdr', headerOffset() + 'px');
}
window.addEventListener('resize', syncHeaderOffset);

// Which entry is currently at the top of the viewport?
function currentEntryIndex() {
  var cutoff = headerOffset() + 4, found = -1;
  for (var i = 0; i < verseEntries.length; i++) {
    var el = document.getElementById(verseEntries[i].id);
    if (!el) continue;
    if (el.getBoundingClientRect().top <= cutoff) found = i; else break;
  }
  return found < 0 ? 0 : found;
}

function refreshVersePill() {
  var pill = document.getElementById('vjump-pill');
  var inReader = document.getElementById('reader-screen').style.display !== 'none';
  pill.style.display = (verseEntries.length && inReader) ? 'flex' : 'none';
}

// Instant, not smooth: jumps can span thousands of pixels, and a long
// animated scroll reads as a blur rather than a jump.
function scrollToEl(el) {
  if (!el) return;
  var y = window.scrollY + el.getBoundingClientRect().top - headerOffset();
  window.scrollTo(0, Math.max(0, y));
}

function openVerseJump() {
  if (!verseEntries.length) return;
  var cur = verseEntries[currentEntryIndex()];
  var grid = document.getElementById('vjump-grid'), html = '';
  for (var v = 1; v <= verseMax; v++) {
    var isCur = v >= cur.start && v <= cur.end;
    html += '<button class="vjump-num' + (isCur ? ' current' : '') + '" onclick="jumpToVerse(' + v + ')">' + v + '</button>';
  }
  grid.innerHTML = html;
  var refEl = document.querySelector('#content .ref');
  document.getElementById('vjump-sheet-title').textContent =
    refEl ? 'Jump to Verse — ' + refEl.textContent.trim() : 'Jump to Verse';
  document.getElementById('vjump-backdrop').classList.add('open');
  document.getElementById('vjump-sheet').classList.add('open');
}

function closeVerseJump() {
  document.getElementById('vjump-backdrop').classList.remove('open');
  document.getElementById('vjump-sheet').classList.remove('open');
}

function jumpToVerse(v) {
  var ei = verseToEntry[v];
  closeVerseJump();
  if (ei === undefined) return;
  scrollToEl(document.getElementById(verseEntries[ei].id));
}

function jumpToTop() { closeVerseJump(); window.scrollTo(0, 0); }

function verseJumpOpen() { return document.getElementById('vjump-sheet').classList.contains('open'); }

function pkLoad(id) {
  if (pk.data && pk.data.id === id && pk.data.d) return Promise.resolve(pk.data.d);
  if (currentBook && currentBook.id === id && currentData) { pk.data = { id: id, d: currentData }; return Promise.resolve(currentData); }
  if (pk.data && pk.data.id === id && pk.data.p) return pk.data.p;
  var p = fetch('data/' + id + '.json').then(function(r){ return r.json(); })
    .then(function(d){ if (pk.data && pk.data.id === id) pk.data.d = d; return d; });
  pk.data = { id: id, p: p };
  return p;
}

function pkVerseMax(ch) {
  var max = 0;
  ((ch && ch.verseByVerse) || []).forEach(function(v){
    if (v.sectionBreak) return;
    var r = parseVerseRef(v.ref); if (r && r[1] > max) max = r[1];
  });
  return max;
}

function pkPickChapter(c) { pk.ch = c; pkVerses(); }

function pkVerses() {
  pk.step = 'verses';
  var title = (pk.book.id === 'psalms' ? 'Psalm ' : pk.book.title + ' ') + pk.ch;
  pkHead(title, pk.book.chapters > 1);
  if (pk.book.chapters === 1) document.getElementById('pk-back').style.visibility = 'visible';
  var body = document.getElementById('pk-body');
  body.innerHTML = '<div class="pk-wait">Opening ' + title + '&hellip;</div>';
  var id = pk.book.id, c = pk.ch;
  pkLoad(id).then(function(d){
    if (pk.step !== 'verses' || pk.book.id !== id || pk.ch !== c) return;
    var max = pkVerseMax(d[c]);
    if (!max) { pkGo(id, c, 0); return; }     // no verse-level entries: open the chapter
    var sameCh = currentBook && currentBook.id === id && currentKeys && currentKeys[currentIdx] === c && verseEntries.length;
    var curE = sameCh ? verseEntries[currentEntryIndex()] : null;
    var h = '<button class="pk-wide" onclick="pkGo(\'' + id + '\',' + c + ',0)">&#8593; Top of ' + title + '</button><div class="pk-grid">';
    for (var v = 1; v <= max; v++)
      h += '<button class="pk-n' + (curE && v >= curE.start && v <= curE.end ? ' cur' : '') + '" onclick="pkGo(\'' + id + '\',' + c + ',' + v + ')">' + v + '</button>';
    body.innerHTML = h + '</div>';
  }).catch(function(){ body.innerHTML = '<div class="pk-wait">Could not open ' + title + '.</div>'; });
}

function pkRecentGo(i) { var r = pkRecent()[i]; if (r) pkGo(r.b, r.c, r.v); }

function pkRemember(b, c, v) {
  if (!c) return;
  var rec = pkRecent().filter(function(r){ return !(r.b === b && r.c === c && r.v === v); });
  rec.unshift({ b: b, c: c, v: v });
  try { localStorage.setItem('pk-recent', JSON.stringify(rec.slice(0, 6))); } catch (e) {}
}

function pkGo(id, c, v) {
  pkClose();
  pkRemember(id, c, v);
  var land = function() {
    pendingScrollRestore = null;
    var idx = currentKeys.indexOf(c);
    if (idx < 0) idx = 0;
    if (idx !== currentIdx || !v) render(idx);
    if (v) requestAnimationFrame(function(){ requestAnimationFrame(function(){ jumpToVerse(v); }); });
  };
  if (currentBook && currentBook.id === id && currentData && document.getElementById('reader-screen').style.display !== 'none') { land(); return; }
  try { localStorage.setItem(id + '-pos', c); } catch (e) {}
  pkAfterOpen = v ? function(){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ jumpToVerse(v); }); }); } : null;
  openBook(id);
}

/* ── Text size: a slider from 80% to 160% in 5% steps (17 sizes). Scales the
   reading area (<main>) through the --ts variable set in scripture-links.js. ── */
function tsGet() { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--ts')) || 1; }
function tsSet(v) {
  v = Math.min(1.6, Math.max(0.8, Math.round(v * 20) / 20));
  var y = window.scrollY, h = document.documentElement.scrollHeight;
  document.documentElement.style.setProperty('--ts', v);
  try { localStorage.setItem('text-scale', v); } catch (e) {}
  // keep the reader at the same place in the text as it reflows
  if (h > 0) window.scrollTo(0, y * document.documentElement.scrollHeight / h);
  var r = document.getElementById('ts-range'); if (r) r.value = Math.round(v * 100);
  var lab = document.getElementById('ts-val');
  if (lab) lab.textContent = Math.round(v * 100) + '%' + (v === 1 ? ' · normal' : '');
  var hv = document.getElementById('ts-home-val'); if (hv) hv.textContent = Math.round(v * 100) + '%';
  syncHeaderOffset();
}
function tsStep(d) { tsSet(tsGet() + d * 0.05); }
function tsOpen() {
  pkClose(); closeVerseJump();
  tsSet(tsGet());
  document.getElementById('ts-backdrop').classList.add('open');
  document.getElementById('ts-sheet').classList.add('open');
}

/* ── Offline download: saves every book and study into the service worker's
   persistent data cache (sw.js DATA_CACHE), which survives app updates. ── */
var DL_CACHE = 'commentaries-data';
var dlBusy = false;
function dlFiles() { return BOOKS.map(function(b){ return 'data/' + b.id + '.json'; }).concat(['data/glossary.json']); }
function dlToggle() {
  var b = document.getElementById('dl-body'), c = document.getElementById('dl-chevron');
  var open = !b.classList.contains('open');
  b.classList.toggle('open', open); c.classList.toggle('open', open);
}
function dlStatus(txt, ok) {
  var el = document.getElementById('dl-status'); if (!el) return;
  el.textContent = txt; el.classList.toggle('ok', !!ok);
}
function dlRefresh() {
  var t = document.getElementById('dl-text'), btn = document.getElementById('dl-btn');
  if (!t || dlBusy) return;
  if (!window.caches) { t.textContent = 'Offline saving is not available in this browser.'; return; }
  caches.open(DL_CACHE).then(function(c){ return c.keys(); }).then(function(keys){
    var have = {}; keys.forEach(function(r){ have[new URL(r.url).pathname.replace(/^.*\/data\//, 'data/')] = 1; });
    var files = dlFiles(), n = files.filter(function(f){ return have[f]; }).length;
    if (n >= files.length) {
      t.innerHTML = '&#10003; Everything is saved on this device &mdash; all ' + BOOKS.length + ' books and studies can be read without a connection. Updates still arrive automatically when you are online.';
      btn.textContent = 'Download again'; btn.disabled = false;
      dlStatus('\u2713 saved', true);
    } else {
      t.textContent = (n ? n + ' of ' + files.length + ' are saved so far. ' : '') + 'Save every book and study on this device (about 24 MB) so the whole app works without a connection — on a flight or wherever there is no signal.';
      btn.textContent = n ? 'Download the rest' : 'Download everything'; btn.disabled = false;
      dlStatus(n ? n + ' / ' + files.length + ' saved' : 'not saved');
    }
  }).catch(function(){ t.textContent = 'Offline saving is not available here.'; });
}
function dlStart() {
  if (dlBusy || !window.caches) return;
  dlBusy = true;
  var t = document.getElementById('dl-text'), btn = document.getElementById('dl-btn'), bar = document.getElementById('dl-bar');
  var files = dlFiles(), done = 0, failed = 0, next = 0;
  btn.disabled = true; bar.style.display = 'block';
  caches.open(DL_CACHE).then(function(c){
    function step() {
      if (next >= files.length) return Promise.resolve();
      var f = files[next++];
      return c.add(f).catch(function(){ failed++; }).then(function(){
        done++;
        t.textContent = 'Downloading… ' + done + ' of ' + files.length;
        dlStatus(done + ' / ' + files.length);
        bar.firstChild.style.width = Math.round(100 * done / files.length) + '%';
        return step();
      });
    }
    return Promise.all([step(), step(), step(), step()]);
  }).then(function(){
    dlBusy = false; bar.style.display = 'none';
    if (failed) { dlStatus('incomplete'); t.textContent = failed + ' could not be downloaded (check the connection) — tap to try again.'; btn.textContent = 'Try again'; btn.disabled = false; }
    else dlRefresh();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  });
}

function openBook(id) {
  currentBook = BOOKS.find(b => b.id === id);
  localStorage.setItem('last-book', id);
  document.getElementById('home-screen').style.display = 'none';
  document.getElementById('reader-screen').style.display = 'block';
  document.getElementById('reader-nav').style.display = 'flex';
  document.title = currentBook.title;
  document.getElementById('content').innerHTML = '<p style="padding:2rem;color:#a09070;text-align:center">Loading&hellip;</p>';

  var pre = (typeof pk !== 'undefined' && pk.data && pk.data.id === id) ? pkLoad(id) : null;
  (pre || fetch('data/' + id + '.json').then(r => r.json()))
    .then(data => {
      currentData = data;
      currentKeys = Object.keys(data).map(Number).sort((a,b) => a-b);
      var sel = document.getElementById('unit-select');
      sel.innerHTML = '';
      currentKeys.forEach(k => {
        var o = document.createElement('option');
        o.value = k;
        var ref = data[k].ref || String(k);
        var chTitle = data[k].title || data[k].subtitle || '';
        var label;
        if (currentBook.testament === 'ST') {
          var title = data[k].title || '';
          var rangeMatch = title.match(/(\d{2,4})[–—\-](\d{2,4})/);
          if (rangeMatch) {
            label = rangeMatch[1] + '–' + rangeMatch[2];
          } else {
            var yearMatch = title.match(/\d{3,4}/);
            label = yearMatch ? yearMatch[0] : (ref.match(/\d+/) ? ref.match(/\d+/)[0] : ref.substring(0, 5));
          }
        } else {
          var num = ref.match(/\d+/);
          label = num ? num[0] : (k === 0 ? 'Intro' : ref.substring(0, 5));
        }
        if (chTitle) {
          var decoded = chTitle.replace(/&rsquo;/g,"'").replace(/&lsquo;/g,"'").replace(/&ldquo;/g,'"').replace(/&rdquo;/g,'"').replace(/&ndash;/g,'–').replace(/&mdash;/g,'—').replace(/&amp;/g,'&');
          var short = decoded.length > 30 ? decoded.substring(0, 28) + '…' : decoded;
          label = label + ' · ' + short;
        }
        o.textContent = label;
        sel.appendChild(o);
      });
      var saved = localStorage.getItem(id + '-pos');
      var start = (saved !== null && data[+saved] !== undefined) ? +saved : currentKeys[0];
      render(currentKeys.indexOf(start));
      if (pkAfterOpen) { var f = pkAfterOpen; pkAfterOpen = null; f(); }
    })
    .catch(() => {
      document.getElementById('content').innerHTML = '<p style="padding:2rem;color:#c9a84c">Could not load ' + currentBook.title + '.</p>';
    });
}

/* Study line under a passage: two pills (Note, Parallels), each opening its own panel. */
var STUDY_GROUPS = [['same','Same event'],['nt','In the New Testament'],['saying','Same saying'],['quoted','Quoted here'],['background','Background'],['see','See also']];
function studyToggle(btn, which){
  var box = btn.parentNode, open = box.getAttribute('data-open') === which ? '' : which;
  box.setAttribute('data-open', open);
  box.querySelectorAll('.study-btn').forEach(function(b){ b.setAttribute('aria-expanded', b.getAttribute('data-w') === open); });
}
function studyLine(v){
  var par = (v.parallels || []).map(function(x){ return typeof x === 'string' ? { type: 'see', ref: x } : x; });
  var h = '<div class="vbv-study" data-open="">';
  if (v.note) h += '<button type="button" class="study-btn" data-w="note" aria-expanded="false" onclick="studyToggle(this,\'note\')">&#9432; Note</button>';
  if (par.length) h += '<button type="button" class="study-btn" data-w="par" aria-expanded="false" onclick="studyToggle(this,\'par\')">&#8644; ' + par.length + (par.length === 1 ? ' parallel' : ' parallels') + '</button>';
  if (v.note) h += '<div class="study-panel study-note">' + v.note + '</div>';
  if (par.length) {
    h += '<div class="study-panel study-pars">';
    STUDY_GROUPS.forEach(function(g){
      var items = par.filter(function(x){ return x.type === g[0]; });
      if (!items.length) return;
      h += '<div class="study-grp"><div class="study-lbl">' + g[1] + '</div>';
      var plain = items.filter(function(x){ return !x.desc; }), rich = items.filter(function(x){ return x.desc; });
      if (plain.length) h += '<div class="study-item">' + plain.map(function(x){ return x.ref; }).join(' &middot; ') + '</div>';
      rich.forEach(function(x){ h += '<div class="study-item">' + x.ref + ' <span class="study-desc">&mdash; ' + x.desc + '</span></div>'; });
      h += '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}
function render(idx) {
  if (!currentData || idx < 0 || idx >= currentKeys.length) return;
  currentIdx = idx;
  var k = currentKeys[idx];
  var ch = currentData[k];
  document.getElementById('unit-select').value = k;
  localStorage.setItem(currentBook.id + '-pos', k);

  var html = '';

  // Title block
  var title = ch.title || ch.subtitle || '';
  var ref   = ch.ref   || (k === 0 ? 'Introduction' : k === currentKeys[currentKeys.length-1] ? 'About' : '');
  if (title) html += '<h2>' + title + '</h2>';
  if (ref)   html += '<div class="ref">' + ref + '</div>';
  html += '<div id="gl-chips"><div class="gl-chips-label">Terms in this chapter</div><div class="gl-chips-row" id="gl-chips-row"></div></div>';

  // ESV text
  if (ch.text) {
    html += '<details><summary>ESV Text</summary><div class="passage-text">' + ch.text + '</div></details>';
  }

  // Overview / intro
  var intro = ch.overview || ch.intro || '';
  if (intro) {
    html += '<details><summary>Overview</summary><div class="detail-body">' + intro + '</div></details>';
  }

  // Verse by verse
  if (ch.verseByVerse && ch.verseByVerse.length > 0) {
    // Chip map
    html += '<div class="verse-map">';
    ch.verseByVerse.forEach((v, i) => {
      html += '<a class="' + (v.sectionBreak ? 'section-chip' : 'verse-chip') + '" href="#vs' + i + '">' + v.ref + '</a>';
    });
    html += '</div>';
    // Section headers render outside <details> so they're always visible.
    // Verse entries are buffered and flushed into a <details> per section.
    var vbvLabel = currentBook.testament === 'ST' ? 'Details' : 'Verse by Verse';
    var verseBuffer = [];
    var curTheology = '';
    var curExamples = '';
    function flushVerses() {
      if (!verseBuffer.length) return;
      html += '<details open><summary>' + vbvLabel + '</summary>' + verseBuffer.join('') + '</details>';
      verseBuffer = [];
      if (curTheology) { html += '<details><summary>Theology</summary><div class="accent-box">' + curTheology + '</div></details>'; curTheology = ''; }
      if (curExamples) { html += '<details><summary>Then &amp; Now</summary><div class="accent-box">' + curExamples + '</div></details>'; curExamples = ''; }
    }
    ch.verseByVerse.forEach((v, i) => {
      if (v.sectionBreak) {
        flushVerses();
        html += '<div class="section-hd" id="vs' + i + '">';
        html += '<div class="section-hd-ref">' + v.ref + '</div>';
        if (v.sectionOverview) html += '<div class="section-hd-overview">' + v.sectionOverview + '</div>';
        html += '</div>';
        curTheology = v.theology || '';
        curExamples = v.examples || '';
      } else {
        var entry = '<div class="vbv-entry" id="vs' + i + '">';
        entry += '<div class="vbv-ref">' + v.ref + '</div>';
        if (v.quote) { var q = v.quote.replace(/^[“”"]+/, '').replace(/^(&ldquo;|&rdquo;)+/, '').replace(/[“”"]+$/, '').replace(/(&ldquo;|&rdquo;)+$/, ''); entry += '<div class="vbv-quote">&ldquo;' + q + '&rdquo;</div>'; }
        if (v.note || (v.parallels && v.parallels.length)) entry += studyLine(v);
        if (v.commentary) entry += '<div class="vbv-commentary">' + v.commentary + '</div>';
        entry += '</div>';
        verseBuffer.push(entry);
      }
    });
    flushVerses();
  }

  // Sections (Isaiah style — handled for prototype)
  if (ch.sections && ch.sections.length > 0) {
    // Section chips for direct navigation
    html += '<div class="chip-bar">';
    ch.sections.forEach((sec, i) => {
      html += '<a class="verse-chip" href="#sec' + i + '">' + (sec.ref || sec.title) + '</a>';
    });
    html += '</div>';
    html += '<details open><summary>Commentary</summary>';
    ch.sections.forEach((sec, i) => {
      html += '<div class="vbv-entry" id="sec' + i + '">';
      html += '<div class="vbv-ref">' + sec.title + (sec.ref ? ' <span style="color:#a09070;font-weight:normal;font-size:.85rem">— ' + sec.ref + '</span>' : '') + '</div>';
      if (sec.commentary) html += '<div class="vbv-commentary">' + sec.commentary + '</div>';
      html += '</div>';
    });
    html += '</details>';
  }

  // Theology
  if (ch.theology) {
    html += '<details><summary>Theology</summary><div class="accent-box">' + ch.theology + '</div></details>';
  }

  // Key verse (Isaiah)
  if (typeof ch.keyVerse === 'string') ch.keyVerse = { ref: '', quote: ch.keyVerse };
  if (ch.keyVerse && ch.keyVerse.quote) {
    html += '<details><summary>Key Verse</summary><div class="accent-box">'
      + '<div class="vbv-ref">' + ch.keyVerse.ref + '</div>'
      + '<div class="vbv-quote">&ldquo;' + ch.keyVerse.quote.replace(/^["""]+/, '').replace(/^(&ldquo;|&rdquo;)+/, '').replace(/["""]+$/, '').replace(/(&ldquo;|&rdquo;)+$/, '') + '&rdquo;</div>'
      + (ch.keyVerse.note ? '<div class="vbv-commentary">' + ch.keyVerse.note + '</div>' : '')
      + '</div></details>';
  }

  // Then & Now
  if (ch.examples) {
    html += '<details><summary>Then &amp; Now</summary><div class="accent-box">' + ch.examples + '</div></details>';
  }

  // Reflection (Isaiah)
  if (ch.reflection) {
    html += '<details><summary>For Reflection</summary><div class="accent-box"><p>' + ch.reflection + '</p></div></details>';
  }

  document.getElementById('content').innerHTML = html;
  var curCanon = (currentBook && ESV_BOOKS[currentBook.title.toLowerCase().replace(/[.\s ]/g, '')]) || null;
  var chMatch = /(?:chapter|psalm)\s+(\d+)\s*$/i.exec(ref || '');
  linkifyScripture(document.getElementById('content'), curCanon, chMatch ? chMatch[1] : null);
  addCopyButtons();
  buildVerseIndex(ch);
  closeVerseJump();
  syncHeaderOffset();
  refreshVersePill();

  // Prev/next button state
  document.getElementById('prev-btn').disabled = (idx === 0 && !prevBook());
  document.getElementById('next-btn').disabled = (idx === currentKeys.length - 1 && !nextBook());

  // Cross-book nav: "Continue to" at end only
  var atEnd = idx === currentKeys.length - 1;
  var nb = nextBook();
  if (atEnd && nb) {
    document.getElementById('content').insertAdjacentHTML('beforeend',
      '<div style="text-align:center;padding:2rem 0">'
      + '<button onclick="openBook(\'' + nb.id + '\')" style="background:#1a3a5c;border:1px solid #c9a84c;color:#c9a84c;padding:.6rem 1.4rem;border-radius:4px;cursor:pointer;font-size:.95rem">'
      + 'Continue to ' + nb.title + ' &#8594;</button></div>');
  }

  glBuild();
    if (pendingScrollRestore !== null) {
    var y = pendingScrollRestore; pendingScrollRestore = null;
    requestAnimationFrame(function() { window.scrollTo(0, y); });
  } else {
    window.scrollTo(0,0);
  }
}

function prevBook() {
  if (!currentBook) return null;
  var idx = BOOKS.indexOf(currentBook);
  return idx > 0 ? BOOKS[idx - 1] : null;
}
function nextBook() {
  if (!currentBook) return null;
  var idx = BOOKS.indexOf(currentBook);
  return idx < BOOKS.length - 1 ? BOOKS[idx + 1] : null;
}

function goTo(k)         { render(currentKeys.indexOf(+k)); }
function navigate(dir) {
  var newIdx = currentIdx + dir;
  if (newIdx < 0) { var pb = prevBook(); if (pb) openBook(pb.id); return; }
  if (newIdx >= currentKeys.length) { var nb = nextBook(); if (nb) openBook(nb.id); return; }
  render(newIdx);
}

// ── Keyboard navigation ───────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (!currentBook || verseJumpOpen() || pkIsOpen() || document.getElementById('ts-sheet').classList.contains('open') || (window.RefCard && RefCard.isOpen())) return;
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navigate(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); navigate(1); }
});

// ── Swipe navigation ──────────────────────────────────────────────────────
(function() {
  var startX = 0, startY = 0;
  document.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!currentBook || verseJumpOpen() || pkIsOpen() || document.getElementById('ts-sheet').classList.contains('open') || (window.RefCard && RefCard.isOpen())) return;
    var dx = e.changedTouches[0].clientX - startX;
    var dy = e.changedTouches[0].clientY - startY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      navigate(dx < 0 ? 1 : -1);
    }
  }, { passive: true });
})();

// ── Init ─────────────────────────────────────────────────────────────────
buildHome();

// On load, return to where the reader left off; fall back to the home screen.
(function restoreLast() {
  var go = /[?&]go=([a-z0-9]+)\.(\d+)\.(\d+)/.exec(location.search);
  if (go && BOOKS.find(function(b) { return b.id === go[1]; })) {
    history.replaceState(null, '', location.pathname);
    showHome();
    pkGo(go[1], +go[2], +go[3]);
    return;
  }
  var lastBook = localStorage.getItem('last-book');
  if (lastBook && BOOKS.find(function(b) { return b.id === lastBook; })) {
    var savedChapter = localStorage.getItem(lastBook + '-pos');
    if (savedChapter !== null) {
      var y = localStorage.getItem(lastBook + '-' + savedChapter + '-scroll');
      pendingScrollRestore = y !== null ? parseInt(y, 10) : null;
    }
    showHome();        // prime home behind the reader so the back-button works
    openBook(lastBook);
  } else {
    showHome();
  }
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
}

/* ── Terms in this chapter ───────────────────────────────────────────────
   The commentary prose is never marked up: no inline links anywhere. Each
   chapter instead lists the technical terms it deals with, as chips under the
   heading. A chip opens a sheet with the definition; where the term is taught
   in the verse track the sheet offers a jump to that entry, so the chip points
   at the TEACHING rather than at whichever mention happened to come first.
   The glossary is optional -- if it fails to load the app is unaffected. */
var GLOSS = null, GL_RX = null, GL_BY = {}, GL_FOUND = [], GL_MAX = 12;
fetch('data/glossary.json').then(function(r){ return r.json(); }).then(function(j){
  GLOSS = j;
  var pats = [];
  j.forEach(function(t){ t.m.forEach(function(m){ GL_BY[m.toLowerCase()] = t; pats.push(m); }); });
  pats.sort(function(a, b){ return b.length - a.length; });
  GL_RX = new RegExp('\\b(' + pats.map(function(p){
    return p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')\\b', 'gi');
  glBuild();
}).catch(function(){});

function glBuild(){
  var row = document.getElementById('gl-chips-row');
  var wrap = document.getElementById('gl-chips');
  if (!GLOSS || !row || !wrap) return;
  row.innerHTML = ''; GL_FOUND = [];
  var root = document.getElementById('content');
  if (!root) return;
  var seen = {}, hits = [];
  /* the verse track first, in order -- these carry a jump target */
  [].slice.call(root.querySelectorAll('.vbv-entry')).forEach(function(en){
    var c = en.querySelector('.vbv-commentary');       /* never the quoted verse */
    if (!c) return;
    var txt = c.textContent || '', m;
    GL_RX.lastIndex = 0;
    while ((m = GL_RX.exec(txt))) {
      var t = GL_BY[m[1].toLowerCase()];
      if (!t || seen[t.a]) continue;
      seen[t.a] = 1;
      var rf = en.querySelector('.vbv-ref');
      hits.push({ t: t, el: en, ref: rf ? rf.textContent.trim() : '' });
    }
  });
  /* then anything appearing only in a box -- no jump target rather than a wrong one */
  ['.detail-body', '.section-hd-overview', '.accent-box'].forEach(function(sel){
    [].slice.call(root.querySelectorAll(sel)).forEach(function(bx){
      var txt = bx.textContent || '', m;
      GL_RX.lastIndex = 0;
      while ((m = GL_RX.exec(txt))) {
        var t = GL_BY[m[1].toLowerCase()];
        if (!t || seen[t.a]) continue;
        seen[t.a] = 1;
        hits.push({ t: t, el: null, ref: '' });
      }
    });
  });
  /* Cap the row. Some chapters match dozens of terms (the dictionary began as
     an Ephesians glossary, so Eph. 4 matches 54). Keep the RAREST, which are
     the ones that actually say something about this chapter, then restore
     reading order for display. */
  if (hits.length > GL_MAX) {
    hits.forEach(function(h, i){ h.i = i; });
    hits = hits.slice().sort(function(a, b){ return (a.t.r || 0) - (b.t.r || 0); })
               .slice(0, GL_MAX)
               .sort(function(a, b){ return a.i - b.i; });
  }
  GL_FOUND = hits;
  if (!GL_FOUND.length) { wrap.classList.remove('on'); return; }
  GL_FOUND.forEach(function(f, i){
    var c = document.createElement('span');
    c.className = 'gl-chip';
    c.textContent = f.t.n;
    c.onclick = function(){ glOpen(i); };
    row.appendChild(c);
  });
  wrap.classList.add('on');
}
function glOpen(i){
  var f = GL_FOUND[i]; if (!f) return;
  document.getElementById('gl-name').textContent = f.t.n;
  document.getElementById('gl-word').textContent = f.t.w;
  document.getElementById('gl-body').textContent = f.t.g;
  document.getElementById('gl-full').href = 'dictionary.html#term-' + f.t.a;
  var go = document.getElementById('gl-goto');
  if (f.el && f.ref) {
    go.textContent = 'Go to ' + f.ref;
    go.style.display = '';
    go.onclick = function(){ glClose(); glGoto(f.el); };
  } else { go.style.display = 'none'; }
  document.getElementById('gl-sheet').classList.add('open');
  document.getElementById('gl-backdrop').classList.add('open');
}
function glGoto(el){
  var p = el;
  while (p && p.id !== 'content') { if (p.nodeName === 'DETAILS') p.open = true; p = p.parentNode; }
  setTimeout(function(){
    var r = el.getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + r.top - 90, behavior: 'smooth' });
  }, 60);
}
function glClose(){
  document.getElementById('gl-sheet').classList.remove('open');
  document.getElementById('gl-backdrop').classList.remove('open');
}

</script>
