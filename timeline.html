<style>
*{box-sizing:border-box;margin:0;padding:0}

/* Era heading */
.era-head{color:#c9a84c;font-size:1.1rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid #c9a84c;padding-bottom:.4rem;margin:2.2rem 0 .4rem}

/* Timeline entries: a hairline down the left, a mark at each entry */
.tl-list{border-left:1px solid var(--hair,rgba(200,169,90,.26));margin-left:.35rem;padding-left:1.15rem}

.tl-card:before{content:"";position:absolute;left:calc(-1.15rem - 5px);top:.62rem;width:9px;height:9px;border-radius:50%;background:var(--ink,#0b1524);border:1px solid var(--gold,#c8a95a)}
.tl-date{color:var(--gold,#c8a95a);font-family:var(--display,Georgia,serif);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.82rem;padding-right:2rem}
.tl-name{font-family:var(--display,Georgia,serif);font-weight:600;color:var(--gold,#c8a95a);font-size:1.42rem;line-height:1.2;margin:.15rem 0 .5rem;padding-right:2rem}

.tl-refs-label{color:var(--gold,#c8a95a);font-family:var(--display,Georgia,serif);font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:.74rem;margin-right:.45rem}
.see-map{display:inline-block;margin-top:.55rem;color:var(--gold,#c8a95a);font-style:italic;font-size:.95rem;text-decoration:underline;text-decoration-color:rgba(200,169,90,.4);text-underline-offset:3px;cursor:pointer;touch-action:manipulation}

.map-title{font-family:var(--display,Georgia,serif);font-weight:600;color:var(--gold,#c8a95a);font-size:1.4rem;line-height:1.2;margin-bottom:.6rem}
.map-tools{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.55rem;align-items:center}
.map-btn{background:none;border:1px solid var(--hair-soft,rgba(236,227,207,.085));border-radius:999px;color:var(--parch-2,#d9cdb3);font-style:italic;font-family:inherit;font-size:.82rem;padding:.22rem .65rem;cursor:pointer;touch-action:manipulation}
.map-btn.active{background:rgba(200,169,90,.12);border-color:var(--gold-soft,rgba(200,169,90,.55));color:var(--gold,#c8a95a)}

.map-caption{line-height:1.7;font-size:.95rem;color:var(--parch-2,#d9cdb3);margin-top:.35rem}
.map-entries{margin-top:.6rem;font-size:.9rem;line-height:1.9}
.map-entries-label{color:var(--gold,#c8a95a);font-family:var(--display,Georgia,serif);letter-spacing:.2em;text-transform:uppercase;font-size:.72rem;margin-right:.4rem}
.map-entry-link{color:var(--parch-2,#d9cdb3);font-style:italic;cursor:pointer;border-bottom:1px solid var(--hair,rgba(200,169,90,.26));margin-right:.7rem;white-space:normal;touch-action:manipulation}

  --m-tribe:#3b2f22;--m-king:#6e4214;--m-area:rgba(110,66,20,.15);--m-edge:#6e4214;--m-border:#9a2f18;--m-frame:#9c8158;
  --m-small:#3b2f22;--m-r1:#7a4e00;--m-r2:#a3321a;--m-r3:#00695c;--m-r4:#7a3a00}

  --m-tribe:#fff;--m-king:#ffe14d;--m-area:rgba(255,225,77,.22);--m-edge:#ffe14d;--m-border:#ff8a65;--m-frame:#ffe14d;

.map-svg .mp-land{fill:var(--m-land)}
.map-svg .mp-sea{fill:var(--m-sea);stroke:var(--m-coast);stroke-width:.8;stroke-linejoin:round}

.map-svg .mp-area{fill:var(--m-area);stroke:none}

.mp-route{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}

.scripture-link{color:inherit;text-decoration:underline;text-decoration-color:rgba(201,168,76,.32);text-decoration-style:dotted;text-decoration-thickness:1px;text-underline-offset:3px}

<p class="page-scope">The story of the Bible in order, with maps. Dates before about 900 BC are approximate: this commentary follows the commonly used conservative dates, reckoned from the Bible’s own figures, and notes where other dates are widely held.</p>

<main id="mainContent"></main>

<script src="scripture-links.js?v=4216"></script>
<script>
const FILTERS = [
  { id:'all',        label:'All' },
  { id:'beginnings', label:'Beginnings',             span:'The Bible gives no fixed dates' },
  { id:'patriarchs', label:'Patriarchs',             span:'About 2100–1800 BC' },
  { id:'exodus',     label:'Egypt & the Exodus',     span:'About 1876–1406 BC' },
  { id:'conquest',   label:'Conquest & Judges',      span:'About 1406–1050 BC' },
  { id:'united',     label:'United Kingdom',         span:'About 1050–931 BC' },
  { id:'divided',    label:'Divided Kingdom',        span:'About 931–586 BC' },
  { id:'exile',      label:'Exile & Return',         span:'605 BC to the 5th century BC' },
  { id:'between',    label:'Between the Testaments', span:'About 430–4 BC' },
  { id:'jesus',      label:'Life of Jesus',          span:'About 6 BC to AD 30 or 33' },
  { id:'apostolic',  label:'Apostolic Age',          span:'AD 30 or 33 to about AD 95' },
  { id:'maps',       label:'Maps' },
];

const TIMELINE = [
  // ── Beginnings ──────────────────────────────────────────────────────────
  { id:'creation', era:'beginnings', name:'Creation', date:'No fixed date',
    text:'Scripture opens with God making all things by his word: “In the beginning, God created the heavens and the earth.” This commentary holds that God made all things in six ordinary days, each closed with evening and morning (Genesis 1:5; Exodus 20:11), and that with the genealogies of Genesis 5 and 11, which are true history, those days point to a young creation, thousands rather than millions or billions of years ago. The Bible gives no exact date: Archbishop Ussher’s 4004 BC is one calculation among several, and faithful Christians who hold to the full authority of Scripture differ over the age of the earth and over how the days of Genesis 1 are to be read. What Genesis plainly teaches is that God alone is Creator, that the world he made was very good, and that man and woman were made in his image to rule the earth under him.',
    refs:['Genesis 1:1–2:3','Psalm 33:6–9','John 1:1–3','Hebrews 11:3'] },
  { id:'fall', era:'beginnings', name:'The fall and the first promise', date:'No fixed date',
    text:'Adam and Eve disobeyed God’s command, and through the one man sin and death entered the world (Romans 5:12). In the same chapter that pronounces judgment, God gives the first promise of the gospel: the offspring of the woman will bruise the serpent’s head (Genesis 3:15). The rest of Scripture traces how that promise is kept in Christ.',
    refs:['Genesis 3:1–24','Romans 5:12–21'] },
  { id:'flood', era:'beginnings', name:'The flood', date:'No fixed date',
    text:'As violence filled the earth, God judged the world by a flood and saved Noah and his family in the ark. The Bible gives no date for the flood, and Christians differ over its date and extent, and over whether the genealogies of Genesis 5 and 11 are complete lists or select names. Afterwards God made a covenant with Noah and every living creature never again to destroy the earth by a flood, with the rainbow as its sign. The New Testament treats the flood as real history and as a warning of the judgment to come (2 Peter 3:5–7).',
    refs:['Genesis 6:5–9:17','Hebrews 11:7','2 Peter 3:5–7'] },
  { id:'babel', era:'beginnings', name:'Babel and the nations', date:'No fixed date',
    text:'Genesis 10 lists the nations descended from Noah’s sons, and Genesis 11 tells how people gathered at Babel to build a city and a tower and make a name for themselves. God confused their language and scattered them over the earth. The next chapter begins God’s answer to the scattered nations: the call of one man through whom blessing would come to them all. Many read the gift of tongues at Pentecost as a sign that this division is being overcome in Christ (Acts 2:5–11).',
    refs:['Genesis 10:1–11:9','Acts 2:5–11'] },

  // ── Patriarchs ──────────────────────────────────────────────────────────
  { id:'abram-call', era:'patriarchs', name:'The call of Abram', date:'About 2091 BC', map:'patriarchs',
    text:'God called Abram to leave Ur of the Chaldeans and, after a stay in Haran, to go to a land he would show him, promising him a great name, a nation and a land, and that “in you all the families of the earth shall be blessed.” Abram went in faith, not knowing where he was going (Hebrews 11:8). The date is reckoned back from the Bible’s own figures (1 Kings 6:1; Exodus 12:40) and is approximate; many historians place the patriarchs somewhat later in the early second millennium BC.',
    refs:['Genesis 11:27–12:9','Hebrews 11:8–10'] },
  { id:'abraham-covenant', era:'patriarchs', name:'God’s covenant with Abraham', date:'About 2080–2067 BC',
    text:'When Abram believed God’s promise of offspring as many as the stars, God counted his faith to him as righteousness (Genesis 15:6). God then bound himself to the promise in a covenant ceremony, passing alone between the divided animals. In Genesis 17 he renamed Abram as Abraham, father of a multitude of nations, and gave circumcision as the sign of the covenant. Paul builds on these chapters to show that Abraham was justified by faith before he was circumcised, and is the father of all who believe (Romans 4:9–12).',
    refs:['Genesis 15:1–21','Genesis 17:1–14','Romans 4:1–12','Galatians 3:6–9'] },
  { id:'isaac', era:'patriarchs', name:'Isaac and Mount Moriah', date:'Isaac born about 2066 BC',
    text:'Isaac, the son of promise, was born to Abraham and Sarah in their old age, when Abraham was a hundred. Later God tested Abraham by commanding him to offer Isaac on a mountain in the land of Moriah, then stopped his hand and provided a ram in Isaac’s place. Hebrews says Abraham reckoned that God was able to raise the dead (Hebrews 11:17–19), and 2 Chronicles 3:1 places Solomon’s temple on Mount Moriah.',
    refs:['Genesis 21:1–7','Genesis 22:1–19','Hebrews 11:17–19'] },
  { id:'jacob', era:'patriarchs', name:'Jacob and the twelve tribes', date:'Jacob born about 2006 BC', map:'patriarchs',
    text:'Isaac’s younger son Jacob received the blessing and fled from his brother Esau to his mother’s family in Paddan-aram. On the way, at Bethel, God renewed to him the promises made to Abraham. In twenty years with Laban he gained wives, flocks and sons, and on his return he wrestled with God at Peniel and was named Israel. His twelve sons became the heads of the tribes of Israel.',
    refs:['Genesis 25:19–34','Genesis 28:10–22','Genesis 32:22–32','Genesis 35:9–26'] },
  { id:'joseph', era:'patriarchs', name:'Joseph, and Israel goes down to Egypt', date:'About 1876 BC', map:'patriarchs',
    text:'Jacob’s favoured son Joseph was sold by his brothers into slavery, but God raised him to rule in Egypt under Pharaoh and through him kept many alive in a great famine. Jacob’s family, seventy persons, settled in the land of Goshen in the eastern Nile Delta. Joseph saw God’s hand in it all: “you meant evil against me, but God meant it for good”. The date, when Jacob was 130, follows from the same reckoning as Abraham’s.',
    refs:['Genesis 37:1–36','Genesis 41:37–57','Genesis 45:4–8','Genesis 46:1–27','Genesis 50:15–21'] },

  // ── Egypt & the Exodus ─────────────────────────────────────────────────
  { id:'slavery', era:'exodus', name:'Slavery in Egypt', date:'About 1876–1446 BC', map:'exodus',
    text:'Israel multiplied in Egypt until a new king arose who did not know Joseph and set them to forced labour building the store cities Pithom and Raamses (Exodus 1:11). Exodus 12:40 gives the time Israel lived in Egypt as 430 years. Some, following the Greek Old Testament and Galatians 3:17, take the 430 years to include the patriarchs’ time in Canaan, which would shorten the stay in Egypt to about 215 years.',
    refs:['Exodus 1:1–22','Exodus 12:40–41','Acts 7:17–19','Galatians 3:17'] },
  { id:'moses-call', era:'exodus', name:'Moses and the burning bush', date:'About 1446 BC', map:'exodus',
    text:'Moses, born when Pharaoh had ordered the Hebrew boys to be killed, was raised in Pharaoh’s household, fled to Midian at forty, and at eighty was called by God from a burning bush at Horeb, the mountain of God. There God revealed his name: “I AM WHO I AM.” He sent Moses to bring his people out of Egypt, remembering his covenant with Abraham, Isaac and Jacob.',
    refs:['Exodus 2:1–25','Exodus 3:1–15','Exodus 7:7','Acts 7:20–34'] },
  { id:'exodus', era:'exodus', name:'The Passover and the exodus', date:'About 1446 BC', map:'exodus',
    text:'After ten plagues on Egypt, the LORD struck down the firstborn, passing over the houses marked with the blood of the Passover lamb, and Israel left Egypt. He then brought them through the sea on dry ground and overthrew Pharaoh’s army. The date about 1446 BC follows 1 Kings 6:1, which places the exodus 480 years before Solomon began the temple; many scholars instead date it about 1260 BC, under Rameses II. Paul calls Christ “our Passover lamb” (1 Corinthians 5:7).',
    refs:['Exodus 12:1–42','Exodus 14:1–31','1 Kings 6:1','1 Corinthians 5:7'] },
  { id:'sinai', era:'exodus', name:'The covenant at Sinai', date:'About 1446–1445 BC', map:'exodus',
    text:'In the third month after leaving Egypt, Israel camped at Mount Sinai. God gave the Ten Commandments and the law, and the covenant was sealed with blood (Exodus 24:8). The tabernacle was set up at the start of the second year, and the glory of the LORD filled it. The site of Mount Sinai is uncertain: Jebel Musa in southern Sinai is the traditional site, and others have been proposed in Sinai and in Arabia.',
    refs:['Exodus 19:1–20:21','Exodus 24:1–8','Exodus 40:17–38'] },
  { id:'wilderness', era:'exodus', name:'Forty years in the wilderness', date:'About 1446–1406 BC', map:'exodus',
    text:'Twelve spies were sent into Canaan from the wilderness of Paran and reported back at Kadesh. The people believed the ten who said the land could not be taken, rather than Joshua and Caleb, and God sentenced that generation to wander for forty years until it had died in the wilderness. Even so he fed them with manna and gave them water from the rock. When the people were bitten by serpents, he told Moses to lift up a bronze serpent, a sign Jesus applied to his own death (John 3:14–15).',
    refs:['Numbers 13:1–14:38','Numbers 20:1–13','Numbers 21:4–9','John 3:14–15','Hebrews 3:7–19'] },
  { id:'moab', era:'exodus', name:'Moses on the plains of Moab', date:'About 1406 BC', map:'exodus',
    text:'On the plains of Moab, across the Jordan from Jericho, Moses set the law before the new generation in the sermons of Deuteronomy and renewed the covenant. He promised that God would raise up a prophet like him, whom the apostles identified as Jesus (Acts 3:22). From Mount Nebo Moses saw the land he would not enter, and he died in the land of Moab.',
    refs:['Deuteronomy 1:1–5','Deuteronomy 18:15–19','Deuteronomy 34:1–8','Acts 3:22–23'] },

  // ── Conquest & Judges ──────────────────────────────────────────────────
  { id:'jericho', era:'conquest', name:'Across the Jordan to Jericho', date:'About 1406 BC', map:'tribes',
    text:'Under Joshua, Israel crossed the Jordan as its waters stopped before the ark, and camped at Gilgal. Jericho’s walls fell after the people had marched round the city as God commanded, and Rahab, who had hidden the spies, was spared with her family. She is commended for her faith (Hebrews 11:31) and appears in the genealogy of Jesus (Matthew 1:5).',
    refs:['Joshua 2:1–24','Joshua 3:1–17','Joshua 6:1–27','Hebrews 11:31'] },
  { id:'conquest', era:'conquest', name:'The conquest and the dividing of the land', date:'About 1406–1400 BC', map:'tribes',
    text:'Joshua defeated an alliance of southern kings after the battle at Gibeon, and a northern alliance led by the king of Hazor. The land was then divided among the tribes by lot, and Joshua could say that not one of God’s good promises had failed (Joshua 21:45). Yet much land remained to be taken, and the tribes did not drive out all its peoples (Judges 1). Before his death Joshua called Israel to choose whom they would serve.',
    refs:['Joshua 10:1–15','Joshua 11:1–15','Joshua 14:1–5','Joshua 21:43–45','Joshua 24:14–15'] },
  { id:'judges', era:'conquest', name:'The judges', date:'About 1380–1050 BC', map:'tribes',
    text:'After Joshua’s generation died, Israel fell into a repeated cycle: they served other gods, God gave them into the hands of oppressors, they cried out, and he raised up judges to deliver them. Among them were Othniel, Ehud, Deborah with Barak, Gideon, Jephthah and Samson. Some of the judges’ periods probably overlapped, and their dates are uncertain. The book closes with a verdict on the age: “In those days there was no king in Israel. Everyone did what was right in his own eyes.”',
    refs:['Judges 2:11–19','Judges 4:1–5:31','Judges 6:11–7:25','Judges 21:25'] },
  { id:'ruth', era:'conquest', name:'Ruth', date:'In the days of the judges', map:'tribes',
    text:'In a time of famine an Israelite family from Bethlehem went to live in Moab. The widowed Moabite Ruth came back with her mother-in-law Naomi, trusting Israel’s God, and Boaz, a near kinsman, redeemed the family’s land and married her. Their son Obed was the grandfather of David, and Ruth is named in the genealogy of Jesus (Matthew 1:5).',
    refs:['Ruth 1:1–22','Ruth 4:13–22','Matthew 1:5'] },
  { id:'samuel', era:'conquest', name:'Samuel, prophet and last judge', date:'About 1100–1015 BC', map:'tribes',
    text:'Samuel, the son given to Hannah in answer to prayer, grew up at the tabernacle at Shiloh, where the LORD revealed himself to him. In his youth the Philistines captured the ark of the covenant, though they later sent it back. Samuel judged Israel all his life, called the people back to the LORD, and anointed first Saul and then David as king.',
    refs:['1 Samuel 1:1–3:21','1 Samuel 4:1–11','1 Samuel 7:3–17','1 Samuel 16:1–13'] },

  // ── United Kingdom ─────────────────────────────────────────────────────
  { id:'saul', era:'united', name:'Saul, the first king', date:'About 1050–1010 BC', map:'tribes',
    text:'The elders asked Samuel for a king to judge them like all the nations, and God gave them Saul of the tribe of Benjamin. Saul began well against the Ammonites and the Philistines but disobeyed the LORD’s commands, and Samuel told him that to obey is better than sacrifice (1 Samuel 15:22). He died with his sons in battle against the Philistines on Mount Gilboa. Acts 13:21 gives his reign as forty years.',
    refs:['1 Samuel 8:4–22','1 Samuel 10:17–27','1 Samuel 15:10–23','1 Samuel 31:1–13','Acts 13:21'] },
  { id:'david', era:'united', name:'David', date:'About 1010–970 BC', map:'tribes',
    text:'David reigned seven and a half years at Hebron over Judah and thirty-three years at Jerusalem over all Israel, after taking the city from the Jebusites. He brought the ark to Jerusalem, and God promised him a house and a kingdom established for ever (2 Samuel 7:16), a promise fulfilled in Jesus, the Son of David (Luke 1:32–33). His sins against Bathsheba and Uriah brought lasting trouble on his house, and Psalm 51 is his confession. An Aramaic inscription found at Tel Dan, from the 9th century BC, refers to the “house of David”.',
    refs:['2 Samuel 5:1–10','2 Samuel 7:8–16','2 Samuel 11:1–12:14','Psalm 51','Luke 1:32–33'] },
  { id:'solomon', era:'united', name:'Solomon and the temple', date:'About 970–931 BC', map:'tribes',
    text:'Solomon asked God for wisdom to govern his people and was given wisdom, riches and honour besides. In the fourth year of his reign, about 966 BC, he began the temple in Jerusalem, and at its dedication the glory of the LORD filled the house. But his many foreign wives turned his heart after other gods, and God declared that the kingdom would be torn from his son, apart from one tribe kept for David’s sake.',
    refs:['1 Kings 3:3–14','1 Kings 6:1','1 Kings 8:1–11','1 Kings 11:1–13'] },

  // ── Divided Kingdom ────────────────────────────────────────────────────
  { id:'division', era:'divided', name:'The kingdom divided', date:'About 931 BC', map:'tribes',
    text:'When Solomon’s son Rehoboam refused to lighten the people’s burdens, the ten northern tribes made Jeroboam king, and only Judah and Benjamin stayed with the house of David. To keep his people from worshipping at Jerusalem, Jeroboam set up golden calves at Bethel and Dan, the sin by which the later kings of Israel are judged. In Rehoboam’s fifth year Shishak king of Egypt invaded, a campaign also commemorated in Pharaoh Sheshonq I’s list of conquered towns at Karnak.',
    refs:['1 Kings 12:1–33','1 Kings 14:25–28','2 Chronicles 12:1–12'] },
  { id:'omri-ahab', era:'divided', name:'Omri, Ahab and Jezebel', date:'About 885–853 BC', map:'tribes',
    text:'Omri founded a strong dynasty in the northern kingdom and built Samaria as its capital; the Moabite Mesha Stele names him as king of Israel. His son Ahab married Jezebel of Sidon and promoted the worship of Baal. An inscription of the Assyrian king Shalmaneser III names Ahab among the kings who fought him at Qarqar in 853 BC, and the same year Ahab died in battle at Ramoth-gilead.',
    refs:['1 Kings 16:23–33','1 Kings 21:1–29','1 Kings 22:29–40'] },
  { id:'elijah', era:'divided', name:'Elijah', date:'Mid-9th century BC', map:'tribes',
    text:'Elijah confronted Ahab and the prophets of Baal. After a long drought he called down fire from heaven on Mount Carmel, and the people confessed that the LORD is God. Fleeing from Jezebel, he met God at Horeb in a low whisper. He was taken up to heaven in a whirlwind, and Malachi’s promise of Elijah’s coming was fulfilled, Jesus said, in John the Baptist (Matthew 11:14).',
    refs:['1 Kings 17:1','1 Kings 18:20–40','1 Kings 19:1–18','2 Kings 2:1–12','Matthew 11:14'] },
  { id:'elisha', era:'divided', name:'Elisha and Jehu', date:'About 850–795 BC', map:'tribes',
    text:'Elisha received a double portion of Elijah’s spirit and ministered for more than fifty years. He healed the Syrian commander Naaman, whom Jesus cited as a sign of God’s mercy to the Gentiles (Luke 4:27). At Elisha’s word Jehu was anointed king; in 841 BC he killed Joram of Israel and Ahaziah of Judah and wiped out the house of Ahab and the worship of Baal in Israel. The Black Obelisk of Shalmaneser III shows Jehu, or his envoy, bowing in tribute to Assyria.',
    refs:['2 Kings 2:9–15','2 Kings 5:1–14','2 Kings 9:1–10:28','Luke 4:27'] },
  { id:'joash', era:'divided', name:'Athaliah and the boy king Joash', date:'About 841–796 BC',
    text:'When Ahaziah of Judah was killed, his mother Athaliah, of the house of Ahab, seized the throne and destroyed the royal family. But the infant Joash was hidden in the temple for six years, and the priest Jehoiada then had him crowned. The line of David, on which God’s promise rested, survived in a single child. Joash repaired the temple, but after Jehoiada’s death he turned away.',
    refs:['2 Kings 11:1–21','2 Kings 12:1–16','2 Chronicles 24:15–22'] },
  { id:'jonah-amos-hosea', era:'divided', name:'Jonah, Amos and Hosea', date:'8th century BC',
    text:'Under Jeroboam II (about 793–753 BC) the northern kingdom grew prosperous, and Jonah prophesied the recovery of its borders (2 Kings 14:25). Jonah was also sent to Nineveh, and was displeased when it repented and was spared. Amos, a herdsman from Tekoa, denounced Israel’s injustice and empty worship, and Hosea, whose marriage to an unfaithful wife pictured Israel’s unfaithfulness, pleaded with the nation to return to the LORD before judgment fell.',
    refs:['2 Kings 14:23–27','Jonah 3:1–4:2','Amos 5:21–24','Hosea 1:2–3','Hosea 14:1–3'] },
  { id:'isaiah', era:'divided', name:'Isaiah and Micah', date:'About 740–680 BC',
    text:'In the year that King Uzziah died, Isaiah saw the Lord on his throne, and he went on to prophesy in Judah through the reigns of Jotham, Ahaz and Hezekiah. He foretold the virgin’s son Immanuel, the coming King of David’s line, and the suffering Servant who would bear the sins of many (Isaiah 53). His contemporary Micah announced that Israel’s ruler would come from Bethlehem (Micah 5:2). A later Jewish tradition says Isaiah was put to death under Manasseh.',
    refs:['Isaiah 6:1–8','Isaiah 7:14','Isaiah 9:6–7','Isaiah 52:13–53:12','Micah 5:2'] },
  { id:'samaria-falls', era:'divided', name:'The fall of Samaria', date:'722 BC', map:'empires',
    text:'Assyria had already taken Galilee and deported its people under Tiglath-pileser III (2 Kings 15:29). When King Hoshea rebelled, Shalmaneser V besieged Samaria for three years; the city fell in 722 BC, and Sargon II, who followed him, claimed the victory in his own records. The Israelites were deported and other peoples were settled in their place, one root of the later Samaritans. Kings explains why: Israel had sinned against the LORD and would not listen to his prophets.',
    refs:['2 Kings 15:29','2 Kings 17:1–23','2 Kings 17:24–41'] },
  { id:'hezekiah', era:'divided', name:'Hezekiah and Sennacherib', date:'701 BC', map:'empires',
    text:'Hezekiah of Judah (about 715–686 BC) cleansed the temple, restored the Passover and trusted the LORD. In 701 BC Sennacherib of Assyria took the fortified cities of Judah, including Lachish, and threatened Jerusalem. Hezekiah prayed, Isaiah promised deliverance, and the angel of the LORD struck the Assyrian camp. Sennacherib’s own annals boast that he shut Hezekiah up in Jerusalem “like a bird in a cage”, but do not claim that he took the city. The tunnel Hezekiah cut to bring water into Jerusalem can still be walked through today.',
    refs:['2 Kings 18:1–8','2 Kings 18:13–19:37','Isaiah 37:14–38','2 Chronicles 32:30'] },
  { id:'manasseh-josiah', era:'divided', name:'Manasseh and Josiah', date:'About 697–609 BC',
    text:'Manasseh reigned fifty-five years and led Judah into idolatry worse than that of the nations, shedding much innocent blood; yet when the Assyrians took him captive to Babylon he humbled himself, and God restored him (2 Chronicles 33:11–13). His grandson Josiah (640–609 BC) began to seek the LORD while still young. When the Book of the Law was found in the temple in 622 BC, he led a great reform and kept the Passover. He was killed at Megiddo opposing Pharaoh Neco, and the judgment on Judah, though delayed, was not turned back.',
    refs:['2 Kings 21:1–18','2 Chronicles 33:10–17','2 Kings 22:1–23:30'] },
  { id:'jeremiah', era:'divided', name:'Jeremiah', date:'About 627–580 BC',
    text:'Called as a young man in the thirteenth year of Josiah, Jeremiah warned Judah for some forty years that judgment would come by Babylon, and was mocked, beaten and imprisoned for it. He foretold seventy years of Babylonian rule, and promised a new covenant in which God would write his law on his people’s hearts, all of them would know him, and he would remember their sin no more (Jeremiah 31:31–34); Hebrews 8 applies it to the covenant made through Christ. After Jerusalem fell he was taken to Egypt against his will. Habakkuk, from the same years, wrote that the righteous shall live by his faith (Habakkuk 2:4).',
    refs:['Jeremiah 1:1–10','Jeremiah 25:8–14','Jeremiah 31:31–34','Hebrews 8:6–13','Habakkuk 2:4'] },
  { id:'nineveh-falls', era:'divided', name:'The fall of Nineveh', date:'612 BC', map:'empires',
    text:'Nahum and Zephaniah foretold the end of Nineveh, the proud capital of Assyria. In 612 BC it fell to the Babylonians and the Medes, and the last Assyrian resistance was crushed within a few years. In 605 BC Nebuchadnezzar of Babylon defeated Pharaoh Neco at Carchemish (Jeremiah 46:2), and Babylon became master of the region, Judah included.',
    refs:['Nahum 1:1','Nahum 3:1–7','Zephaniah 2:13–15','Jeremiah 46:2'] },

  // ── Exile & Return ─────────────────────────────────────────────────────
  { id:'first-exiles', era:'exile', name:'The first exiles: Daniel and Jehoiachin', date:'605 and 597 BC', map:'empires',
    text:'After Carchemish, Nebuchadnezzar took young men of Judah’s royal family and nobility to Babylon, Daniel and his three friends among them. When Jehoiakim later rebelled, Babylon besieged Jerusalem, and the Babylonian Chronicle records that the city was taken in March 597 BC. King Jehoiachin was carried off with the royal household, the craftsmen and thousands of others, among them the priest Ezekiel, and Zedekiah was set on the throne.',
    refs:['Daniel 1:1–7','2 Kings 24:1–17','Ezekiel 1:1–3'] },
  { id:'ezekiel', era:'exile', name:'Ezekiel among the exiles', date:'593–571 BC', map:'empires',
    text:'Among the exiles by the Chebar canal in Babylonia, Ezekiel saw the glory of the LORD in 593 BC. He warned that Jerusalem would fall and saw the glory depart from the temple. After the city fell he promised restoration: a new heart and a new spirit, the dry bones brought to life, and a new temple from which a river of life would flow. His last dated prophecy comes from 571 BC.',
    refs:['Ezekiel 1:1–3','Ezekiel 10:18–19','Ezekiel 36:24–28','Ezekiel 37:1–14','Ezekiel 47:1–12'] },
  { id:'jerusalem-falls', era:'exile', name:'The fall of Jerusalem and the temple', date:'586 BC', map:'empires',
    text:'Zedekiah rebelled against Babylon, against Jeremiah’s warnings. After a long siege the walls were breached; Zedekiah was captured, his sons were killed before his eyes, and he was blinded and taken to Babylon. A month later the Babylonians burned the temple, the palace and the houses of Jerusalem and took most of the remaining people into exile. Some date the fall to 587 BC. Lamentations mourns the city’s ruin and still hopes in the LORD’s steadfast love.',
    refs:['2 Kings 25:1–21','Jeremiah 39:1–10','Lamentations 3:21–24'] },
  { id:'daniel', era:'exile', name:'Daniel in Babylon', date:'605–about 536 BC', map:'empires',
    text:'Daniel served the kings of Babylon and Persia for some seventy years and kept faith with God. The book records his three friends delivered from the furnace, Belshazzar’s feast on the night Babylon fell, and Daniel delivered from the lions under Darius the Mede, whose identity is debated. Babylonian texts confirm that Belshazzar ruled in Babylon while his father Nabonidus was away. Daniel’s vision of one like a son of man receiving an everlasting kingdom (Daniel 7:13–14) lies behind the title Jesus most often used of himself, the Son of Man.',
    refs:['Daniel 1:1–21','Daniel 3:1–30','Daniel 5:1–31','Daniel 6:1–28','Daniel 7:13–14'] },
  { id:'cyrus', era:'exile', name:'Cyrus and the first return', date:'539–536 BC', map:'empires',
    text:'Cyrus the Persian took Babylon in 539 BC, as Isaiah had foretold by name (Isaiah 44:28–45:1). In his first year he decreed that the Jews might return and rebuild the house of the LORD in Jerusalem. The Cyrus Cylinder, found at Babylon, records his wider policy of returning peoples and their gods to their homes. Some fifty thousand returned under Zerubbabel and Jeshua, rebuilt the altar and laid the foundation of the temple.',
    refs:['Ezra 1:1–4','Ezra 2:64–65','Ezra 3:1–13','Isaiah 44:28–45:1'] },
  { id:'second-temple', era:'exile', name:'The second temple', date:'520–515 BC',
    text:'Opposition halted the work for years, until in 520 BC, the second year of Darius I, the prophets Haggai and Zechariah stirred Zerubbabel and Jeshua to build again. The temple was finished in 515 BC. To those who remembered Solomon’s temple it seemed as nothing (Haggai 2:3), but Haggai promised that the latter glory of this house would be greater than the former, and Zechariah foretold Zion’s king coming humble and mounted on a donkey (Zechariah 9:9).',
    refs:['Ezra 4:24–5:2','Ezra 6:13–18','Haggai 2:1–9','Zechariah 9:9'] },
  { id:'esther', era:'exile', name:'Esther', date:'About 483–473 BC', map:'empires',
    text:'In the reign of Ahasuerus, known to the Greeks as Xerxes I (486–465 BC), the Jewish orphan Esther became queen at Susa. When Haman obtained a decree to destroy all the Jews in the empire, Esther risked her life to plead with the king, and the Jews were delivered. God is never named in the book, yet his providence governs every turn of it. The feast of Purim keeps the deliverance in memory.',
    refs:['Esther 2:15–18','Esther 4:12–16','Esther 9:20–28'] },
  { id:'ezra', era:'exile', name:'Ezra the scribe', date:'458 BC',
    text:'In the seventh year of Artaxerxes I, Ezra, a priest and a scribe skilled in the law of Moses, led a second group of exiles to Jerusalem with the king’s authority. He had set his heart to study the law, to do it and to teach it in Israel, and he called the people to separate from the foreign marriages through which idolatry was returning. A minority of scholars date Ezra later, under Artaxerxes II.',
    refs:['Ezra 7:1–10','Ezra 9:1–10:5','Nehemiah 8:1–8'] },
  { id:'nehemiah', era:'exile', name:'Nehemiah rebuilds the walls', date:'445 BC',
    text:'Nehemiah, cupbearer to Artaxerxes I, wept when he heard that Jerusalem’s walls lay broken, and in the king’s twentieth year was sent there as governor. In spite of mockery and threats from Sanballat of Samaria and his allies, the wall was finished in fifty-two days. Ezra then read the law to the assembled people, who wept and were told to rejoice, for the joy of the LORD was their strength. Papyri from Elephantine in Egypt also name Sanballat as governor of Samaria.',
    refs:['Nehemiah 1:1–2:8','Nehemiah 4:1–23','Nehemiah 6:15–16','Nehemiah 8:1–12'] },
  { id:'malachi', era:'exile', name:'Malachi, the last of the prophets', date:'Mid-5th century BC',
    text:'Malachi rebuked priests and people for careless worship, broken marriages and robbing God in tithes. He promised that the Lord would send his messenger to prepare the way, and Elijah the prophet before the great day of the LORD. The New Testament finds both promises fulfilled in John the Baptist (Mark 1:2–4; Matthew 11:14). With Malachi the Old Testament prophets fall silent until John, some four centuries later.',
    refs:['Malachi 1:6–14','Malachi 3:1','Malachi 4:5–6','Mark 1:2–4','Matthew 11:14'] },

  // ── Between the Testaments ─────────────────────────────────────────────
  { id:'alexander', era:'between', name:'Alexander the Great', date:'336–323 BC',
    text:'Alexander of Macedon defeated the Persian armies at the Granicus (334 BC), Issus (333 BC) and Gaugamela (331 BC). In 332 BC he took Tyre after a long siege, then Gaza, and Judea passed under his rule. He died at Babylon in 323 BC, aged thirty-two. Greek became the common language of the eastern Mediterranean, and it was in this common Greek that the New Testament would be written. Daniel’s vision of the goat from the west with its great horn is widely read as foretelling him (Daniel 8:5–8, 21).',
    refs:['Daniel 8:5–8','Daniel 8:21–22'] },
  { id:'ptolemies', era:'between', name:'The Ptolemies and the Septuagint', date:'301–200 BC',
    text:'After Alexander’s death his generals divided his empire, and Judea came under the Ptolemies, the Greek kings of Egypt. A large Jewish community grew up in Alexandria, and there the Law of Moses was translated into Greek in the 3rd century BC, with the rest of the Old Testament following over the next century or so. This Greek Old Testament, the Septuagint, became the Bible of Greek-speaking Jews and is often quoted in the New Testament. Daniel 11 speaks of wars between “the king of the south” and “the king of the north”, widely read as the Ptolemies and the Seleucids.',
    refs:['Daniel 11:5–20'] },
  { id:'antiochus', era:'between', name:'Antiochus IV and the desecrated temple', date:'200–164 BC',
    text:'In about 200 BC the Seleucid king Antiochus III defeated the Egyptians at Panium and took Judea. His son Antiochus IV Epiphanes (175–164 BC) meddled in the high priesthood, and in 167 BC banned the Jewish law, forbade circumcision and the Sabbath, and set up a pagan altar in the temple. Many read Daniel 11:31 as foretelling this abomination, while Jesus spoke of a fulfilment still to come (Matthew 24:15).',
    refs:['Daniel 8:9–14','Daniel 11:21–35','Matthew 24:15'] },
  { id:'maccabees', era:'between', name:'The Maccabean revolt', date:'167–164 BC',
    text:'The aged priest Mattathias of Modein refused to sacrifice to the pagan gods and fled to the hills with his sons. His son Judas, called Maccabeus, led the revolt, and in December 164 BC the temple was cleansed and rededicated. The Feast of Dedication, or Hanukkah, recalls it, and Jesus was in the temple at that feast (John 10:22–23). The books of Maccabees, which tell the story, are valuable history, but, as the Reformed confessions hold, they are not part of Scripture.',
    refs:['John 10:22–23'] },
  { id:'hasmoneans', era:'between', name:'The Hasmonean kingdom', date:'142–63 BC',
    text:'Judas’s brother Simon won independence from the Seleucids in 142 BC, and his family, the Hasmoneans, ruled as high priests and later as kings. John Hyrcanus conquered Idumea and forced its people to be circumcised, and destroyed the Samaritan temple on Mount Gerizim (John 4:20). In these years the Pharisees and the Sadducees appear as parties, and the community at Qumran, whose library survives as the Dead Sea Scrolls, was founded.',
    refs:['John 4:20','Acts 23:6–8'] },
  { id:'pompey', era:'between', name:'Rome takes Jerusalem', date:'63 BC',
    text:'Rival Hasmonean brothers appealed to Rome, and in 63 BC the general Pompey took Jerusalem after a siege of the temple and entered the Most Holy Place. Judea became subject to Rome. Rome’s peace, its roads and its sea lanes would later carry the gospel across the empire, and it was a decree of Caesar Augustus that brought Joseph and Mary to Bethlehem (Luke 2:1–4).',
    refs:['Luke 2:1–4'] },
  { id:'herod', era:'between', name:'Herod the Great', date:'37–4 BC', map:'palestine',
    text:'Herod, an Idumean, was named king of Judea by the Roman Senate in 40 BC and took Jerusalem in 37 BC. He was a great builder: Caesarea with its harbour, the fortresses of Masada and Herodium, and above all a vast rebuilding of the temple, begun about 20 BC and still unfinished in Jesus’s day (John 2:20). He was also ruthless, putting to death a wife and three of his sons, which fits the slaughter of the boys of Bethlehem (Matthew 2:16). He died in 4 BC on the usual reckoning.',
    refs:['Matthew 2:1–18','Luke 1:5','John 2:20'] },

  // ── Life of Jesus ──────────────────────────────────────────────────────
  { id:'birth', era:'jesus', name:'The birth of Jesus', date:'About 6–4 BC', map:'palestine',
    text:'Jesus was born in Bethlehem to the virgin Mary, betrothed to Joseph, a descendant of David: “when the fullness of time had come, God sent forth his Son, born of woman”. Since Herod died in 4 BC on the usual reckoning, Jesus was born a little before that; our calendar, worked out in the 6th century, places his birth a few years too late. Luke links the journey to Bethlehem with a census under Augustus; how this relates to the governorship of Quirinius, usually dated AD 6, is a known question to which several answers have been given. After the flight into Egypt, Jesus grew up in Nazareth.',
    refs:['Matthew 1:18–2:23','Luke 2:1–20','Galatians 4:4–5'] },
  { id:'baptism', era:'jesus', name:'John the Baptist and the baptism of Jesus', date:'About AD 26–29', map:'palestine',
    text:'John the Baptist began preaching repentance in the fifteenth year of Tiberius (Luke 3:1), that is about AD 28 or 29, or a little earlier if the years are counted from when Tiberius began to share power. Jesus, about thirty years old, was baptised by John in the Jordan; the Spirit descended on him and the Father declared him his beloved Son. He was then tempted in the wilderness for forty days. John’s Gospel mentions at least three Passovers in his ministry, which therefore lasted about three years.',
    refs:['Luke 3:1–3','Luke 3:21–23','Matthew 3:13–4:11','John 2:13','John 6:4','John 11:55'] },
  { id:'galilee', era:'jesus', name:'Ministry in Galilee', date:'During the ministry', map:'palestine',
    text:'Making Capernaum his base, Jesus called his disciples, chose the twelve, preached the kingdom of God in the synagogues, healed the sick and cast out demons. He taught the Sermon on the Mount, calmed the storm on the Sea of Galilee, and fed five thousand men near Bethsaida. His first sign, turning water into wine, was at Cana, and he was rejected in his home town of Nazareth (Luke 4:16–30).',
    refs:['Mark 1:14–39','Matthew 5:1–7:29','John 2:1–11','Luke 9:10–17'] },
  { id:'confession', era:'jesus', name:'Peter’s confession and the transfiguration', date:'During the ministry', map:'palestine',
    text:'Near Caesarea Philippi, Jesus asked his disciples who they said he was, and Simon Peter replied, “You are the Christ, the Son of the living God.” From then on Jesus began to show them that he must suffer, be killed and be raised on the third day. Days later Peter, James and John saw him transfigured on a high mountain, traditionally Mount Tabor, though many suggest Mount Hermon. Then he set his face to go to Jerusalem (Luke 9:51).',
    refs:['Matthew 16:13–28','Matthew 17:1–8','Luke 9:51'] },
  { id:'last-week', era:'jesus', name:'The last week in Jerusalem', date:'AD 30 or 33', map:'palestine',
    text:'Jesus entered Jerusalem riding on a donkey, as Zechariah had foretold, and cleansed the temple. He taught in its courts, and on the night he was betrayed, at the Passover meal, he instituted the Lord’s Supper. After praying in Gethsemane he was arrested, tried before the high priest Caiaphas and the Council, and handed over to Pontius Pilate, the Roman prefect of Judea from AD 26 to 36. A stone naming Pilate as prefect was found at Caesarea in 1961.',
    refs:['Matthew 21:1–17','Luke 22:7–23','Mark 14:32–65','John 18:28–19:16'] },
  { id:'crucifixion', era:'jesus', name:'The crucifixion', date:'AD 30 or 33', map:'palestine',
    text:'Jesus was crucified outside Jerusalem under Pontius Pilate on the Friday of Passover week. The two dates most widely held are 7 April AD 30 and 3 April AD 33; the Gospels, the reign of Tiberius and the Jewish calendar fit both. The Roman historian Tacitus also records that Christ was executed by Pilate in the reign of Tiberius. On the cross he bore our sins in his body (1 Peter 2:24), and said, “It is finished”.',
    refs:['Mark 15:1–39','John 19:16–30','1 Corinthians 15:3','1 Peter 2:24'] },
  { id:'resurrection', era:'jesus', name:'The resurrection and ascension', date:'AD 30 or 33', map:'palestine',
    text:'On the third day the tomb was found empty, and the risen Jesus appeared to Mary Magdalene, to Peter, to the twelve and to more than five hundred at one time (1 Corinthians 15:3–8). For forty days he showed himself alive and spoke about the kingdom of God (Acts 1:3). Then, near Bethany on the Mount of Olives, he was taken up into heaven, promising the Holy Spirit and his return.',
    refs:['Luke 24:1–53','John 20:1–29','1 Corinthians 15:3–8','Acts 1:1–11'] },

  // ── Apostolic Age ──────────────────────────────────────────────────────
  { id:'pentecost', era:'apostolic', name:'Pentecost', date:'AD 30 or 33',
    text:'Fifty days after Passover, at the Feast of Pentecost, the Holy Spirit was poured out on the disciples in Jerusalem, and Jews from many nations heard the mighty works of God in their own languages. Peter preached Christ crucified and risen, the fulfilment of Joel’s prophecy, and called his hearers to repent and be baptised. Luke records that “those who received his word were baptized”, about three thousand that day.',
    refs:['Acts 2:1–41','Joel 2:28–32'] },
  { id:'saul-converted', era:'apostolic', name:'Stephen, and the conversion of Saul', date:'About AD 31–36', map:'paul',
    text:'Stephen, one of the seven chosen to serve the church’s widows, was stoned after his defence before the Council, and Saul of Tarsus approved. The persecution that followed scattered the believers through Judea and Samaria, and Philip preached in Samaria. On the road to Damascus the risen Jesus appeared to Saul, who was baptised and began at once to proclaim that Jesus is the Son of God. Three years later he went up to Jerusalem to see Peter (Galatians 1:18).',
    refs:['Acts 6:1–8:8','Acts 9:1–22','Galatians 1:13–18'] },
  { id:'gentiles', era:'apostolic', name:'The gospel to the Gentiles', date:'About AD 37–44', map:'paul',
    text:'At Caesarea the Roman centurion Cornelius and his household heard Peter preach, received the Holy Spirit and were baptised, and the church in Jerusalem praised God that he had given the Gentiles repentance too. At Antioch in Syria, where many Greeks believed, the disciples were first called Christians. In about AD 44 King Herod Agrippa I killed James the brother of John and imprisoned Peter, who was freed by an angel; Herod himself died soon afterwards.',
    refs:['Acts 10:1–48','Acts 11:1–26','Acts 12:1–23'] },
  { id:'journey-1', era:'apostolic', name:'Paul’s first missionary journey', date:'About AD 46–48', map:'paul',
    text:'Set apart by the Holy Spirit and sent off by the church at Antioch, Barnabas and Saul sailed to Cyprus, where the proconsul Sergius Paulus believed. From Perga they went inland to Pisidian Antioch, Iconium, Lystra and Derbe, where many Gentiles believed, and at Lystra Paul was stoned and left for dead. On the way back they appointed elders in every church, and at Antioch they reported how God had opened a door of faith to the Gentiles.',
    refs:['Acts 13:1–14:28'] },
  { id:'jerusalem-council', era:'apostolic', name:'The Council of Jerusalem', date:'About AD 49',
    text:'Teachers from Judea insisted that Gentile believers must be circumcised and keep the law of Moses to be saved. The apostles and elders met in Jerusalem; Peter declared that we are saved through the grace of the Lord Jesus, just as the Gentiles are, and James agreed. The council’s letter laid no such burden on the Gentiles. Paul’s letter to the Galatians, defending justification by faith apart from works of the law, may have been written shortly before the council, though many date it later.',
    refs:['Acts 15:1–35','Galatians 2:15–16'] },
  { id:'journey-2', era:'apostolic', name:'Paul’s second missionary journey', date:'About AD 49–52', map:'paul',
    text:'Paul set out with Silas, took Timothy with him at Lystra, and was called by a vision to Macedonia. Churches were planted at Philippi, Thessalonica and Berea, often amid opposition, and at Athens Paul addressed the council of the Areopagus. He stayed eighteen months at Corinth, from where he wrote 1 and 2 Thessalonians. An inscription at Delphi dates Gallio’s time as proconsul of Achaia (Acts 18:12) to about AD 51–52, one of the fixed points of New Testament chronology.',
    refs:['Acts 15:36–18:22','Acts 16:6–10','Acts 17:16–34'] },
  { id:'journey-3', era:'apostolic', name:'Paul’s third missionary journey', date:'About AD 53–57', map:'paul',
    text:'After strengthening the churches of Galatia and Phrygia, Paul spent about three years at Ephesus, where the word of the Lord spread through the province of Asia until a riot broke out over the trade in silver shrines of Artemis. He wrote 1 Corinthians from Ephesus, 2 Corinthians from Macedonia and Romans from Corinth. On his way to Jerusalem with a collection for the poor, he said farewell to the Ephesian elders at Miletus.',
    refs:['Acts 18:23–21:16','Acts 19:8–41','Acts 20:17–38','Romans 15:25–28'] },
  { id:'voyage-rome', era:'apostolic', name:'Arrest, and the voyage to Rome', date:'About AD 57–62', map:'rome',
    text:'In Jerusalem Paul was seized in the temple and rescued by Roman soldiers, and was then held for two years at Caesarea under the governor Felix. When Festus succeeded Felix, Paul appealed to Caesar. On the voyage to Rome the ship was wrecked on Malta in a storm, but all on board reached land safely. At Rome Paul lived for two years under guard at his own expense, preaching the kingdom of God without hindrance (Acts 28:30–31); Ephesians, Philippians, Colossians and Philemon are often dated to this imprisonment.',
    refs:['Acts 21:27–36','Acts 24:27–25:12','Acts 27:1–28:16','Acts 28:30–31'] },
  { id:'nero', era:'apostolic', name:'Nero’s persecution and the deaths of Peter and Paul', date:'AD 64–about 67', map:'rome',
    text:'After the great fire of Rome in AD 64, the emperor Nero blamed the Christians and put many to death, as Tacitus records. Second Timothy, Paul’s last letter, was written from prison as he awaited death. Early Christian writers record that Peter and Paul died as martyrs, and the tradition is that both died at Rome under Nero. In Jerusalem, James the brother of the Lord had been put to death in AD 62.',
    refs:['2 Timothy 4:6–8','1 Peter 5:13','John 21:18–19'] },
  { id:'jerusalem-ad70', era:'apostolic', name:'The fall of Jerusalem', date:'AD 70', map:'palestine',
    text:'The Jewish revolt against Rome began in AD 66. After a long siege, the Roman army under Titus took Jerusalem in AD 70 and burned the temple, as Jesus had foretold: not one stone would be left upon another. Eusebius records that the Christians of Jerusalem had fled to Pella beyond the Jordan. The last rebel stronghold, Masada, fell in AD 73 or 74, and the Arch of Titus in Rome still shows the temple’s lampstand carried in triumph.',
    refs:['Mark 13:1–2','Luke 19:41–44','Luke 21:20–24'] },
  { id:'patmos', era:'apostolic', name:'John on Patmos', date:'About AD 95', map:'paul',
    text:'The apostle John was on the island of Patmos “on account of the word of God and the testimony of Jesus”, traditionally as an exile, when he received the visions of the book of Revelation, which ends with the new heaven and the new earth. Irenaeus, writing about AD 180, dates the visions to the end of the reign of Domitian (AD 81–96); some date the book before AD 70. Early tradition places John’s last years, and his Gospel and letters, at Ephesus.',
    refs:['Revelation 1:9–11','Revelation 21:1–5','Revelation 22:20'] },
];

// ── State ───────────────────────────────────────────────────────────────────
let activeFilter = 'all';
const mapShow = {};
const mapZoom = {};

function init() { buildFilterBar(); render(); }

function buildFilterBar() {
  document.getElementById('filterBar').innerHTML = FILTERS.map(f =>
    `<button class="filter-btn${f.id===activeFilter?' active':''}" onclick="selectFilter('${f.id}')">${f.label}</button>`
  ).join('');
}

function selectFilter(id) { activeFilter = id; buildFilterBar(); render(); }

function resetPage() { activeFilter = 'all'; buildFilterBar(); render(); window.scrollTo({top:0,behavior:'smooth'}); }

function filtered() {
  if (activeFilter === 'all') return TIMELINE.slice();
  if (activeFilter === 'maps') return [];
  return TIMELINE.filter(e => e.era === activeFilter);
}

function eraOf(id) { return FILTERS.find(f => f.id === id) || { label:id }; }
function mapOf(id) { return MAPS.find(m => m.id === id); }

function render() {
  const list = filtered();
  buildIndex(list);
  let html = '';
  FILTERS.filter(f => f.span).forEach(f => {
    const group = list.filter(e => e.era === f.id);
    if (!group.length) return;
    html += `<div class="era-head">${f.label}</div><div class="era-span">${f.span}</div><div class="tl-list">`;
    group.forEach(e => { html += entryCard(e); });
    html += '</div>';
  });
  if (activeFilter === 'all' || activeFilter === 'maps') html += mapsSection();
  document.getElementById('mainContent').innerHTML = html || '<div class="no-results">Nothing found for this filter.</div>';
  MAPS.forEach(m => applyLayer(m.id));
  if (typeof linkifyScripture === 'function') linkifyScripture(document.getElementById('mainContent'), null, null);
}

function entryCard(e) {
  const m = e.map && mapOf(e.map);
  return `
<article class="tl-card" id="tl-${e.id}">
  <div class="tl-date">${e.date}</div>
  <h3 class="tl-name">${e.name}</h3>
  <div class="tl-text">${e.text}</div>
  ${e.refs && e.refs.length ? `<div class="tl-refs"><span class="tl-refs-label">Scripture</span>${e.refs.join('; ')}</div>` : ''}
  ${m ? `<a class="see-map" href="#map-${m.id}" onclick="return showMap('${m.id}')">See map: ${m.title}</a>` : ''}
</article>`;
}

function swatch(cls) {
  if (cls === 'border') return '<svg width="28" height="10" aria-hidden="true"><path class="mp-swatch-border" d="M1,5H27"/></svg>';
  if (cls === 'area') return '<svg width="22" height="14" aria-hidden="true"><rect class="mp-swatch-area" x="1" y="1" width="20" height="12"/></svg>';
  return `<svg width="28" height="10" aria-hidden="true"><path class="mp-route ${cls}" d="M2,5H26"/></svg>`;
}

function mapsSection() {
  let html = '<div class="era-head" id="maps">Maps</div><p class="map-intro">Simple maps for finding your way. Coastlines and positions are approximate.</p>';
  MAPS.forEach(m => {
    if (!(m.id in mapShow)) mapShow[m.id] = m.show || 'all';
    const layers = (m.layers || []).map(([id, label]) =>
      `<button class="map-btn${mapShow[m.id]===id?' active':''}" data-layer="${id}" onclick="setLayer('${m.id}','${id}')">${label}</button>`).join('');
    const legend = (m.legend || []).map(([cls, label]) => `<span class="lg-item">${swatch(cls)}<span>${label}</span></span>`).join('');
    const entries = TIMELINE.filter(e => e.map === m.id).map(e =>
      `<span class="map-entry-link" onclick="jumpEntry('${e.id}')">${e.name}</span>`).join(' ');
    html += `
<figure class="map-fig${mapZoom[m.id]?' zoomed':''}" id="map-${m.id}">
  <figcaption class="map-title">${m.title}</figcaption>
  <div class="map-tools">${layers}<button class="map-btn zoom-btn" onclick="toggleZoom('${m.id}')">${mapZoom[m.id]?'Fit to screen':'Enlarge'}</button></div>
  <div class="map-scroll">${MAPSVG[m.id]}</div>
  ${legend ? `<div class="map-legend">${legend}</div>` : ''}
  <div class="map-caption">${m.caption}</div>
  ${entries ? `<div class="map-entries"><span class="map-entries-label">On the timeline</span>${entries}</div>` : ''}
</figure>`;
  });
  return html;
}

function applyLayer(id) {
  const fig = document.getElementById('map-' + id);
  if (!fig) return;
  const show = mapShow[id] || 'all';
  fig.querySelectorAll('g.lyr').forEach(g => {
    g.style.display = (show === 'all' || g.classList.contains('lyr-' + show)) ? '' : 'none';
  });
  fig.querySelectorAll('.map-btn[data-layer]').forEach(b => b.classList.toggle('active', b.dataset.layer === show));
}

function setLayer(id, layer) { mapShow[id] = layer; applyLayer(id); }

function toggleZoom(id) {
  mapZoom[id] = !mapZoom[id];
  const fig = document.getElementById('map-' + id);
  if (!fig) return;
  fig.classList.toggle('zoomed', mapZoom[id]);
  fig.querySelector('.zoom-btn').textContent = mapZoom[id] ? 'Fit to screen' : 'Enlarge';
}

// "See map": switch to the maps if the map is not on the page, then go to it.
function showMap(id) {
  if (!document.getElementById('map-' + id)) selectFilter('maps');
  jumpTo('map-' + id);
  return false;
}

// From a map back to an entry, showing all eras if it is hidden.
function jumpEntry(id) {
  if (!document.getElementById('tl-' + id)) selectFilter('all');
  jumpTo('tl-' + id);
}

// Search lands on #tl-<id>: make sure that entry is on the page.
window.searchReveal = function (id) {
  if (!document.getElementById(id)) { activeFilter = 'all'; buildFilterBar(); render(); }
};

function buildIndex(list) {
  const items = (list.length ? list : TIMELINE).map(e =>
    `<span class="index-chip" onclick="jumpEntry('${e.id}')">${e.name}</span>`);
  document.getElementById('indexChips').innerHTML = items.join('');
}

function jumpTo(id) { const el=document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }

function toggleIndex() {
  const chips = document.getElementById('indexChips');
  const btn = document.querySelector('.index-toggle');
  chips.classList.toggle('open');
  btn.textContent = chips.classList.contains('open') ? '▲ Browse all entries' : '▼ Browse all entries';
}

init();
</script>
